const PAGES = [{"id": "01-architecture", "md": "# 01. 아키텍처\n\n## 한 줄 요약\n\n사무실 Mac 한 대 위에서 **Terraform → Docker** 로 `nginx(80) → Spring Boot(8080, 내부 전용)` 를 구성한다.\n도메인 구매 전이므로 **공인 IP + 공유기 포트포워딩** 으로 외부 접근한다.\n\n## 요청 흐름\n\n```mermaid\nflowchart LR\n    U[외부 사용자] -->|http://공인IP:포트| R[사무실 공유기<br/>NAT / 포트포워딩]\n    R -->|192.168.45.x:80| M[사무실 Mac<br/>Docker Desktop]\n    subgraph M[사무실 Mac · Docker Desktop]\n      direction LR\n      N[nginx<br/>:80 공개] -->|claudharmony-office 네트워크<br/>hello-app:8080| A[hello-app<br/>Spring Boot]\n    end\n```\n\n- 외부에 열리는 포트는 **nginx 80 하나뿐**. Spring Boot 컨테이너는 호스트 포트를 바인딩하지 않는다.\n- nginx 는 Docker 내장 DNS(`127.0.0.11`)로 upstream 을 **매 요청 resolve** → 앱 컨테이너가 재생성되어도 502 없음.\n\n## 디렉토리 구조\n\n```\ninfra/\n├── apps/                     # 배포 대상 애플리케이션 소스\n│   └── hello/                # Spring Boot 3.5 / Java 21 (\"안녕하세요 클라우드 하모니\")\n├── modules/                  # 재사용 Terraform 모듈 (= 클라우드 서비스 단위)\n│   ├── network/              # VPC 역할      → docker_network\n│   ├── app-service/          # Compute 역할  → docker build + docker_container (내부 전용)\n│   └── reverse-proxy/        # Load Balancer → nginx 컨테이너 + 라우팅 템플릿\n├── envs/\n│   └── office/               # 사무실 환경 (루트 모듈)\n│       ├── main.tf\n│       ├── services.auto.tfvars.json   # ★ 서비스 카탈로그 (어드민 콘솔이 수정할 파일)\n│       └── terraform.tfvars.example\n├── scripts/infra.sh          # plan/apply/status/logs/check 래퍼\n└── docs/                     # 이 문서 (md + index.html)\n```\n\n## 클라우드 개념 매핑\n\n| 클라우드 (AWS / GCP)            | 여기서의 구현                         | 모듈                 |\n|---------------------------------|---------------------------------------|----------------------|\n| VPC / VPC Network               | Docker bridge 네트워크                | `modules/network`    |\n| EC2·ECS / Cloud Run             | Docker 컨테이너 (이미지 로컬 빌드)    | `modules/app-service`|\n| ALB / Cloud Load Balancing      | nginx 리버스 프록시 (경로 라우팅)     | `modules/reverse-proxy` |\n| ECR / Artifact Registry         | 로컬 Docker 이미지 (`claudharmony/*`) | (향후 레지스트리)    |\n| Resource Tags / Labels          | Docker label `claudharmony.*`         | 전 모듈 공통         |\n| Internet Gateway + Public IP    | 사무실 공유기 NAT + 포트포워딩        | 수동 (02 문서)       |\n\n## 설계 결정\n\n| 결정 | 이유 |\n|------|------|\n| 이미지 빌드는 `local-exec docker build` | kreuzwerker/docker provider 의 legacy builder 가 Docker Desktop(containerd image store)에서 `invalid response status 403` 으로 실패. CLI(BuildKit) 빌드는 정상 |\n| 이미지 태그 = 소스 해시(12자) | 소스가 바뀔 때만 재빌드·재배포. `latest` 태그도 함께 붙임 |\n| 서비스는 JSON 카탈로그로 선언 | 어드민 콘솔이 HCL 을 건드리지 않고 데이터만 바꾸면 되게 하기 위함 (04 문서) |\n| 모든 리소스에 `claudharmony.*` label | 콘솔/스크립트에서 \"Terraform 이 관리하는 리소스\" 를 조회하기 위함 |\n| state 는 당분간 local | 1인·1대 운영. 콘솔 단계에서 원격 backend 로 전환 |\n"}, {"id": "02-office-network", "md": "# 02. 사무실 네트워크 구성\n\n> 이 저장소는 **public** 입니다. 실제 공인 IP / MAC 주소는 여기 적지 않고 `<PUBLIC_IP>`, `<MAC>` 으로 표기합니다.\n> 실제 값은 개인 Obsidian 노트(`클라우드하모니/인프라 구성/02 사무실 네트워크`)에 있습니다.\n\n## 토폴로지 — 이중 NAT\n\n```mermaid\nflowchart TB\n    INET((인터넷))\n    subgraph UP[상위망 192.168.75.0/24]\n      GNT[GNT2400 공유기<br/>WAN: 공인 IP<br/>LAN: 192.168.75.1<br/>관리페이지 :80]\n    end\n    subgraph OFFICE[사무실 LAN 192.168.45.0/24]\n      SK[SK브로드밴드 GW-ME611R<br/>WAN: 192.168.75.142 (DHCP)<br/>LAN: 192.168.45.1]\n      MAC[MacBook Pro M4 Max<br/>192.168.45.214 · Wi-Fi 2.4G<br/>Docker Desktop · nginx:80]\n    end\n    INET --- GNT --- SK\n    SK -- Wi-Fi --- MAC\n```\n\n> 공유기가 **2단**이다. 외부 공개하려면 **두 공유기 모두** 포트포워딩이 필요하다.\n> (처음엔 공인 IP:80 에서 로그인 화면이 보여 단일 NAT 로 오판했는데, 그건 상위 GNT2400 의 관리페이지였다.)\n\n## 현재 값 (2026-10-24 측정)\n\n| 항목 | 값 | 비고 |\n|------|----|------|\n| 서버 호스트 | MacBook Pro (Apple M4 Max, 48GB) | macOS 15.5 |\n| 서버 LAN IP | `192.168.45.214` (DHCP) | **DHCP 고정 할당 필요** |\n| 서브넷 | `192.168.45.0/24` (255.255.255.0) | |\n| 1차 공유기 (사무실) | SK GW-ME611R, LAN `192.168.45.1`, WAN `192.168.75.142` | WAN IP 는 상위 DHCP → 고정 필요 |\n| 2차 공유기 (상위) | GNT2400, LAN `192.168.75.1` | 공인 IP 보유. 관리페이지가 공인 IP:80 에서 응답 |\n| DNS | ISP 제공 DNS 2개 | |\n| 공인 IP | `<PUBLIC_IP>` (상위 GNT2400 WAN) | **이중 NAT** → 포트포워딩 2번 |\n| 공인 IP 성격 | 유동 IP 일 가능성 높음 | 바뀌면 접속 주소도 바뀜 → DDNS 권장 |\n| DHCP 임대 | 6시간 | |\n| macOS 방화벽 | 꺼짐 | |\n| Docker Desktop | 포트 80 → nginx | 다른 프로젝트가 5432/5433/6333/8080 사용 중 (충돌 없음) |\n\n## 외부 접근을 위한 공유기 설정 (수동 작업)\n\n공인 IP 의 **80 포트는 공유기 관리 페이지가 사용 중**이라 그대로 포워딩할 수 없다. 두 가지 중 하나를 선택:\n\n### 포트포워딩 (2단)\n\n| 공유기 | 프로토콜 | 외부 포트 | 내부 IP | 내부 포트 | 상태 |\n|--------|----------|-----------|---------|-----------|------|\n| GNT2400 (192.168.75.1) | TCP | `8888` | `192.168.75.142` | `8888` | ⏳ 관리자 계정 필요 |\n| SK GW-ME611R (192.168.45.1, NAT/라우터 → 포트포워드) | TCP | `8888` | `192.168.45.214` | `80` | ✅ 2026-10-24 |\n\n→ 접속 주소: `http://<PUBLIC_IP>:8888/`\n\n외부 80 은 GNT2400 관리페이지가 점유 중이라 8888 사용. GNT2400 의 원격 관리는 끄는 것을 권장.\n\n### 현재 외부 공개 방식: Cloudflare Quick Tunnel (2026-10-24 ~)\n\nGNT2400 관리자 계정이 없어 포트포워딩 불가 → 터널로 공개 중.\n\n```\n외부 → https://<랜덤>.trycloudflare.com → Cloudflare → tunnel 컨테이너 → nginx:80 → hello-app\n```\n\n| 항목 | 내용 |\n|------|------|\n| 컨테이너 | `tunnel` (`cloudflare/cloudflared:2025.10.0`, `--restart unless-stopped`, 네트워크 `claudharmony-office`) |\n| 현재 주소 확인 | `scripts/infra.sh url` |\n| 주의 | 컨테이너 재시작 시 **주소가 바뀜**. 주소를 아는 누구나 접속 가능 |\n| 관리 | 현재 `docker run` 으로 수동 기동 (Terraform 미관리). `modules/tunnel` 은 준비됨 → `envs/office/main.tf` 에 연결 예정 |\n| 고정 주소 | 도메인 구매 → Cloudflare named tunnel 로 전환 |\n\n### 상위 공유기 권한이 없을 때\n\nCloudflare Tunnel (`cloudflared tunnel --url http://localhost:80`) — Mac 에서 바깥으로 연결하므로 NAT 단수·포트포워딩과 무관.\n\n$1\n\n1. **DHCP 고정 할당 (2곳)**: SK 공유기에서 Mac `<MAC>` → `192.168.45.214`, GNT2400 에서 SK WAN MAC → `192.168.75.142`. 안 하면 IP 가 바뀌어 포워딩이 끊김.\n2. **Mac 절전 방지**: 노트북이 잠들면 서비스도 내려감.\n   ```bash\n   sudo pmset -c sleep 0 disksleep 0   # 전원 연결 시 잠자기 끄기\n   ```\n   Docker Desktop → Settings → General → *Start Docker Desktop when you sign in* 체크.\n3. **(가능하면) 유선 연결**: 현재 Wi-Fi. 서버 용도면 유선이 안정적.\n\n### 검증\n\n```bash\nscripts/infra.sh check                     # 사무실 안: localhost / LAN 확인\ncurl http://<PUBLIC_IP>:8888/              # 사무실 밖(휴대폰 LTE 등)에서 확인\n```\n\n> 사무실 내부에서 공인 IP 로 접속하면 공유기의 NAT loopback(헤어핀) 지원 여부에 따라 실패할 수 있다. 외부 검증은 반드시 **사무실 밖 네트워크**에서.\n\n## 도메인 구매 후\n\n1. DNS A 레코드 → `<PUBLIC_IP>` (유동이면 Cloudflare DDNS 등)\n2. `envs/office/terraform.tfvars` 의 `server_name = \"도메인\"`\n3. TLS: 443 포워딩 + Let's Encrypt (certbot 컨테이너 or Cloudflare proxy) — `reverse-proxy` 모듈 확장 예정\n4. 대안: **Cloudflare Tunnel** — 포트포워딩 없이 외부 공개 가능, 공인 IP 노출 없음\n"}, {"id": "03-operations", "md": "# 03. 운영 가이드 (Runbook)\n\n## 사전 요구사항\n\n| 도구 | 확인된 버전 |\n|------|-------------|\n| Terraform | 1.15.x |\n| Docker Desktop | 27.x (`unix:///var/run/docker.sock`) |\n| kreuzwerker/docker provider | 3.9.x |\n\nJDK 는 호스트에 필요 없음 — 앱은 Docker 멀티스테이지(`gradle:8.14-jdk21` → `eclipse-temurin:21-jre`)로 빌드.\n\n## 처음 구성\n\n```bash\ngit clone git@github.com:ParkSeWoo/claudharmony-infra.git ~/infra\ncd ~/infra\nscripts/infra.sh init\nscripts/infra.sh apply\nscripts/infra.sh check\n```\n\n## 자주 쓰는 명령\n\n| 목적 | 명령 |\n|------|------|\n| 변경 미리보기 | `scripts/infra.sh plan` |\n| 적용 | `scripts/infra.sh apply` |\n| 상태 | `scripts/infra.sh status` |\n| 로그 | `scripts/infra.sh logs hello-app` / `logs nginx` |\n| 접속 점검 | `scripts/infra.sh check` |\n| 전부 내리기 | `scripts/infra.sh destroy` |\n| nginx 실제 설정 보기 | `docker exec nginx cat /etc/nginx/conf.d/default.conf` |\n\n## 서비스 추가하기 (예: `api`)\n\n1. `apps/api/` 에 Dockerfile 이 있는 앱 추가\n2. `envs/office/services.auto.tfvars.json` 에 한 줄 추가:\n   ```json\n   \"api\": { \"source_dir\": \"apps/api\", \"port\": 8080, \"route_path\": \"/api/\" }\n   ```\n3. `scripts/infra.sh apply` → 이미지 빌드, 컨테이너 생성, nginx 라우트 자동 추가\n\n`route_path` 를 생략하면 외부에 노출되지 않는 **내부 전용 서비스**가 된다.\n\n## 앱 코드 수정 → 배포\n\n소스 해시가 이미지 태그이므로 코드만 고치고 `apply` 하면 된다. 변경이 없으면 아무것도 하지 않는다.\n\n## Git 워크플로\n\n```bash\ngit checkout -b feat/xxx\nscripts/infra.sh plan          # plan 결과를 PR 에 붙인다\ngit commit / push → PR → merge\ngit checkout main && git pull && scripts/infra.sh apply\n```\n\n커밋하지 않는 것: `*.tfstate*`, `.terraform/`, `*.tfvars` (예시 파일 제외) — `.gitignore` 로 처리됨.\n\n## 트러블슈팅\n\n| 증상 | 원인 / 조치 |\n|------|-------------|\n| `Error running legacy build ... 403` | provider 내장 빌드 문제. 이 저장소는 이미 CLI 빌드 사용 중 |\n| 502 Bad Gateway | 앱 기동 중(약 10~20초). `scripts/infra.sh status` 에서 `healthy` 확인 |\n| `port is already allocated` (80) | 다른 프로세스가 80 사용. `lsof -nP -iTCP:80 -sTCP:LISTEN` / `public_port` 변경 |\n| 외부에서 안 됨, 내부는 됨 | 공유기 포트포워딩·DHCP 고정·공인 IP 변경 여부 확인 (02 문서) |\n| 공인 IP 로 접속하면 공유기 로그인 화면 | 80 이 공유기 관리페이지로 감. 02 문서 방법 A/B |\n| plan 에 계속 변경이 뜸 | Docker 기본값 드리프트. 해당 속성을 모듈에 명시 (예: `memory_swap`) |\n"}, {"id": "04-admin-console-roadmap", "md": "# 04. 어드민 콘솔 로드맵 — \"우리만의 AWS/GCP 콘솔\"\n\n목표: 웹 콘솔에서 서비스 생성·배포·중지·삭제, 상태/로그 확인을 하고, 그 뒤에서는 **Terraform 이 실제 인프라를 관리**하는 구조.\n\n## 핵심 원칙\n\n1. **Terraform 이 단일 진실 원천(Source of Truth)** — 콘솔은 Docker 를 직접 조작하지 않는다. 직접 조작하면 state 와 어긋난다(드리프트).\n2. **콘솔은 데이터만 바꾼다** — HCL 은 사람이 리뷰하는 코드, 콘솔은 `services.auto.tfvars.json` (서비스 카탈로그)만 생성/수정.\n3. **변경은 plan → 승인 → apply** — 클라우드 콘솔의 \"검토 후 생성\" 화면이 곧 `terraform plan` 결과.\n4. **조회는 label 기반** — `claudharmony.managed-by=terraform`, `claudharmony.environment`, `claudharmony.service`.\n\n## 이미 깔아둔 기반\n\n| 기반 | 위치 | 콘솔에서의 용도 |\n|------|------|-----------------|\n| 서비스 카탈로그 JSON | `envs/office/services.auto.tfvars.json` | \"서비스 생성\" 폼 → JSON 수정 |\n| 타입이 있는 변수 스키마 | `envs/office/variables.tf` 의 `services` | 폼 필드 / 검증 규칙의 근거 |\n| 기계가 읽는 출력 | `terraform output -json services` | 서비스 목록 화면 |\n| 리소스 label | 전 모듈 | 실시간 상태 (`docker ps --filter label=...`) |\n| 모듈 = 클라우드 서비스 단위 | `modules/*` | 콘솔 메뉴 (VPC / Compute / Load Balancer) |\n| 환경 디렉토리 | `envs/<env>` | 콘솔의 \"프로젝트 / 리전\" 선택 |\n\n## 목표 아키텍처\n\n```mermaid\nflowchart LR\n    UI[Admin Console<br/>React / Next.js] --> API[Console API<br/>Spring Boot]\n    API -->|1. 카탈로그 수정<br/>Git commit/PR| GIT[(GitHub<br/>claudharmony-infra)]\n    API -->|2. plan / apply 작업 큐| RUN[Terraform Runner<br/>컨테이너]\n    RUN -->|state| ST[(원격 State<br/>MinIO/S3 + lock)]\n    RUN -->|provider| DK[Docker / 이후 Kubernetes]\n    API -->|상태·로그 조회<br/>read-only| DK\n    API --> DB[(콘솔 DB<br/>작업 이력·감사로그)]\n```\n\n## 단계별 계획\n\n| 단계 | 내용 | 산출물 |\n|------|------|--------|\n| **0. 지금** | Terraform + 모듈 + JSON 카탈로그, 수동 apply | 이 저장소 |\n| 1. Read-only 콘솔 | 서비스 목록/상태/로그 화면 (`output -json` + Docker API label 조회) | `apps/console-api`, `apps/console-web` |\n| 2. 원격 state | local → MinIO(S3 호환) backend + lock. 콘솔/사람이 같은 state 사용 | `envs/*/versions.tf` backend 변경 |\n| 3. Runner | 콘솔 API 가 `terraform plan/apply` 를 작업 큐로 실행, 결과·로그 저장, 동시 실행 lock | `apps/tf-runner` |\n| 4. Write 콘솔 | 서비스 생성/수정/삭제 폼 → JSON 변경 → plan 미리보기 → 승인 → apply | GitOps: 콘솔이 PR 생성 → merge 시 apply |\n| 5. 인증·권한 | 로그인, 역할(Owner/Developer/Viewer), 감사 로그 | IAM 화면 |\n| 6. 확장 | 도메인/TLS, 이미지 레지스트리, 모니터링(Prometheus/Grafana), Kubernetes 백엔드 | 05 문서 |\n\n## 콘솔 API 초안\n\n| Method | Path | 동작 |\n|--------|------|------|\n| GET | `/api/envs` | 환경 목록 (`envs/*`) |\n| GET | `/api/envs/{env}/services` | 카탈로그 + `output -json` + 실시간 상태 병합 |\n| POST | `/api/envs/{env}/services` | 카탈로그에 추가 → plan 작업 생성 |\n| PATCH/DELETE | `/api/envs/{env}/services/{name}` | 수정/삭제 → plan 작업 생성 |\n| POST | `/api/runs/{id}/approve` | plan 승인 → apply |\n| GET | `/api/runs/{id}` | 작업 상태 / plan·apply 로그 |\n| GET | `/api/envs/{env}/services/{name}/logs` | 컨테이너 로그 스트림 (SSE) |\n\n## 주의할 점\n\n- Terraform 은 동시에 하나만 실행 — Runner 에서 환경별 lock 필수.\n- 콘솔 서버가 Docker 소켓/클러스터 권한을 가지므로 콘솔 자체를 외부에 열 때는 인증 + VPN/IP 제한.\n- 콘솔 자체도 이 저장소의 서비스로 배포 (단, 자기 자신을 destroy 하지 못하게 보호).\n"}, {"id": "05-kubernetes-migration", "md": "# 05. Kubernetes 로 전환하기\n\n**가능하다.** 처음부터 그걸 고려해 \"무엇을(서비스 카탈로그)\" 과 \"어떻게(모듈 구현)\" 를 분리해 두었다.\n\n## 무엇이 그대로이고 무엇이 바뀌나\n\n| 계층 | Docker (지금) | Kubernetes (이후) | 변경 여부 |\n|------|---------------|-------------------|-----------|\n| 서비스 카탈로그 JSON | `services.auto.tfvars.json` | 동일 | **그대로** |\n| 어드민 콘솔 API | 카탈로그 수정 + plan/apply | 동일 | **그대로** |\n| network 모듈 | docker_network | Namespace (+ NetworkPolicy) | 구현 교체 |\n| app-service 모듈 | docker build + container | 레지스트리 push + Deployment + Service | 구현 교체 |\n| reverse-proxy 모듈 | nginx 컨테이너 | ingress-nginx + Ingress 리소스 | 구현 교체 |\n| 외부 노출 | 공유기 → Mac:80 | 공유기 → 노드 NodePort/LoadBalancer(MetalLB) | 포워딩 대상만 변경 |\n\n## 전환 방식\n\n```\nmodules/\n├── docker/        # 지금 modules/* 를 여기로\n│   ├── network  app-service  reverse-proxy\n└── k8s/           # 같은 입력 변수 / 같은 출력(upstream 등)을 갖는 구현\n    ├── network  app-service  reverse-proxy\nenvs/\n├── office/        # docker\n└── office-k8s/    # 같은 카탈로그, source 만 ../../modules/k8s/*\n```\n\n1. 모듈 **입력/출력 인터페이스를 동일하게** 유지 (`name, port, env, route_path …` → `upstream`)\n2. 이미지 레지스트리 도입 (로컬 레지스트리 컨테이너 or GHCR) — k8s 는 로컬 이미지 직접 사용이 어려움\n3. `envs/office-k8s` 에서 병행 운영 → 검증 후 공유기 포워딩 대상 전환 → docker 환경 destroy\n\n## 클러스터 선택지\n\n| 옵션 | 용도 |\n|------|------|\n| kind (이 Mac 에 `ch4` 클러스터 이미 있음) | 로컬 실험·모듈 개발 |\n| k3s (사무실 미니PC/리눅스 서버) | 사무실 상시 운영 — 가볍고 Traefik/ServiceLB 내장 |\n| EKS / GKE | 실제 클라우드로 이전 시. 모듈만 한 번 더 교체 |\n"}];
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({startOnLoad:false, theme: dark ? 'dark' : 'neutral'});
const renderer = new marked.Renderer();
renderer.code = (code, lang) => lang === 'mermaid'
  ? `<pre class="mermaid">${code}</pre>`
  : `<pre><code>${code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre>`;
renderer.table = (h, b) => `<div class="tbl"><table><thead>${h}</thead><tbody>${b}</tbody></table></div>`;
// md 간 링크(01-architecture.md) → 페이지 전환
renderer.link = (href, title, text) => {
  const m = href && href.match(/^(0[^/]*)\.md$/);
  return m ? `<a href="#${m[1]}">${text}</a>` : `<a href="${href}">${text}</a>`;
};
marked.setOptions({renderer});
const toc = document.getElementById('toc'), content = document.getElementById('content');
PAGES.forEach(p => {
  const title = (p.md.match(/^# (.+)$/m) || [, p.id])[1];
  const a = Object.assign(document.createElement('a'), {href: '#' + p.id, textContent: title});
  a.dataset.id = p.id; toc.appendChild(a);
});
async function show(){
  const id = location.hash.slice(1) || PAGES[0].id;
  const p = PAGES.find(x => x.id === id) || PAGES[0];
  content.innerHTML = marked.parse(p.md);
  toc.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
  await mermaid.run({nodes: content.querySelectorAll('.mermaid')});
  scrollTo(0, 0);
}
addEventListener('hashchange', show); show();
</script>
