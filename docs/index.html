const PAGES = [{"id": "01-architecture", "md": "# 01. 아키텍처 — 전체 구성도\n\n> 기준: 2026-10-24 실제 클러스터 상태. 처음 보는 사람은 [학습 가이드](11-learning-guide.md) 순서로 읽기를 권한다.\n\n## 한 줄 요약\n\n사무실 Mac 한 대의 Docker 위에 **Kubernetes v1.37 (kind)** 클러스터를 두고, **Terraform** 으로 전부 관리한다.\n외부 공개는 **Cloudflare Tunnel + 도메인 `claudharmony.io`**, 앱 배포는 **GitHub Actions (self-hosted runner)**, 관리는 **관리자 콘솔**.\n\n## 1. 전체 그림 (System Context)\n\n```mermaid\nflowchart LR\n    USER[방문자] -->|https://claudharmony.io| CF\n    ADMIN[관리자] -->|http://console.localhost| MAC\n    DEVR[개발자] -->|git push| GH[GitHub<br/>web · api · console · infra]\n\n    subgraph CLOUD[Cloudflare]\n      CF[DNS · TLS · Tunnel 엣지<br/>Access 로그인]\n    end\n\n    subgraph OFFICE[사무실 — 이중 NAT, 포트포워딩 없음]\n      subgraph MAC[MacBook · Docker Desktop]\n        K8S[kind 클러스터<br/>claudharmony]\n        RUN[self-hosted runner<br/>infra · web · api]\n      end\n    end\n\n    CF <==>|아웃바운드 터널| K8S\n    GH -.작업 가져가기<br/>아웃바운드.-> RUN\n    RUN -->|docker build · kind load · terraform apply| K8S\n    RUN -->|배포 기록 커밋| GH\n```\n\n**핵심 포인트**: 사무실로 **들어오는 연결은 하나도 없다**. 터널(cloudflared)과 러너 모두 **안에서 바깥으로** 연결한다 → 이중 NAT·공유기 권한 문제와 무관.\n\n## 2. 물리 / 노드 구성\n\n```mermaid\nflowchart TB\n    subgraph MAC[MacBook Pro M4 Max · 48GB]\n      subgraph DD[Docker Desktop VM · 8GB 할당]\n        CP[claudharmony-control-plane<br/>노드 = 컨테이너<br/>:80 ← NodePort 30080]\n        WK[claudharmony-worker<br/>노드 = 컨테이너]\n        AT[claudharmony-atlas-dev<br/>스키마 계산용 임시 PG]\n        OTHER[다른 프로젝트<br/>airflow · kind ch4 · qdrant]\n      end\n      FILES[~/.claudharmony/<br/>kubeconfig · state · runners<br/>cloudflare.env · backups]\n    end\n```\n\n| 항목 | 값 |\n|------|----|\n| 노드 | control-plane 1 + worker 1 (Kubernetes **v1.37.0**) |\n| 호스트 포트 | Mac `:80` → control-plane `:30080` (Envoy Gateway NodePort) |\n| 접속 정보 | `~/.claudharmony/kubeconfig` (context `kind-claudharmony`, `~/.kube/config` 에도 병합) |\n| Terraform state | `~/.claudharmony/state/<stack>.tfstate` (저장소 밖) |\n\n## 3. 논리 구성 — Namespace 별\n\n```mermaid\nflowchart TB\n    subgraph K8S[kind 클러스터]\n      subgraph EGS[envoy-gateway-system]\n        EG[envoy-gateway<br/>컨트롤러]\n        GW[Gateway claudharmony<br/>Envoy · NodePort 30080]\n      end\n      subgraph EDGE[edge]\n        CFD[cloudflared ×2]\n      end\n      subgraph PRD[prd]\n        PW[web] --> PA[api] --> PPG[(pg · PostgreSQL 18<br/>+ PostGIS)]\n      end\n      subgraph DEV[dev]\n        DW[web] --> DA[api] --> DPG[(pg)]\n      end\n      subgraph CON[console]\n        C[console<br/>읽기 전용 SA]\n      end\n      subgraph CNPG[cnpg-system]\n        OP[CloudNativePG Operator]\n      end\n      subgraph KS[kube-system]\n        MS[metrics-server]\n      end\n      subgraph IDN[identity]\n        KC[Keycloak 26.7] --> KPG[(pg · DB keycloak)]\n      end\n      CFD --> GW\n      GW -->|auth.claudharmony.io /realms/공개 realm<br/>auth.localhost 전체| KC\n      GW -->|hostnames 없음 = 기본| PW\n      GW -->|dev.claudharmony.io<br/>dev.localhost| DW\n      GW -->|console.localhost| C\n      OP -. 관리 .-> PPG & DPG & KPG\n      PW & DW -. OIDC .-> KC\n      C -. 조회 .-> PRD & DEV\n    end\n```\n\n| Namespace | 들어 있는 것 | 만든 곳 |\n|-----------|--------------|---------|\n| `envoy-gateway-system` | Envoy Gateway 컨트롤러, Gateway(Envoy Pod), NodePort Service | `platform/gateway` |\n| `edge` | cloudflared ×2, 터널 토큰 Secret | `platform/edge` |\n| `cnpg-system` | CloudNativePG Operator | `platform/database` |\n| `kube-system` | metrics-server (+ K8s 기본 구성요소) | `platform/addons` |\n| `identity` | Keycloak, 전용 PostgreSQL `pg`(DB `keycloak`), HTTPRoute 공개/관리 | `platform/identity` (+ 설정 `platform/realms`) |\n| `prd` / `dev` | web, api, PostgreSQL `pg` (Service `pg-rw/ro/r`, Secret `pg-app/pg-readonly`) | `envs/prd`, `envs/dev` |\n| `console` | 관리자 콘솔, ServiceAccount + 읽기 전용 ClusterRole | `envs/console` |\n\n## 4. 요청 흐름\n\n```mermaid\nsequenceDiagram\n    actor U as 사용자\n    participant CF as Cloudflare 엣지\n    participant T as cloudflared (ns edge)\n    participant G as Gateway (Envoy)\n    participant W as web (SvelteKit)\n    participant A as api (Spring Boot)\n    participant P as PostgreSQL\n\n    U->>CF: HTTPS https://claudharmony.io/trends\n    Note over CF: TLS 종단, (console 은 Access 로그인)\n    CF->>T: 터널로 전달 (Host 헤더 유지)\n    T->>G: http://claudharmony-gateway:80\n    Note over G: HTTPRoute 매칭<br/>Host=claudharmony.io → prd 기본 라우트\n    G->>W: Service web.prd → Pod\n    W->>A: SSR 서버 간 호출 http://api\n    A->>P: jdbc pg-rw.prd:5432\n    P-->>A: 행\n    A-->>W: JSON\n    W-->>U: HTML\n```\n\n| 주소 | 어디로 | 비고 |\n|------|--------|------|\n| https://claudharmony.io, www | prd web | 기본(catch-all) 라우트 |\n| https://dev.claudharmony.io | dev web | hostname 라우트 |\n| http://localhost, http://192.168.45.214 | prd web | 사무실 |\n| http://dev.localhost | dev web | 사무실 Mac |\n| http://console.localhost | console | 사무실 Mac (공개 주소는 Access 준비 후) |\n| `/actuator/**` | → `/` 로 리다이렉트 | 외부 비공개 |\n\n## 5. 배포 흐름\n\n```mermaid\nflowchart LR\n    subgraph APP[앱 저장소 web · api · console]\n      D[develop push] -->|deploy-dev| R1\n      REL[release/YYYYMMDD<br/>수동 실행] -->|DB schema prd → Deploy prd| R1\n      M[main push<br/>console 만] -->|deploy| R1\n    end\n    subgraph RUNNER[사무실 Mac 러너]\n      R1[docker build] --> S{api 면<br/>DB 스키마}\n      S -->|dev: 자동 apply<br/>prd: check| K[kind load]\n      K --> DEP[deploy.sh<br/>images 기록 → terraform apply<br/>→ rollout]\n    end\n    DEP --> CL[클러스터]\n    DEP -->|\"deploy(env): svc=img [skip ci]\"| INFRA[(claudharmony-infra)]\n    INFRA -->|main 머지: gateway·dev 자동<br/>prd·edge·cluster 수동| IA[Infra apply] --> CL\n```\n\n## 6. Terraform 스택과 의존 관계\n\n```mermaid\nflowchart TB\n    C1[1 · platform/cluster<br/>kind 클러스터] --> C2[2 · platform/gateway<br/>Envoy Gateway]\n    C1 --> C3[2.5 · platform/edge<br/>터널 · DNS · Access]\n    C1 --> C4[2.6 · platform/addons<br/>metrics-server]\n    C1 --> C5[2.7 · platform/database<br/>CloudNativePG]\n    C2 & C5 --> I1[2.8 · platform/identity<br/>Keycloak]\n    I1 --> I2[2.9 · platform/realms<br/>realm · client · Secret]\n    C2 & C3 & C5 --> E1[3 · envs/dev]\n    C2 & C3 & C5 --> E2[3 · envs/prd]\n    C2 --> E3[3 · envs/console]\n    E1 & E2 & E3 --> I2\n```\n\n| 스택 | 만드는 것 | provider | 적용 |\n|------|-----------|----------|------|\n| `platform/cluster` | kind 클러스터 (노드 2) | local + kind CLI | 수동 (재생성 주의) |\n| `platform/gateway` | Envoy Gateway, GatewayClass, EnvoyProxy, Gateway | helm, kubectl | main 머지 시 자동 |\n| `platform/edge` | Cloudflare 터널·ingress·DNS(·Access), cloudflared ×2 | cloudflare, kubernetes | 수동 (토큰 필요) |\n| `platform/addons` | metrics-server | helm | 수동 |\n| `platform/database` | CloudNativePG Operator | helm | 수동 |\n| `platform/identity` | Keycloak (Deployment·Service·HTTPRoute) + 전용 DB | kubernetes, kubectl | 수동 |\n| `platform/realms` | realm·role·client·계정, 앱 Namespace에 `keycloak-*` Secret | **keycloak**, kubernetes | 수동 (port-forward) |\n| `envs/dev`, `envs/prd` | Namespace, web/api (Deployment·Service·HTTPRoute), PostgreSQL | kubernetes, kubectl | dev 자동 / prd 수동, 앱 배포 시 |\n| `envs/console` | 콘솔 + RBAC | kubernetes, kubectl | 콘솔 배포 시 |\n\n모듈: `modules/k8s/{env, app, postgres, tunnel}` — env 하나 = Namespace + 서비스 카탈로그(`services.auto.tfvars.json`) + 배포 기록(`images.auto.tfvars.json`) + DB.\n\n## 7. 데이터\n\n| 무엇 | 어디 | 관리 |\n|------|------|------|\n| 서비스 DB | PostgreSQL 18.6 + PostGIS 3.6.4, 환경별 `pg` (5Gi) | CloudNativePG, 스키마는 api `db/schema.sql` (**Atlas**) |\n| 스키마 변경 | dev 자동, prd `DB schema prd` (계획·확인문구·백업) | `scripts/db-schema.sh` |\n| 백업 | prd 스키마 적용 직전 pg_dump → `~/.claudharmony/backups/` | ⏳ 정기 백업(R2) 예정 |\n| 블로그 글 | api 저장소 `src/main/resources/posts/*.md` | Git |\n\n## 8. 보안 경계\n\n| 경계 | 장치 |\n|------|------|\n| 인터넷 → 사무실 | 들어오는 포트 없음. Cloudflare 터널만 (TLS 는 엣지) |\n| 콘솔 공개 주소 | Cloudflare Access 이메일 로그인 (⏳ 토큰 권한 추가 후) → 이후 Keycloak `admin` 역할로 대체 검토 |\n| 로그인 | Keycloak — 인터넷에는 `/realms/<공개 realm>`·`/resources`만, `/admin`·master realm은 `auth.localhost`(사무실 Mac) 전용 — [인증 서버](12-identity.md) |\n| 앱 → DB | 클러스터 내부만. 앱 계정 `app`, 조회 계정 `readonly`, 비밀번호는 Secret |\n| 콘솔 → K8s | ServiceAccount 읽기 전용, **Secret 접근 불가** |\n| 러너 → infra 저장소 | 저장소 하나 전용 SSH deploy key (443 포트) |\n| public infra 저장소 | 외부 기여자 워크플로 승인 필수, 문서에 IP/MAC/토큰 없음 |\n| 자격증명 | `~/.claudharmony/cloudflare.env` (600), kubeconfig, deploy key — 전부 저장소 밖 |\n\n## 9. 버전 (2026-10-24)\n\n| 구성요소 | 버전 |\n|----------|------|\n| Kubernetes / kind / kubectl | v1.37.0 / v0.33.0 / v1.37.1 |\n| Envoy Gateway / Gateway API | v1.9.2 / v1 |\n| CloudNativePG / PostgreSQL / PostGIS | 1.30.1 / 18.6 / 3.6.4 |\n| cloudflared | 2025.10.0 |\n| metrics-server chart | 3.14.0 |\n| Atlas | 1.3.3-community |\n| Keycloak / Terraform provider | 26.7.5 / keycloak 5.10 |\n| Terraform / providers | 1.15 / kubernetes 3.3, helm 3.x, kubectl 2.x, cloudflare 5.27 |\n| 앱 | web SvelteKit 3 (Node 24) · api Spring Boot 4.1.2 (Java 25) · console Spring Boot 4.1.2 |\n\n## 10. 설계 결정 요약\n\n| 결정 | 이유 |\n|------|------|\n| kind (Docker 안의 K8s) | Mac 한 대에서 가장 가볍고, 나중에 k3s/EKS 로 `platform/cluster` 만 교체 |\n| 단계별 Terraform state | CRD 설치(2단계)가 앱(3단계) 전에 필요, 배포가 클러스터를 건드리지 않게 |\n| Gateway API (ingress-nginx 아님) | ingress-nginx 2026-03 retire, 역할 분리(GatewayClass/Gateway ↔ HTTPRoute) |\n| `externalTrafficPolicy: Cluster` | 호스트 포트는 control-plane 에만 연결, Envoy Pod 는 worker 에 있음 |\n| Cloudflare Named Tunnel | 이중 NAT, 고정 주소 + TLS, 커넥터 이중화 |\n| 서비스 카탈로그(JSON) | 콘솔이 HCL 대신 데이터만 바꾸게 |\n| 배포 기록을 Git 커밋으로 | 무엇이 떠 있는지 이력, 롤백 = 되돌리기 커밋 |\n| 레지스트리 없이 `kind load` | 빌드·실행이 같은 Mac |\n| DB 는 저장·조회만, 스키마는 Atlas 선언형 | 운영에서 앱 기동 시 자동 마이그레이션 금지 |\n| 콘솔 읽기 전용부터 | 변경은 Git → Terraform 경로로만 (2단계) |\n"}, {"id": "02-office-network", "md": "# 02. 사무실 네트워크 구성\n\n> 이 저장소는 **public** 입니다. 실제 공인 IP / MAC 주소는 여기 적지 않고 `<PUBLIC_IP>`, `<MAC>` 으로 표기합니다.\n> 실제 값은 개인 Obsidian 노트(`클라우드하모니/인프라 구성/02 사무실 네트워크`)에 있습니다.\n\n## 토폴로지 — 이중 NAT\n\n```mermaid\nflowchart TB\n    INET((인터넷))\n    subgraph UP[상위망 192.168.75.0/24]\n      GNT[GNT2400 공유기<br/>WAN: 공인 IP<br/>LAN: 192.168.75.1<br/>관리페이지 :80]\n    end\n    subgraph OFFICE[사무실 LAN 192.168.45.0/24]\n      SK[SK브로드밴드 GW-ME611R<br/>WAN: 192.168.75.142 (DHCP)<br/>LAN: 192.168.45.1]\n      MAC[MacBook Pro M4 Max<br/>192.168.45.214 · Wi-Fi 2.4G<br/>Docker Desktop · kind K8s<br/>:80 → Gateway]\n    end\n    INET --- GNT --- SK\n    SK -- Wi-Fi --- MAC\n```\n\n> 공유기가 **2단**이다. 외부 공개하려면 **두 공유기 모두** 포트포워딩이 필요하다.\n> (처음엔 공인 IP:80 에서 로그인 화면이 보여 단일 NAT 로 오판했는데, 그건 상위 GNT2400 의 관리페이지였다.)\n\n## 현재 값 (2026-10-24 측정)\n\n| 항목 | 값 | 비고 |\n|------|----|------|\n| 서버 호스트 | MacBook Pro (Apple M4 Max, 48GB) | macOS 15.5 |\n| 서버 LAN IP | `192.168.45.214` (DHCP) | **DHCP 고정 할당 필요** |\n| 서브넷 | `192.168.45.0/24` (255.255.255.0) | |\n| 1차 공유기 (사무실) | SK GW-ME611R, LAN `192.168.45.1`, WAN `192.168.75.142` | WAN IP 는 상위 DHCP → 고정 필요 |\n| 2차 공유기 (상위) | GNT2400, LAN `192.168.75.1` | 공인 IP 보유. 관리페이지가 공인 IP:80 에서 응답 |\n| DNS | ISP 제공 DNS 2개 | |\n| 공인 IP | `<PUBLIC_IP>` (상위 GNT2400 WAN) | **이중 NAT** → 포트포워딩 2번 |\n| 공인 IP 성격 | 유동 IP 일 가능성 높음 | 바뀌면 접속 주소도 바뀜 → DDNS 권장 |\n| DHCP 임대 | 6시간 | |\n| macOS 방화벽 | 꺼짐 | |\n| Docker Desktop | 포트 80 → kind control-plane:30080 (Envoy Gateway) | 다른 프로젝트가 5432/5433/6333/8080, kind `ch4` 사용 중 (충돌 없음) |\n\n## 외부 접근을 위한 공유기 설정 (수동 작업)\n\n공인 IP 의 **80 포트는 공유기 관리 페이지가 사용 중**이라 그대로 포워딩할 수 없다. 두 가지 중 하나를 선택:\n\n### 포트포워딩 (2단)\n\n| 공유기 | 프로토콜 | 외부 포트 | 내부 IP | 내부 포트 | 상태 |\n|--------|----------|-----------|---------|-----------|------|\n| GNT2400 (192.168.75.1) | TCP | `8888` | `192.168.75.142` | `8888` | ⏳ 관리자 계정 필요 |\n| SK GW-ME611R (192.168.45.1, NAT/라우터 → 포트포워드) | TCP | `8888` | `192.168.45.214` | `80` | ✅ 2026-10-24 |\n\n→ 접속 주소: `http://<PUBLIC_IP>:8888/`\n\n외부 80 은 GNT2400 관리페이지가 점유 중이라 8888 사용. GNT2400 의 원격 관리는 끄는 것을 권장.\n\n### 현재 외부 공개 방식: 도메인 + Cloudflare Named Tunnel (2026-10-24 ~)\n\n`claudharmony.io` / `www` → prd, `dev.claudharmony.io` → dev. 상세는 [도메인 연결](08-domain.md).\n\n### (이전) Cloudflare Quick Tunnel — 도메인 연결 후 제거\n\nGNT2400 관리자 계정이 없어 포트포워딩 불가 → 터널로 공개 중.\n\n```\n외부 → https://<랜덤>.trycloudflare.com → Cloudflare → tunnel Pod(ns dev|prd) → Gateway(Envoy) → HTTPRoute → Service → Pod\n```\n\n| 항목 | 내용 |\n|------|------|\n| 실행 위치 | 각 Namespace 의 `tunnel` Deployment (`cloudflare/cloudflared:2025.10.0`) — 환경마다 주소 1개 |\n| 현재 주소 확인 | `scripts/infra.sh prd url` / `scripts/infra.sh dev url` |\n| 주의 | tunnel Pod 재시작 시 **주소가 바뀜**. 주소를 아는 누구나 접속 가능 |\n| 관리 | Terraform (`modules/k8s/tunnel`) — 2026-10-24 Docker 수동 실행에서 전환 |\n| 고정 주소 | 도메인 구매 → Cloudflare named tunnel 로 전환 |\n\n### 상위 공유기 권한이 없을 때\n\nCloudflare Tunnel (`cloudflared tunnel --url http://localhost:80`) — Mac 에서 바깥으로 연결하므로 NAT 단수·포트포워딩과 무관.\n\n$1\n\n1. **DHCP 고정 할당 (2곳)**: SK 공유기에서 Mac `<MAC>` → `192.168.45.214`, GNT2400 에서 SK WAN MAC → `192.168.75.142`. 안 하면 IP 가 바뀌어 포워딩이 끊김.\n2. **Mac 절전 방지**: 노트북이 잠들면 서비스도 내려감.\n   ```bash\n   sudo pmset -c sleep 0 disksleep 0   # 전원 연결 시 잠자기 끄기\n   ```\n   Docker Desktop → Settings → General → *Start Docker Desktop when you sign in* 체크.\n3. **(가능하면) 유선 연결**: 현재 Wi-Fi. 서버 용도면 유선이 안정적.\n\n### 검증\n\n```bash\nscripts/infra.sh prd check                 # 사무실 안: localhost + 터널 확인\ncurl http://<PUBLIC_IP>:8888/              # 사무실 밖(휴대폰 LTE 등)에서 확인\n```\n\n> 사무실 내부에서 공인 IP 로 접속하면 공유기의 NAT loopback(헤어핀) 지원 여부에 따라 실패할 수 있다. 외부 검증은 반드시 **사무실 밖 네트워크**에서.\n\n## 도메인 구매 후\n\n1. DNS A 레코드 → `<PUBLIC_IP>` (유동이면 Cloudflare DDNS 등)\n2. HTTPRoute `hostnames` 에 도메인 추가 (`modules/k8s/env` 의 `hostnames`), Gateway 에 HTTPS 리스너\n3. TLS: 443 포워딩 + Let's Encrypt (certbot 컨테이너 or Cloudflare proxy) — `reverse-proxy` 모듈 확장 예정\n4. 대안: **Cloudflare Tunnel** — 포트포워딩 없이 외부 공개 가능, 공인 IP 노출 없음\n"}, {"id": "03-operations", "md": "# 03. 운영 가이드 (Runbook)\n\n## 사전 요구사항\n\n| 도구 | 버전 | 설치 |\n|------|------|------|\n| Docker Desktop | 27.x | 메모리 8GB 이상 권장 |\n| kind | v0.33.0 | `brew install kind` |\n| kubectl | v1.37.x | `brew install kubernetes-cli` |\n| helm | v4.x | `brew install helm` (Terraform helm provider 가 쓰지만 디버깅용) |\n| Terraform | 1.15.x | `brew install terraform` |\n| gh | 로그인 + `repo`, `workflow` 권한 | `gh auth login`, `gh auth refresh -s workflow` |\n\n## kubectl 쓰는 법\n\n이 클러스터는 **전용 kubeconfig** 를 쓴다 (기본 `~/.kube/config` 를 건드리지 않음).\n\n```bash\nexport KUBECONFIG=~/.claudharmony/kubeconfig     # 터미널마다 한 번\nkubectl get nodes\n# 또는 매번\nkubectl --kubeconfig ~/.claudharmony/kubeconfig get nodes\n```\n\n`~/.zshrc` 에 넣어두면 편하다 (2026-10-24 적용됨, 백업 `~/.zshrc.bak-20261024`):\n```bash\n# 여러 kubeconfig 를 합쳐서 사용 — kubectl/k9s 에서 컨텍스트 전환\nexport KUBECONFIG=\"$HOME/.claudharmony/kubeconfig:$HOME/.kube/config:$HOME/.lima/k3s/copied-from-guest/kubeconfig.yaml\"\nalias k9ch='k9s --kubeconfig ~/.claudharmony/kubeconfig --context kind-claudharmony'\nalias kch='kubectl --kubeconfig ~/.claudharmony/kubeconfig --context kind-claudharmony'\n```\n\n### k9s\n\n예전에는 `KUBECONFIG` 가 lima k3s 파일 하나만 가리켜서 k9s 에 아무 클러스터도 안 보였다. 위처럼 합친 뒤:\n\n- 셸 설정과 무관하게 보이도록 `~/.kube/config` 에도 `kind-claudharmony` 를 합쳐 넣고 기본 컨텍스트로 지정 (백업 `~/.kube/config.bak-20261024`, 이전 기본은 `kind-ch4`)\n- ⚠️ `cluster apply` 로 클러스터를 **재생성하면** 인증서가 바뀐다 → 다시 합치기:\n  `KUBECONFIG=~/.kube/config:~/.claudharmony/kubeconfig kubectl config view --flatten > /tmp/k && mv /tmp/k ~/.kube/config`\n- 이미 열려 있던 터미널은 `source ~/.zshrc` 후 사용\n\n| 입력 | 동작 |\n|------|------|\n| `k9s` → `:ctx` | 클러스터 전환 (`kind-claudharmony`, `kind-ch4`) |\n| `k9ch` | 바로 claudharmony |\n| `:ns` → `prd` | 네임스페이스 |\n| `:deploy` `:pod` `:svc` `:httproute` | 리소스 |\n| 파드에서 `l` / `s` | 로그 / 셸 |\n| `0` | 전체 네임스페이스 |\n\n## 처음부터 구성 (새 Mac / 재구축)\n\n```bash\ngit clone https://github.com/ParkSeWoo/claudharmony-infra.git ~/infra && cd ~/infra\n\nscripts/infra.sh cluster apply     # 1단계: kind 클러스터 (~1분)\nscripts/infra.sh gateway apply     # 2단계: Envoy Gateway (~30초)\n\n# 3단계: 앱 이미지가 있어야 한다 → 앱 저장소에서 빌드 후 deploy.sh 가 kind load + apply\n#   (CI 가 해주므로 보통은 develop 에 push 하면 끝)\nscripts/infra.sh dev apply\nscripts/infra.sh prd apply\n\nscripts/setup-runner.sh            # GitHub Actions self-hosted runner 등록\n```\n\n## 자주 쓰는 명령\n\n| 목적 | 명령 |\n|------|------|\n| 변경 미리보기 | `scripts/infra.sh dev plan` |\n| 적용 | `scripts/infra.sh dev apply` |\n| 상태 | `scripts/infra.sh dev status` / `cluster status` / `gateway status` |\n| 로그 | `scripts/infra.sh dev logs hello-app` / `logs tunnel` |\n| 외부 주소 | `scripts/infra.sh prd url` → https://claudharmony.io |\n| 접속 점검 | `scripts/infra.sh prd check` |\n| 현재 배포 버전 | `curl http://localhost/version` , `curl http://dev.localhost/version` |\n| 로그인 서버 | 관리 콘솔 http://auth.localhost/admin/ (계정 `claudharmony-admin`, 비밀번호는 `kubectl -n identity get secret keycloak-admin -o jsonpath='{.data.password}' \\| base64 -d \\| pbcopy`) — [인증 서버](12-identity.md) |\n| DB 접속 | `scripts/db.sh up` 한 번 → `scripts/db.sh psql dev` / IntelliJ·TablePlus 는 `127.0.0.1:15432(dev)·25432(prd)` — [데이터베이스](09-database.md) |\n| Pod 안 들어가기 | `kubectl -n dev exec -it deploy/hello-app -- bash` |\n| 롤백 (이전 ReplicaSet) | `kubectl -n prd rollout undo deploy/hello-app` → **이후 images.auto.tfvars.json 도 맞춰야 함** (안 그러면 다음 apply 때 되돌아감) |\n\n정석 롤백은 `envs/prd/images.auto.tfvars.json` 의 태그를 이전 값으로 바꿔 커밋하고 `scripts/infra.sh prd apply`.\n\n## 서비스 추가하기 (예: `api`)\n\n1. 새 앱 저장소 — `claudharmony-api`(Spring) 또는 `claudharmony-web`(Node) 의 `Dockerfile`, `.github/workflows/*` 를 복사하고 서비스 이름만 변경\n2. `envs/dev/services.auto.tfvars.json`, `envs/prd/services.auto.tfvars.json` 에 추가:\n   ```json\n   \"api\": { \"port\": 8080, \"route_path\": \"/api\", \"replicas\": 1, \"memory_mb\": 512 }\n   ```\n   `route_path` 를 빼면 **내부 전용** (클러스터 안에서 `http://api.dev.svc.cluster.local` 로만 접근)\n3. 앱 저장소 `develop` 에 push → 이미지 빌드 → 카탈로그에 이미지가 기록되며 배포\n\n## 플랫폼 변경\n\n| 작업 | 방법 | 영향 |\n|------|------|------|\n| Envoy Gateway 업그레이드 | `platform/gateway/variables.tf` 의 `envoy_gateway_version` 변경 → `scripts/infra.sh gateway apply` | 순간 끊김 가능 |\n| Kubernetes 업그레이드 | `platform/cluster/variables.tf` 의 `node_image` 변경 → `cluster apply` | ⚠️ kind 는 업그레이드가 아니라 **재생성** → gateway, dev, prd 다시 apply 필요 |\n| worker 추가 | `workers` 변경 → `cluster apply` | ⚠️ 재생성 |\n\n## 트러블슈팅\n\n| 증상 | 확인 / 조치 |\n|------|-------------|\n| `http://localhost/` 응답 없음 | `docker port claudharmony-control-plane` 에 `30080 -> 0.0.0.0:80` 있는지, `kubectl -n envoy-gateway-system get svc claudharmony-gateway` 가 NodePort 30080 / `externalTrafficPolicy: Cluster` 인지 |\n| 404 (Envoy) | 라우트 매칭 실패. `kubectl get httproute -A`, Host 헤더 확인 (dev 는 `dev.localhost`) |\n| HTTPRoute 가 Gateway 에 안 붙음 | `kubectl -n dev describe httproute hello-app` 의 `Accepted` 조건. Namespace 라벨 `claudharmony.io/gateway-access=true` 확인 |\n| Pod `ErrImageNeverPull` / `ImagePullBackOff` | 이미지가 kind 노드에 없음 → `kind load docker-image <image> --name claudharmony` |\n| Pod `CrashLoopBackOff` | `kubectl -n dev logs deploy/hello-app --previous` |\n| Pod `Running` 인데 `0/1` | readiness probe 실패 → `kubectl -n dev describe pod -l app.kubernetes.io/name=hello-app` 의 Events |\n| `OOMKilled` | `memory_mb` 증가 (서비스 카탈로그) |\n| 도메인 접속 안 됨 | `kubectl -n edge get pods` (cloudflared 2/2 Ready?), `kubectl -n edge logs deploy/cloudflared` 에 `Registered tunnel connection` 4개, `scripts/infra.sh edge plan` 으로 드리프트 확인 |\n| terraform `context \"kind-claudharmony\" does not exist` | 클러스터가 없음 → `scripts/infra.sh cluster apply` 부터 |\n| Docker Desktop 재시작 후 | kind 노드 컨테이너는 자동 재시작됨. 터널 주소는 바뀜 |\n| 메모리 부족 (Pending Pod) | `kubectl describe pod` → `Insufficient memory`. Docker Desktop 메모리 늘리거나 다른 클러스터(`ch4`) 정리 |\n\n과거에 실제로 겪은 문제와 해결 과정은 [작업 기록](07-worklog.md) 에 있다.\n"}, {"id": "04-admin-console-roadmap", "md": "# 04. 어드민 콘솔 로드맵 — \"우리만의 AWS/GCP 콘솔\"\n\n> 2026-10-24 **1단계(조회) 구현 완료** → [관리자 콘솔](10-console.md)\n\n목표: 웹 콘솔에서 서비스 생성·배포·중지·삭제, 상태/로그 확인을 하고, 그 뒤에서는 **Terraform 이 실제 인프라를 관리**하는 구조.\n\n## 핵심 원칙\n\n1. **Terraform 이 단일 진실 원천(Source of Truth)** — 콘솔은 kubectl/Docker 로 직접 조작하지 않는다. 직접 조작하면 state 와 어긋난다(드리프트).\n2. **콘솔은 데이터만 바꾼다** — HCL 은 사람이 리뷰하는 코드, 콘솔은 `services.auto.tfvars.json` (서비스 카탈로그)만 생성/수정.\n3. **변경은 plan → 승인 → apply** — 클라우드 콘솔의 \"검토 후 생성\" 화면이 곧 `terraform plan` 결과.\n4. **조회는 label 기반** — `claudharmony.managed-by=terraform`, `claudharmony.environment`, `claudharmony.service`.\n\n## 이미 깔아둔 기반\n\n| 기반 | 위치 | 콘솔에서의 용도 |\n|------|------|-----------------|\n| 서비스 카탈로그 JSON | `envs/<env>/services.auto.tfvars.json` | \"서비스 생성\" 폼 → JSON 수정 |\n| 타입이 있는 변수 스키마 | `modules/k8s/env/variables.tf` 의 `services` | 폼 필드 / 검증 규칙의 근거 |\n| 기계가 읽는 출력 | `terraform output -json services` | 서비스 목록 화면 |\n| 리소스 label | 전 모듈 | 실시간 상태 (`kubectl get pods -l app.kubernetes.io/part-of=claudharmony`) |\n| 모듈 = 클라우드 서비스 단위 | `modules/*` | 콘솔 메뉴 (VPC / Compute / Load Balancer) |\n| 환경 디렉토리 | `envs/<env>` | 콘솔의 \"프로젝트 / 리전\" 선택 |\n\n## 목표 아키텍처\n\n```mermaid\nflowchart LR\n    UI[Admin Console<br/>React / Next.js] --> API[Console API<br/>Spring Boot]\n    API -->|1. 카탈로그 수정<br/>Git commit/PR| GIT[(GitHub<br/>claudharmony-infra)]\n    API -->|2. plan / apply 작업 큐| RUN[Terraform Runner<br/>컨테이너]\n    RUN -->|state| ST[(원격 State<br/>MinIO/S3 + lock)]\n    RUN -->|provider| DK[Kubernetes<br/>kind → 이후 k3s/EKS]\n    API -->|상태·로그 조회<br/>read-only| DK\n    API --> DB[(콘솔 DB<br/>작업 이력·감사로그)]\n```\n\n## 단계별 계획\n\n| 단계 | 내용 | 산출물 |\n|------|------|--------|\n| **0. 지금** | K8s + Terraform + JSON 카탈로그 + GitHub Actions 배포 (dev 자동 / prd 수동) | 이 저장소 |\n| 1. Read-only 콘솔 | 서비스 목록/상태/로그 화면 (`output -json` + Kubernetes API 조회: Deployment/Pod/Event/로그) | `claudharmony-console` 저장소 → `envs/*/services` 에 등록해 K8s 에 배포 |\n| 2. 원격 state | local → MinIO(S3 호환) backend + lock. 콘솔/사람이 같은 state 사용 | `envs/*/versions.tf` backend 변경 |\n| 3. Runner | 콘솔 API 가 `terraform plan/apply` 를 작업 큐로 실행, 결과·로그 저장, 동시 실행 lock | `apps/tf-runner` |\n| 4. Write 콘솔 | 서비스 생성/수정/삭제 폼 → JSON 변경 → plan 미리보기 → 승인 → apply | GitOps: 콘솔이 PR 생성 → merge 시 apply |\n| 5. 인증·권한 | 로그인, 역할(Owner/Developer/Viewer), 감사 로그 | IAM 화면 |\n| 6. 확장 | 도메인/TLS(cert-manager), 이미지 레지스트리(GHCR), 모니터링(Prometheus/Grafana), Argo CD(GitOps) | [K8s 학습 가이드](05-kubernetes-guide.md) |\n\n## 콘솔 API 초안\n\n| Method | Path | 동작 |\n|--------|------|------|\n| GET | `/api/envs` | 환경 목록 (`envs/*`) |\n| GET | `/api/envs/{env}/services` | 카탈로그 + `output -json` + 실시간 상태 병합 |\n| POST | `/api/envs/{env}/services` | 카탈로그에 추가 → plan 작업 생성 |\n| PATCH/DELETE | `/api/envs/{env}/services/{name}` | 수정/삭제 → plan 작업 생성 |\n| POST | `/api/runs/{id}/approve` | plan 승인 → apply |\n| GET | `/api/runs/{id}` | 작업 상태 / plan·apply 로그 |\n| GET | `/api/envs/{env}/services/{name}/logs` | 컨테이너 로그 스트림 (SSE) |\n\n## 주의할 점\n\n- Terraform 은 동시에 하나만 실행 — Runner 에서 환경별 lock 필수.\n- 콘솔 서버가 클러스터 권한(ServiceAccount + RBAC)을 가지므로 최소 권한 Role 로 제한하고, 콘솔 자체를 외부에 열 때는 인증 + VPN/IP 제한.\n- 콘솔 자체도 이 저장소의 서비스로 배포 (단, 자기 자신을 destroy 하지 못하게 보호).\n"}, {"id": "05-kubernetes-guide", "md": "# 05. Kubernetes 학습 가이드\n\n이 문서는 **우리 클러스터를 교재로** Kubernetes 를 익히기 위한 가이드다.\n개념 → 우리 코드에서 어디에 있는지 → 직접 쳐볼 명령 순서로 정리했다.\n\n```bash\nexport KUBECONFIG=~/.claudharmony/kubeconfig   # 먼저 실행\n```\n\n## 0. 큰 그림 — Terraform 과 Kubernetes 의 관계\n\n```mermaid\nflowchart LR\n    TF[Terraform<br/>원하는 상태를 코드로] -->|API 호출| API[kube-apiserver]\n    API --> ETCD[(etcd<br/>원하는 상태 저장)]\n    CTRL[컨트롤러들<br/>Deployment·ReplicaSet·Envoy Gateway] -->|watch| API\n    CTRL -->|실제 상태를 맞춤| POD[Pod / Envoy 설정]\n    KUBELET[kubelet<br/>각 노드] -->|watch| API\n    KUBELET --> CTR[컨테이너 실행]\n```\n\n- **Terraform**: \"Deployment 를 이렇게 만들어라\" 를 API 서버에 보낸다. (선언)\n- **Kubernetes 컨트롤러**: 선언된 상태와 실제 상태의 차이를 계속 메운다. (조정 루프, reconcile)\n- Pod 가 죽으면 Terraform 이 아니라 **Kubernetes 가** 다시 띄운다. Terraform 은 \"선언\"을 바꿀 때만 쓴다.\n\n## 1. 클러스터와 노드\n\n| 개념 | 설명 | 우리 코드 |\n|------|------|-----------|\n| Cluster | API 서버 + 노드들의 묶음 | `platform/cluster` |\n| Node | Pod 가 실행되는 머신. kind 에서는 **Docker 컨테이너 하나 = 노드 하나** | `claudharmony-control-plane`, `claudharmony-worker` |\n| control-plane | API 서버, etcd, 스케줄러, 컨트롤러 매니저가 도는 노드 | |\n| worker | 앱 Pod 가 주로 도는 노드 | |\n\n```bash\nkubectl get nodes -o wide                    # 노드 2대, v1.37.0\ndocker ps --filter name=claudharmony         # 노드가 사실은 Docker 컨테이너\nkubectl -n kube-system get pods              # 컨트롤플레인 구성요소들\nkubectl api-resources | head -30             # 이 클러스터가 아는 리소스 종류\n```\n\n**해보기**: `docker exec -it claudharmony-worker crictl ps` — 노드 안에서 도는 실제 컨테이너 목록.\n\n## 2. Namespace — 환경 경계\n\n| 개념 | 설명 | 우리 코드 |\n|------|------|-----------|\n| Namespace | 리소스 이름 공간 + 권한/정책 경계. 같은 이름(`hello-app`)을 dev/prd 에 각각 둘 수 있다 | `modules/k8s/env/main.tf` 의 `kubernetes_namespace_v1` |\n| Label | 키=값 태그. 선택(selector)의 기준 | `claudharmony.io/gateway-access=true` |\n\n```bash\nkubectl get ns --show-labels\nkubectl -n dev get all\nkubectl -n prd get all\n```\n\n## 3. Pod → ReplicaSet → Deployment — 앱 실행\n\n```mermaid\nflowchart LR\n    D[Deployment hello-app<br/>replicas: 1<br/>image: ...:dev-abc1234] --> RS1[ReplicaSet<br/>현재 버전]\n    D -.이전 버전.-> RS0[ReplicaSet<br/>replicas 0]\n    RS1 --> P1[Pod]\n```\n\n| 개념 | 설명 | 우리 코드 |\n|------|------|-----------|\n| Pod | 컨테이너 1개 이상 + IP 1개. 언제든 죽고 새로 생길 수 있는 **일회용** | |\n| ReplicaSet | \"이 Pod 를 N개 유지\" | (Deployment 가 자동 생성) |\n| Deployment | 버전 관리 + **롤링 업데이트** 담당 | `modules/k8s/app/main.tf` |\n| RollingUpdate | `max_surge=1, max_unavailable=0` → 새 Pod 가 Ready 된 뒤 옛 Pod 종료 = **무중단 배포** | 같은 파일 |\n| resources | `requests` = 스케줄링 시 예약량, `limits` = 상한 (메모리 넘으면 OOMKilled) | `memory_mb` |\n\n```bash\nkubectl -n dev get deploy,rs,pod\nkubectl -n dev describe deploy hello-app          # 이벤트, 전략, 이미지\nkubectl -n dev rollout history deploy/hello-app   # 배포 이력 (ReplicaSet 별)\nkubectl -n dev get pod -o jsonpath='{.items[0].spec.nodeName}'   # 어느 노드에 떴나\n```\n\n**해보기 (자가 치유)**:\n```bash\nkubectl -n dev delete pod -l app.kubernetes.io/name=hello-app\nkubectl -n dev get pod -w        # 바로 새 Pod 가 생긴다 (ReplicaSet 이 개수를 맞춤)\n```\n\n## 4. Probe — 살아있나 / 준비됐나\n\n| Probe | 실패 시 | 우리 설정 |\n|-------|---------|-----------|\n| liveness | 컨테이너 **재시작** | `/actuator/health/liveness`, 30초 후부터 10초 간격 |\n| readiness | Service 엔드포인트에서 **제외** (트래픽 안 받음) | `/actuator/health/readiness`, 5초 간격 |\n\nSpring Boot 는 Kubernetes 안에서 실행되면(`KUBERNETES_SERVICE_HOST` 환경변수 감지) 이 두 경로를 자동으로 연다.\n\n```bash\nkubectl -n dev describe pod -l app.kubernetes.io/name=hello-app | grep -A3 -E 'Liveness|Readiness'\nkubectl -n dev get endpointslices        # readiness 통과한 Pod IP 만 들어 있다\n```\n\n## 5. Service — 고정된 내부 주소\n\nPod IP 는 바뀐다. **Service** 는 라벨 selector 로 Pod 들을 찾아 고정 IP·DNS 를 준다.\n\n| 종류 | 설명 | 우리 사용 |\n|------|------|-----------|\n| ClusterIP | 클러스터 내부 전용 | `hello-app` (dev/prd) |\n| NodePort | 모든 노드의 포트(30000~32767)로 노출 | `claudharmony-gateway` (30080) |\n| LoadBalancer | 클라우드 LB 생성 | kind 에는 없음 → NodePort 로 대체 |\n\nDNS 이름: `<service>.<namespace>.svc.cluster.local` → `hello-app.dev.svc.cluster.local`\n\n```bash\nkubectl -n dev get svc hello-app -o wide\nkubectl run tmp --rm -it --image=curlimages/curl -n dev --restart=Never -- \\\n  curl -s http://hello-app.dev.svc.cluster.local/version\nkubectl run tmp --rm -it --image=curlimages/curl -n dev --restart=Never -- \\\n  curl -s http://hello-app.prd.svc.cluster.local/version    # 다른 Namespace 도 DNS 로 접근 가능\n```\n\n> Namespace 간 통신 차단은 **NetworkPolicy** 로 한다 (아직 미적용 — 다음 학습 과제).\n\n## 6. Gateway API — 외부 트래픽을 안으로\n\n```mermaid\nflowchart TB\n    GC[GatewayClass claudharmony<br/>누가 구현하나: Envoy Gateway<br/>👷 플랫폼 담당] --> G[Gateway claudharmony<br/>리스너 HTTP :80<br/>허용 Namespace: label selector<br/>👷 플랫폼 담당]\n    G --> R1[HTTPRoute prd/hello-app<br/>hostnames 없음 = 기본<br/>🧑‍💻 앱 담당]\n    G --> R2[HTTPRoute dev/hello-app<br/>hostnames: dev.localhost<br/>🧑‍💻 앱 담당]\n    R1 --> S1[Service prd/hello-app]\n    R2 --> S2[Service dev/hello-app]\n```\n\n| 리소스 | 역할 | 우리 코드 |\n|--------|------|-----------|\n| GatewayClass | 어떤 컨트롤러가 Gateway 를 구현하는지 (Envoy Gateway) | `platform/gateway/main.tf` ③ |\n| EnvoyProxy | Envoy Gateway 전용 설정 — Envoy 를 NodePort 30080 으로 | 같은 파일 ② |\n| Gateway | 실제 로드밸런서 + 리스너. Envoy Pod 가 생긴다 | 같은 파일 ④ |\n| HTTPRoute | Host/경로 → Service 규칙. **앱 Namespace 에 있다** | `modules/k8s/app/main.tf` |\n\n라우팅 규칙:\n- `/actuator...` → `/` 로 302 리다이렉트 (외부 비공개)\n- `/` (PathPrefix) → Service `hello-app:80` → Pod `:8080`\n- 여러 규칙이 맞으면 **더 긴 경로**가 이긴다\n\n```bash\nkubectl get gatewayclass,gateway -A\nkubectl get httproute -A\nkubectl -n dev describe httproute hello-app      # Status.Parents.Conditions: Accepted / ResolvedRefs\nkubectl -n envoy-gateway-system get pods          # envoy-...: 실제 트래픽 처리, envoy-gateway: 컨트롤러\ncurl -s http://localhost/version                  # prd\ncurl -s http://dev.localhost/version              # dev\ncurl -s -H 'Host: dev.localhost' http://192.168.45.214/version   # LAN 에서 dev\n```\n\n**해보기**: `envs/dev/services.auto.tfvars.json` 에서 `route_path` 를 `/hello` 로 바꾸고 `scripts/infra.sh dev plan` → 어떤 리소스가 바뀌는지 보기 (apply 는 하지 말고 되돌리기).\n\n## 7. 터널 — 클러스터에서 바깥으로\n\n각 Namespace 의 `tunnel` Deployment(cloudflared)가 **Cloudflare 로 아웃바운드 연결**을 열고,\n받은 요청을 `claudharmony-gateway.envoy-gateway-system.svc.cluster.local:80` 으로 보낸다.\ndev 는 `--http-host-header dev.localhost` 로 Host 를 바꿔 dev 라우트에 매칭되게 한다.\n\n```bash\nkubectl -n prd logs deploy/tunnel | grep -E 'trycloudflare|Registered'\n```\n\n## 8. kind 특유의 것들\n\n| 항목 | kind | 실제 클라우드 (EKS/GKE) |\n|------|------|-------------------------|\n| 노드 | Docker 컨테이너 | VM |\n| LoadBalancer Service | 없음 → NodePort + `extraPortMappings` | 클라우드 LB 자동 생성 |\n| 이미지 | `kind load docker-image` 로 노드에 직접 주입 | 레지스트리(ECR/GAR)에서 pull |\n| 업그레이드 | 클러스터 재생성 | 노드그룹 롤링 업그레이드 |\n| 스토리지 | `local-path` (노드 디스크) | EBS/PD |\n\n### 트러블슈팅에서 배운 것: externalTrafficPolicy\n\n처음 구성 때 `http://localhost/` 가 응답이 없었다. 노드 안에서 `curl 127.0.0.1:30080` 은 200 이었다.\n\n- 호스트 :80 은 **control-plane 노드**의 30080 에만 연결돼 있다 (kind `extraPortMappings`).\n- Envoy Pod 는 **worker 노드**에 떠 있다.\n- Envoy Gateway 의 Service 기본값 `externalTrafficPolicy: Local` = \"이 노드에 Pod 가 있을 때만 받는다\" → control-plane 으로 들어온 외부 트래픽이 **버려짐**.\n- `Cluster` 로 바꾸면 kube-proxy 가 다른 노드의 Pod 로 전달한다. (대가: 클라이언트 원본 IP 가 SNAT 으로 가려짐)\n\n## 9. 다음 학습 과제 (순서 추천)\n\n| # | 주제 | 해볼 것 |\n|---|------|---------|\n| 1 | ConfigMap / Secret | 앱 설정을 env 대신 ConfigMap 으로, DB 비밀번호를 Secret 으로 |\n| 2 | HPA | `replicas` 대신 CPU 기반 자동 확장 (metrics-server 설치 필요) |\n| 3 | NetworkPolicy | dev ↔ prd Namespace 간 통신 차단 |\n| 4 | PodDisruptionBudget / anti-affinity | replicas 2 이상일 때 노드별 분산 |\n| 5 | 모니터링 | kube-prometheus-stack (Prometheus + Grafana) 를 `platform/` 3번째 스택으로 |\n| 6 | 레지스트리 | GHCR 로 이미지 push/pull — kind load 제거 |\n| 7 | TLS | 도메인 구매 후 cert-manager + Gateway HTTPS 리스너 |\n| 8 | GitOps | Argo CD 로 \"Git = 클러스터 상태\" — 어드민 콘솔과 비교해보기 |\n| 9 | 실서버 | k3s (사무실 미니PC) 또는 EKS/GKE 로 `platform/cluster` 만 교체 |\n"}, {"id": "06-cicd", "md": "# 06. CI/CD — 브랜치 전략과 배포\n\n## 저장소\n\n| 저장소 | 공개 | 내용 | 기본 브랜치 |\n|--------|------|------|-------------|\n| [claudharmony-web](https://github.com/ParkSeWoo/claudharmony-web) | private | 프론트 — SvelteKit 3 (Node 24), 외부 `/` | `main`* |\n| [claudharmony-api](https://github.com/ParkSeWoo/claudharmony-api) | private | 백엔드 — Spring Boot 4.1.2 / Java 25, 내부 전용 | `main`* |\n| [claudharmony-console](https://github.com/ParkSeWoo/claudharmony-console) | private | 관리자 콘솔 | `main` |\n| ~~claudharmony-homepage~~ | private | (구) hello-app — **2026-10-24 archive**, 러너 제거 | — |\n| [claudharmony-infra](https://github.com/ParkSeWoo/claudharmony-infra) | public | Terraform (클러스터/게이트웨이/환경), 배포 기록, 문서 | `main` |\n\n\\* web/api 는 2026-10-24 현재 `main` 만 push 된 상태 — `develop` push 부터 dev 배포가 시작된다.\n\n## 앱 브랜치 전략\n\n```mermaid\ngitGraph\n    commit id: \"init\"\n    branch develop\n    checkout develop\n    branch feature/login\n    commit id: \"작업\"\n    checkout develop\n    merge feature/login id: \"PR merge → dev 자동 배포\"\n    branch release/20261024\n    commit id: \"QA 수정\"\n    checkout main\n    merge release/20261024 id: \"prd 검증 후 merge\"\n    checkout develop\n    merge main id: \"back-merge\"\n```\n\n| 브랜치 | 용도 | 배포 |\n|--------|------|------|\n| `feature/*` | 기능 개발 | PR 시 CI 빌드 검증만 |\n| `develop` | 통합 | **push/merge 하면 dev 자동 배포** |\n| `release/YYYYMMDD` | 운영 배포 후보 | **Actions 에서 \"Deploy prd\" 수동 실행 → prd** |\n| `main` | 운영에 나간 코드 | prd 검증 끝난 release 를 merge (배포 트리거 없음) |\n\n### 운영 배포 절차\n\n> DB 스키마 변경이 있는 릴리스는 **`DB schema prd`(계획 → `apply prd`) 를 먼저** 실행. 안 하면 `Deploy prd` 가 `check` 에서 멈춘다.\n\n```bash\ncd ~/workspace/claudharmony-homepage\ngit checkout develop && git pull\ngit checkout -b release/20261024 && git push -u origin release/20261024\n\n# GitHub → claudharmony-homepage → Actions → \"Deploy prd\" → Run workflow\n#   → Branch: release/20261024 → Run\n# (CLI: gh workflow run deploy-prd.yml --ref release/20261024)\n\n# 운영 확인 (curl http://localhost/version, 터널 주소) 후\ngh pr create --base main --head release/20261024 --title \"release/20261024\"\ngh pr merge --merge\ngit checkout develop && git merge origin/main && git push      # back-merge\n```\n\n`release/*` 가 아닌 브랜치에서 \"Deploy prd\" 를 실행하면 `reject` 잡이 실패시킨다.\n\n## 앱 ↔ 인프라 계약\n\n모든 서비스 공통 — 지키면 인프라 변경 없이 배포된다. 바꿔야 하면 infra 도 함께 수정.\n\n| # | 조건 | 인프라 쪽 위치 |\n|---|------|----------------|\n| 1 | 루트 `Dockerfile` 로 빌드, 빌드 인자 `APP_VERSION` | 앱 워크플로 `docker build` |\n| 2 | `/actuator/health/liveness`, `/actuator/health/readiness` 200 (**Node 앱도 같은 경로**) | `modules/k8s/app` probe |\n| 3 | `/actuator/**` 는 외부 비공개 (Gateway 에서 `/` 로 리다이렉트) | `modules/k8s/app` HTTPRoute |\n| 4 | `GET /version` → `{env, version}` (외부 노출 서비스) | 배포 확인 |\n| 5 | 워크플로는 `shell: bash`(pipefail) + 배포 전 infra 클론 `pull --ff-only` | 앱 `.github/workflows/deploy-*.yml` |\n| 6 | 서비스 이름 = 카탈로그 key = Deployment/Service 이름 = 내부 DNS | `envs/*/services.auto.tfvars.json` |\n| 7 | `\"database\": true` 면 `SPRING_DATASOURCE_URL/USERNAME/PASSWORD` 주입 (PostgreSQL `pg-rw`). **스키마는 `db/schema.sql`(Atlas)** — 앱은 스키마를 바꾸지 않음, prd 는 `DB schema prd` → `Deploy prd` 순서 | [데이터베이스](09-database.md) |\n\n### 서비스 카탈로그 (dev / prd 동일)\n\n| 서비스 | 이미지 | 포트 | 외부 경로 | 메모리 | 저장소 |\n|--------|--------|------|-----------|--------|--------|\n| `web` | `claudharmony/web` | 3000 | `/` | 256Mi | claudharmony-web |\n| `api` | `claudharmony/api` | 8080 | — (내부 전용, `http://api`) | 512Mi | claudharmony-api · `database=true` (**Atlas `db/schema.sql`**) |\n\n\n- **web → api** 는 SSR 서버 간 호출: 같은 Namespace 의 Service `api` (포트 80 → 8080) — `http://api`\n- 2026-10-24 hello-app → web 전환 완료 (dev, prd). 같은 경로가 겹치면 **먼저 생성된 HTTPRoute 가 우선**이라, 새 서비스를 띄워 검증한 뒤 옛 서비스를 카탈로그에서 빼는 방식으로 무중단 전환했다\n\n### 동시 배포\n\n여러 저장소의 러너가 같은 infra 클론과 Terraform state 를 쓰므로 `deploy.sh` 가 `~/.claudharmony/deploy.lock` (mkdir 잠금)으로 **한 번에 하나씩** 처리하고, `terraform` 은 `-lock-timeout=10m` 으로 state 잠금을 기다린다.\n\n## 이미지 태그 규칙\n\n| 환경 | 태그 | 예 |\n|------|------|----|\n| dev | `dev-<커밋 7자리>` | `claudharmony/hello-app:dev-1a2b3c4` |\n| prd | `<release 날짜>-<커밋 7자리>` | `claudharmony/hello-app:20261024-1a2b3c4` |\n\n`GET /version` 이 `{\"env\":\"prd\",\"version\":\"20261024-1a2b3c4\"}` 처럼 현재 배포를 알려준다.\n\n## 배포 파이프라인 (앱)\n\n```mermaid\nsequenceDiagram\n    actor Dev as 개발자\n    participant GH as GitHub (homepage)\n    participant R as self-hosted runner<br/>(사무실 Mac)\n    participant I as GitHub (infra)\n    participant K as kind 클러스터\n\n    Dev->>GH: develop 에 push / merge\n    GH->>R: deploy-dev 잡 (러너가 GitHub 을 폴링해서 가져감)\n    R->>R: docker build -t hello-app:dev-<sha>\n    R->>R: infra 클론(~/.claudharmony/infra-deploy) git pull\n    R->>K: kind load docker-image\n    R->>R: envs/dev/images.auto.tfvars.json 갱신\n    R->>K: terraform apply (Deployment 이미지 변경 → 롤링 업데이트)\n    R->>K: kubectl rollout status\n    R->>I: git push \"deploy(dev): hello-app=... [skip ci]\"\n    R-->>GH: Step summary 에 이미지/터널 주소\n```\n\n- **왜 self-hosted runner?** 사무실은 이중 NAT 라 GitHub 이 사무실로 접속할 수 없다. 러너가 **바깥으로** GitHub 에 붙어서 일을 가져가므로 포트포워딩이 필요 없다.\n- **왜 배포 기록을 infra 에 커밋?** \"지금 prd 에 뭐가 떠 있나\" 가 Git 에 남고, 롤백은 그 파일을 이전 커밋으로 되돌리면 된다.\n\n## 인프라 파이프라인\n\n`claudharmony-infra` 의 `main` 에 push(머지)되면 **바뀐 스택을 자동 적용**한다.\n\n| 변경 경로 | 자동 적용 | 비고 |\n|-----------|-----------|------|\n| `platform/gateway/**` | gateway | |\n| `modules/k8s/**`, `envs/dev/**` | dev | gateway 다음 순서로 |\n| `envs/prd/**` | ❌ 수동 | Actions → Infra apply → Run workflow → `prd` |\n| `platform/cluster/**` | ❌ 수동 | kind 는 재생성 — gateway/dev/prd 도 다시 적용해야 함 |\n\n- prd 인프라 변경은 수동 실행하거나, **다음 prd 앱 배포 때** 함께 적용된다 (`deploy.sh` 가 환경 전체를 apply).\n- 배포 기록 커밋(`[skip ci]`)은 이 워크플로를 다시 돌리지 않는다.\n\n## Self-hosted runner\n\n| 항목 | 값 |\n|------|----|\n| 위치 | `~/.claudharmony/runners/<repo>/` (저장소당 1개) |\n| 이름 | `office-mac-<repo>` (infra, web, api — console 은 등록 예정) |\n| 라벨 | `self-hosted`, `claudharmony-office` |\n| 실행 방식 | launchd 서비스 (`svc.sh`) — 로그인 시 자동 시작 |\n| 등록 | `scripts/setup-runner.sh [repo ...]` (인자 없으면 infra, web, api, console) |\n\n```bash\ncd ~/.claudharmony/runners/claudharmony-homepage && ./svc.sh status\ngh api repos/ParkSeWoo/claudharmony-homepage/actions/runners --jq '.runners[] | \"\\(.name) \\(.status)\"'\n```\n\n### 보안\n\n- `claudharmony-infra` 는 **public** 이다. 외부인의 포크 PR 이 이 Mac 에서 코드를 실행하지 못하도록\n  **\"모든 외부 기여자 워크플로는 승인 필요\"** 로 설정했다 (`fork-pr-contributor-approval = all_external_contributors`).\n- 워크플로 트리거는 `push`(main) 와 `workflow_dispatch` 만 사용 — `pull_request` 로 self-hosted 러너를 쓰지 않는다.\n- 더 안전하게 하려면 infra 저장소를 private 으로 전환 (권장).\n\n## 필요한 GitHub 권한\n\n| 무엇 | 왜 |\n|------|----|\n| gh 토큰 `workflow` scope | `.github/workflows/*` 파일 push (2026-10-24 `gh auth refresh -s workflow` 로 추가) |\n| 러너 계정(이 Mac 의 gh 로그인)이 infra 저장소 push 권한 | 배포 기록 커밋 |\n"}, {"id": "07-worklog", "md": "# 07. 작업 기록 (Worklog)\n\n모든 작업을 단계별로 기록한다. **새 작업은 맨 위 날짜 섹션 아래에 이어서 추가.**\n각 항목: 무엇을 했나 → 결과 → (문제가 있었다면) 원인과 해결 → 배운 점.\n\n---\n\n## 2026-10-24 (토) — 사무실 인프라 1일차\n\n### 진행 상태 요약\n\n| # | 단계 | 상태 |\n|---|------|------|\n| 1 | 환경 점검 & 저장소 연결 | ✅ |\n| 2 | Docker + Terraform 으로 nginx → Spring Boot | ✅ |\n| 3 | 모듈 구조 / 서비스 카탈로그 (어드민 콘솔 기반) | ✅ |\n| 4 | 문서 (md/html) + Obsidian | ✅ |\n| 5 | 외부 접속 시도 — 공유기 포트포워딩 | ⛔ 이중 NAT (상위 공유기 계정 없음) |\n| 6 | 외부 접속 — Cloudflare Tunnel | ✅ |\n| 7 | dev / prd 환경 분리 + 배포 스크립트 | ✅ |\n| 8 | 앱 저장소 분리 (claudharmony-homepage) + 배포 워크플로 | ✅ |\n| 9 | Kubernetes v1.37 (kind) + Envoy Gateway 로 전환 | ✅ |\n| 10 | 인프라 자동 적용 워크플로 | ✅ (러너 등록 후 동작) |\n| 11 | self-hosted runner 등록 | ✅ (사용자 실행) |\n| 12 | 파이프라인 E2E — dev | ✅ `dev-c0184f6` 자동 배포 |\n| 13 | 파이프라인 E2E — prd | ✅ `20261024-c0184f6` 수동 배포 + 기록 자동 커밋 |\n| 14 | web / api 분리 — 카탈로그·동시배포 잠금 | ✅ |\n| 15 | api / web 러너 등록 | ✅ (사용자 실행, 러너 4개 online) |\n| 16 | dev 에 api → web 배포, hello-app 제거 | ✅ dev `/` = web `dev-05aa8f3` |\n| 17 | prd 에 api → web 배포, hello-app 제거 | ✅ prd `/` = web `20261024-05aa8f3` |\n| 18 | 도메인 claudharmony.io 연결 (Named Tunnel) | ✅ apex/www → prd, dev. → dev |\n| 19 | k9s / KUBECONFIG 정리 | ✅ |\n\n---\n\n### 1. 환경 점검 & 저장소 연결\n\n- 확인: Terraform 1.15.6, Docker Desktop 27.4 (arm64), gh 로그인(ParkSeWoo), Java 25(호스트, 사용 안 함)\n- GitHub `ParkSeWoo/claudharmony-infra` 는 빈 public 저장소였음\n- 포트 점유 확인: 80 비어 있음, 8080 은 다른 프로젝트(airflow) 사용 중 → 앱 포트를 호스트에 열지 않기로\n- `~/infra` 생성, `git init` → push\n\n**문제**: SSH 로 push 실패 (`Please make sure you have the correct access rights`)\n**원인**: 이 Mac 의 SSH 키가 GitHub 에 등록 안 됨 (gh 는 protocol=ssh 로 설정돼 있었음)\n**해결**: `gh auth setup-git` + 원격 주소를 HTTPS 로 → gh 토큰으로 인증\n\n### 2. Docker + Terraform 으로 nginx → Spring Boot\n\n- Spring Boot 3.5.6 / Java 21, `GET /` → \"안녕하세요 클라우드 하모니\"\n- Dockerfile 멀티스테이지 (`gradle:8.14-jdk21` → `eclipse-temurin:21-jre`) — 호스트에 JDK 불필요\n- Terraform `kreuzwerker/docker` provider 로 network / app / nginx 컨테이너\n\n**문제 1**: `fileset(dir, \"{Dockerfile,*.gradle,src/**}\")` → `syntax error in pattern`\n**해결**: 패턴 3개로 나눠 `setunion(fileset(...), ...)`\n\n**문제 2**: `docker_image` build → `Error running legacy build: failed to read downloaded context: ... 403`\n**원인**: provider 의 legacy builder 가 Docker Desktop(containerd image store)과 호환 안 됨. `docker build`(BuildKit) 는 정상\n**해결**: `terraform_data` + `local-exec docker build` 로 빌드, 이미지 태그 = 소스 해시\n\n**문제 3**: apply 후에도 plan 에 `memory_swap = 1024 -> null` 계속 표시 (드리프트)\n**원인**: Docker 가 memory 지정 시 swap 기본값을 채워 넣음\n**해결**: 모듈에서 `memory_swap = memory * 2` 명시\n**배운 점**: provider 가 기본값을 채우는 속성은 코드에 명시해야 plan 이 깨끗해진다\n\n**문제 4**: 앱 컨테이너를 재생성하면 nginx 가 502 를 낼 위험\n**원인**: nginx `upstream` 블록은 시작 시 DNS 를 한 번만 resolve\n**해결**: `resolver 127.0.0.11` + `set $upstream ...; proxy_pass http://$upstream;` (요청마다 resolve). `-replace` 로 앱 재생성해서 200 확인\n\n### 3. 모듈 구조 / 서비스 카탈로그\n\n- 모듈: network(VPC) / app-service(Compute) / reverse-proxy(LB) — 클라우드 개념 매핑\n- 서비스 목록을 `services.auto.tfvars.json` 으로 분리 → 어드민 콘솔은 JSON 만 수정하면 되는 구조\n- `terraform state mv 'module.hello' 'module.service[\"hello-app\"]'` 로 리소스 재생성 없이 주소 이동\n\n### 4. 문서 + Obsidian\n\n- `docs/*.md` + `scripts/build_docs.py` 로 `docs/index.html` 생성 (marked + mermaid)\n- Obsidian `클라우드하모니/인프라 구성/` 에 MOC + 문서\n- infra 저장소가 public 이라 **공인 IP / MAC 은 저장소 문서에 placeholder**, 실제 값은 Obsidian 에만\n  (`~/.claudharmony/private.json` → `scripts/sync_obsidian.py` 가 치환)\n\n### 5. 외부 접속 시도 — 공유기 포트포워딩 (실패)\n\n1. 공인 IP:80 → 공유기 로그인 페이지(`GNT2400`) 응답 → 80 대신 **8888** 사용하기로\n2. UPnP 자동 포워딩 시도 → 공유기에 IGD 는 있으나 제어 요청 `Connection refused` (UPnP 비활성)\n3. 사용자가 SK브로드밴드 **GW-ME611R** 에 `TCP 8888 → 192.168.45.214:80` 등록\n4. 외부(check-host.net 3개국)에서 8888 **타임아웃**, 80 도 타임아웃\n5. SK 공유기 WAN 정보 확인 → **WAN IP = 192.168.75.142 (사설)** → **이중 NAT**\n6. 상위 공유기 `192.168.75.1` = GNT2400 (공인 IP 보유) — 관리자 계정 없음 → **포트포워딩 불가**\n\n**배운 점**\n- 사무실 *안에서* 공인 IP 로 접속해서 보이는 화면은 외부 개방의 증거가 아니다 (공유기 자신이 응답)\n- 외부 검증은 반드시 바깥에서 (LTE, check-host.net)\n- `traceroute` 2번째 홉이 사설/무응답이면 이중 NAT 를 의심\n- 기본 비밀번호 추측으로 남의 장비(상위 공유기)에 들어가지 않는다\n\n### 6. 외부 접속 — Cloudflare Tunnel\n\n- cloudflared 가 **바깥으로** Cloudflare 에 연결 → `https://<랜덤>.trycloudflare.com` 발급. NAT/포트포워딩 무관\n- Claude Code 자동 권한 검사가 \"외부 공개 터널\" 을 2회 차단 → 사용자가 명시적으로 요청한 뒤 실행\n- check-host 3개국 200 OK 확인\n\n### 7. dev / prd 환경 분리\n\n- `modules/stack` (환경 1개 전체) + `envs/dev`(8081) / `envs/prd`(80)\n- state 를 저장소 밖 `~/.claudharmony/state/<env>.tfstate` 로 (`backend \"local\" {}` + `-backend-config=path=`)\n- `scripts/deploy.sh <env> <service> <image>`: images 파일 갱신 → apply → 헬스 확인 → 배포 기록 커밋 `[skip ci]`\n- nginx 에서 `/actuator` 외부 차단, 앱에 `GET /version` 추가\n\n**문제**: workflow 파일 push 거부 `refusing to allow an OAuth App to create or update workflow ... without workflow scope`\n**해결**: `gh auth refresh -h github.com -s workflow` (디바이스 코드 인증, 사용자 승인)\n\n### 8. 앱 저장소 분리\n\n- `claudharmony-hello` 로 만들었다가 사용자 요청으로 **`claudharmony-homepage`** 로 이름 변경 (`gh repo rename`) — private, 기본 브랜치 `develop`\n- 로컬: `~/workspace/claudharmony-homepage`\n- 워크플로: `ci.yml`(PR 빌드), `deploy-dev.yml`(develop push), `deploy-prd.yml`(release/* 수동, 다른 브랜치면 reject)\n\n### 9. Kubernetes 전환\n\n**버전 조사**: kindest/node v1.37.0 (kind v0.33.0 기본), Envoy Gateway v1.9.2, Gateway API v1.6.3.\ningress-nginx 는 2026-03 retire → **Gateway API** 채택.\n\n1. `brew upgrade kind` (0.31 → 0.33), `brew install kubernetes-cli` (1.37.1)\n2. Docker 기반 dev/prd destroy (호스트 80 을 kind 가 써야 함), Docker 모듈은 `modules/docker/` 로 보관\n3. `platform/cluster` apply — control-plane + worker, `extraPortMappings 30080 → 호스트 80`, 전용 kubeconfig `~/.claudharmony/kubeconfig` (기존 `kind-ch4` 컨텍스트 보호)\n4. `platform/gateway` apply — helm `gateway-helm v1.9.2`, EnvoyProxy(NodePort 30080, 서비스 이름 고정 `claudharmony-gateway`), GatewayClass, Gateway(allowedRoutes: 라벨 selector)\n5. `modules/k8s/{env,app,tunnel}` + `envs/dev`(hostnames `dev.localhost`) / `envs/prd`(catch-all)\n6. 이미지 `kind load` 후 dev/prd apply → Pod Running, HTTPRoute 2개 attached\n\n**문제**: `http://localhost/` 응답 없음. 노드 안에서 `curl 127.0.0.1:30080` 은 200\n**원인**: Envoy Service 의 `externalTrafficPolicy: Local`(Envoy Gateway 기본). 호스트 포트는 control-plane 노드로만 들어오는데 Envoy Pod 는 worker 에 있어서 트래픽이 버려짐\n**해결**: EnvoyProxy `envoyService.externalTrafficPolicy = \"Cluster\"`\n**결과**: `localhost` → prd, `dev.localhost` → dev, LAN `192.168.45.214` → prd, `/actuator/env` → 302, 터널 2개 모두 200\n\n### 10. 인프라 자동 적용\n\n- `infra-apply.yml`: main push 시 `dorny/paths-filter` 로 바뀐 스택만 — gateway / dev 자동, prd·cluster 수동\n- infra 저장소(public)에 \"모든 외부 기여자 워크플로 승인 필요\" 설정\n\n### 11. Self-hosted runner (대기)\n\n- `scripts/setup-runner.sh` 작성 — 저장소별 러너 등록 + launchd 서비스\n- Claude Code 자동 권한 검사가 \"상시 실행 서비스 설치\" 로 차단 → **사용자가 직접 실행**: `! ~/infra/scripts/setup-runner.sh`\n\n### 12. 문서 개편 & 정리\n\n- docs 전면 개편: 01 아키텍처(K8s), 03 운영(Runbook), **05 K8s 학습 가이드**, 06 CI/CD, 07 작업 기록\n- `sync_obsidian.py`: 제목의 `/` 를 `·` 로 치환 (`06 CI/CD.md` 가 하위 폴더로 해석돼 실패하던 문제)\n- 러너가 없어 대기 중이던 **옛 코드(Docker 기준) Infra apply 실행 2건 취소** — 러너가 붙는 순간 K8s state 에 옛 코드가 적용되는 것을 방지\n- 앱 `Deploy dev` 대기 1건은 유지 → 러너 등록 시 E2E 테스트로 사용\n\n### 13. 홈페이지 개발은 다른 세션이 담당\n\n- 사용자: \"홈페이지는 다른 세션이 만들고 있어\" → `~/workspace/claudharmony-homepage` 는 이 세션에서 더 수정하지 않음\n- 다른 세션(ai-root-78)에 **앱 ↔ 인프라 계약**(Dockerfile, 8080, actuator probe, 512Mi, 이름 고정, `/version`, 워크플로 유지) 전달\n- 계약은 [CI/CD](06-cicd.md) 문서에 표로 정리\n- 주의: 러너가 등록되면 develop push 가 즉시 dev 배포를 트리거한다\n\n### 14. 러너 등록 & dev 파이프라인 첫 실행\n\n- 사용자가 `scripts/setup-runner.sh` 실행 → 러너 2개 online (launchd 서비스)\n- 대기 중이던 `Deploy dev` 가 바로 실행 → **14초 만에 ✓ 성공 표시인데 실제로는 배포 안 됨** (`/version` 이 그대로 `dev-initial`)\n\n**문제 1**: `deploy.sh: Permission denied`\n**원인**: `Write` 로 만든 파일이라 git 에 실행 권한(100755)이 없었음 (`git ls-files -s` 로 확인)\n**해결**: `chmod +x` + `git update-index --chmod=+x`\n\n**문제 2**: 실패했는데 워크플로가 성공으로 표시\n**원인**: `run:` 의 기본 셸은 `bash -e {0}` — `deploy.sh | tee deploy.log` 에서 파이프 앞쪽 실패를 무시\n**해결**: 워크플로에 `defaults.run.shell: bash` → GitHub 이 `bash --noprofile --norc -eo pipefail` 로 실행\n**배운 점**: CI 에서 `| tee` 를 쓸 땐 반드시 pipefail. \"성공\" 표시만 믿지 말고 결과(`/version`)로 검증\n\n**문제 3**: 배포용 infra 클론이 오래된 스크립트를 실행할 수 있음 (클론이 있으면 pull 안 함)\n**해결**: 워크플로에서 deploy 전에 `git -C $INFRA pull --ff-only`\n\n→ 홈페이지 저장소 워크플로 2개만 GitHub API 로 커밋 (다른 세션의 로컬 작업은 건드리지 않음, 해당 세션에 알림)\n\n- 재실행 결과: **dev = `dev-c0184f6` 롤링 업데이트 성공** ✅\n\n**문제 4**: 배포 기록 push 실패 `could not read Username for 'https://github.com': Device not configured`\n**원인**: launchd 서비스로 도는 러너는 `gh` 의 키체인 인증을 못 읽음\n**임시 조치**: 기록 커밋을 수동 push (`f54bd26`)\n**해결 (진행 중)**: infra 저장소 전용 **SSH deploy key** — `scripts/setup-deploy-key.sh` (Claude Code 권한 검사가 \"접근 권한 추가\" 로 차단 → 사용자 실행 필요)\n**추가**: `deploy.sh` 가 기록 push 실패 시 **에러로 종료**하도록 변경 (기록 누락 시 다음 apply 가 옛 이미지로 되돌릴 위험)\n\n### 15. Deploy key 설정 (사용자 실행)\n\n- 사용자가 `scripts/setup-deploy-key.sh` 실행 → deploy key 등록(id 167503523) 성공, 연결 테스트 실패\n\n**문제**: `ssh: connect to host github.com port 22: Operation timed out`\n**원인**: 사무실 네트워크가 **아웃바운드 22번 포트 차단**\n**해결**: GitHub 의 SSH-over-443 사용 — 원격을 `ssh://git@ssh.github.com:443/ParkSeWoo/claudharmony-infra.git` 로 (스크립트 수정 `e269b3d`)\n**확인**: `env -u SSH_AUTH_SOCK git ls-remote` 성공 — 에이전트/키체인 없이 deploy key 만으로 접근됨\n**배운 점**: 회사/사무실망은 22 를 막는 경우가 많다 → `ssh -T -p 443 git@ssh.github.com`\n\n- 다른 세션으로 보낸 공지 2건은 권한 모드 차이로 **보류 후 만료(미전달)** → 사용자 요청으로 재전송 (승인 대기)\n- prd 배포 테스트(`release/20261024` 생성 + Deploy prd 실행)는 Claude Code 권한 검사가 \"운영 배포\" 로 차단 → 전략대로 **사용자가 수동 실행**\n\n### 16. prd 배포 E2E 테스트 (사용자 요청으로 실행)\n\n1. `release/20261024` 브랜치 생성 (develop `c0184f6` 기준 — 홈페이지 작업 반영 전, 파이프라인 검증용)\n2. `gh workflow run deploy-prd.yml --ref release/20261024` → **success** (deploy ✓, reject skipped)\n3. 검증\n   - `http://localhost/version` → `{\"version\":\"20261024-c0184f6\",\"env\":\"prd\"}`\n   - prd 터널 주소 → 같은 응답 (외부 접속 OK)\n   - infra 저장소에 `5944985 claudharmony-deploy: deploy(prd): hello-app=...:20261024-c0184f6 [skip ci]` — **deploy key 로 자동 커밋 성공**\n   - `[skip ci]` 라 Infra apply 워크플로는 실행되지 않음 ✓\n4. 가드 테스트: `develop` 에서 Deploy prd 실행 → **reject 잡 실패, deploy skipped**, prd 버전 그대로 ✓\n\n**남은 절차 (사용자)**: prd 확인 후 `release/20261024` → `main` PR merge, `main` → `develop` back-merge.\n(홈페이지 실제 릴리스는 다른 세션 작업이 develop 에 들어온 뒤 새 release 브랜치로)\n\n### 17. homepage 사이클 마무리 (사용자 요청)\n\n- PR #1 `release/20261024` → `main` merge (`c1b09bb`), `main` → `develop` back-merge (`45d45c0`, GitHub merges API)\n\n### 18. 홈페이지 → web / api 분리 (다른 세션 ai-root-78 요청)\n\n다른 세션이 홈페이지를 두 저장소로 분리하고 카탈로그 추가를 요청:\n- `claudharmony-web` — SvelteKit 3 (Node 24), :3000, `/`, probe 경로는 actuator 와 동일하게 맞춤, `/version` 제공\n- `claudharmony-api` — Spring Boot 4.1.2 / Java 25, :8080, 내부 전용\n- 두 저장소 워크플로에 #14 의 수정(pipefail, infra pull) 반영 확인 (`gh api .../contents`)\n\n작업:\n1. `envs/dev`, `envs/prd` 카탈로그에 `api`(내부), `web`(`/`, 256Mi) 추가 — 이미지가 없어 리소스는 아직 생성 안 됨 (`local.deployed` 필터)\n2. **동시 배포 대비**: 서비스가 여럿이면 러너들이 같은 infra 클론/state 를 동시에 씀\n   - `deploy.sh`: `mkdir` 기반 잠금 (`~/.claudharmony/deploy.lock`, 최대 10분 대기). macOS 에 `flock` 없음\n   - 첫 버전에 잠금 실패 시 남의 잠금을 지우는 버그 → 재작성, 가짜 스크립트 2개 동시 실행으로 **순차 처리 확인**\n   - `infra.sh`: `terraform plan/apply -lock-timeout=10m`\n3. push → **Infra apply 워크플로 첫 실전 실행**: changes 감지 → dev 만 실행 → `No changes` ✓\n4. 러너 등록(api, web)은 사용자 실행 필요: `scripts/setup-runner.sh claudharmony-api claudharmony-web`\n\n**배운 점**: Gateway API 에서 같은 경로의 HTTPRoute 가 겹치면 **생성 시각이 오래된 라우트가 우선** → 새 서비스를 먼저 띄우고 옛 라우트를 지우는 방식으로 무중단 전환 가능\n\n### 19. api / web 러너 등록\n\n- 사용자가 `scripts/setup-runner.sh claudharmony-api claudharmony-web` 실행 → 2개 online\n- 등록 직후 infra 러너가 **offline** 으로 표시\n\n**원인**: 직전 Infra apply 잡을 끝낸 뒤 GitHub 브로커 연결이 끊김 (`SocketException (89): Operation canceled`) — 러너가 자동 재시도(backoff)\n**조치**: 재부팅 아님(uptime 41일), launchd 프로세스 살아 있음 확인 → 1분 내 **online 복귀**\n**배운 점**: 러너 상태는 `gh api repos/<r>/actions/runners`, 원인은 `~/.claudharmony/runners/<repo>/_diag/Runner_*.log`\n\n- 다른 세션(ai-root-78)에 준비 완료 알림 → 다음: develop push 로 dev 에 api → web 배포\n\n### 20. dev: hello-app → web 전환\n\n다른 세션(ai-root-78)이 develop push → **Deploy dev 자동 배포**: api `dev-09e3172`, web `dev-05aa8f3` (배포 잠금으로 순차 처리, 기록 자동 커밋)\n- ai-root-78 검증: port-forward 로 web `/`, `/blog`, `/blog/gateway-api` 200, `/blog/nope` 404, web → `http://api` 연동(글 7개)\n- 이 시점 `dev.localhost` 는 **먼저 생긴 hello-app 라우트**가 응답 (`dev-45d45c0`) — 예상대로\n\n전환:\n1. `envs/dev/services.auto.tfvars.json`, `images.auto.tfvars.json` 에서 `hello-app` 제거\n2. `plan`: hello-app 의 HTTPRoute / Deployment / Service **3 destroy**, 나머지 변경 없음\n3. push(`6a558b1`) → **Infra apply 가 dev 자동 적용** ✓\n4. 검증: `http://dev.localhost/version` → `dev-05aa8f3`, `<title>클라우드 하모니`, dev 터널도 web, prd 는 `20261024-c0184f6` 그대로\n\n**배운 점**: 같은 경로 라우트가 겹칠 때 옛 라우트를 지우는 순간 새 라우트로 넘어감 → 사전 검증(port-forward) + 라우트 삭제 = 무중단 전환\n\n**협업 이슈**: 이 세션 → ai-root-78 메시지가 계속 보류/만료됨. 원인은 두 세션의 **권한 모드 차이**(ai-root-78 = bypass, 이 세션 = auto). 반대 방향(ai-root-78 → 이 세션)은 전달됨.\n\n### 21. prd: api → web 배포, hello-app 제거 (사용자 요청 \"prd 에도 web 배포해줘\")\n\n1. claudharmony-api, claudharmony-web 에 `release/20261024` 생성 (각 develop = dev 검증 커밋 `09e3172`, `05aa8f3`)\n2. **api 먼저** Deploy prd → success, `api 1/1 20261024-09e3172`\n3. web Deploy prd → success, `web 1/1 20261024-05aa8f3`\n4. 전환 전 내부 검증: `kubectl -n prd port-forward svc/web 3300:80` → `/`, `/blog`, `/version` 200 (`/blog` 로 web → api 연동 확인)\n5. `envs/prd` 카탈로그·images 에서 hello-app 제거 → plan `3 to destroy` → push → **Infra apply 수동 실행(stack=prd)** success\n6. 검증\n   - `http://localhost/version` → `{\"env\":\"prd\",\"version\":\"20261024-05aa8f3\"}`, LAN `192.168.45.214` → `<title>클라우드 하모니`\n   - 외부(check-host 9개 노드: DE/PT/US/IN/RO/HK/IL/NL): prd 터널 `/`, `/blog`, `/version` 모두 200\n   - prd 리소스: Deployment `api`, `tunnel`, `web` / HTTPRoute `web`\n\n**남은 것**: 각 저장소 `release/20261024` → `main` merge, `main` → `develop` back-merge / claudharmony-homepage archive\n\n### 22. 터널 순간 끊김 조사\n\n- 사용자: \"갑자기 안 나온다\" → 로컬/외부 모두 200, 에셋·SSR 정상\n- `kubectl logs deploy/tunnel` 에서 15:44 KST prd·dev 터널 **동시에** `QUIC ... timeout: no recent network activity` → 1초 내 재연결\n- 같은 시각 러너도 브로커 연결 끊김 → **사무실 회선 순간 단절**로 판단\n- 대책: 고정 도메인 + named tunnel 커넥터 이중화 (#23)\n\n### 23. 도메인 claudharmony.io 연결\n\n1. 도메인: **Cloudflare Registrar** 에서 `claudharmony.io` 구매 (네임서버 자동, WHOIS 비공개)\n2. `platform/edge` 스택 작성 — cloudflare provider `~> 5.27.0` (5.28.1 은 4일 된 버전이라 제외), `terraform providers schema -json` 으로 v5 리소스 속성 확인 후 작성\n3. `infra.sh`: `edge` 스택 추가, 이 스택만 `~/.claudharmony/cloudflare.env` 로드\n4. 토큰 발급 (계정 API 토큰) — 사용자와 화면 보며 진행\n\n**문제 1**: 터널 생성 `10000 Authentication error`, 그러나 터널 목록/zone/DNS 조회는 성공\n- 빈 body POST 로 판별 → 여전히 10000 = 권한 문제\n- 추가 단서: `access/apps` → `access.api.error.not_enabled` → **Zero Trust 미개설**\n- 사용자가 Zero Trust(Free) 활성화 → Access 는 정상화, 터널 생성은 여전히 10000\n\n**문제 2**: 토큰에 터널 쓰기 권한 없음\n- UI 에서 \"Cloudflare Tunnel\" 검색 시 **Argo Tunnel (Legacy)** 만 보임 → 이것만으론 부족\n- 정책 카운터가 `0/72` → 앞서 체크한 권한이 저장되지 않았던 것도 확인\n- **Cloudflare One Connector: cloudflared — Edit** (+ Connectors, Access, Argo Legacy) 추가·저장 → 빈 body POST 가 `1030 missing field name` = 권한 통과\n\n5. `edge apply` → 터널, ingress 설정, DNS 3, Secret, cloudflared × 2 생성\n   - 커넥터 로그: `Registered tunnel connection` ×4 (icn01/05/06 — 서울 엣지)\n6. `envs/dev` HTTPRoute hostnames 에 `dev.claudharmony.io` 추가\n7. 검증: `https://claudharmony.io`·`www` → prd `20261024-05aa8f3`, `dev.` → dev, 인증서 Let's Encrypt (Cloudflare 자동), 외부(BG/IN) 200\n8. **임시 quick tunnel 제거** (`enable_tunnel = false`) — dev 는 main 머지로 자동, prd 는 수동 apply\n9. `infra.sh url/check` → 도메인 기준으로\n\n**배운 점**\n- Cloudflare 권한 이름은 자주 바뀐다 → API 오류 문서 링크(`documentation_url`)와 실제 호출로 판별\n- 인증 vs 입력 오류를 빈 body POST 로 구분\n- 터널 하나에 모든 호스트 → Gateway 로, 환경 구분은 HTTPRoute 에서: 라우팅 규칙이 한 곳(K8s)에 모임\n\n### 24. k9s 에서 클러스터가 안 보이던 문제\n\n**원인**: `~/.zshrc` 의 `KUBECONFIG` 가 lima k3s 파일 하나만 가리킴 (컨텍스트 0개). 우리 클러스터는 전용 `~/.claudharmony/kubeconfig`\n**해결**: `KUBECONFIG` 를 3개 파일 합치기 + `k9ch`/`kch` alias (백업 `~/.zshrc.bak-20261024`) → `kubectl config get-contexts` 에 `kind-claudharmony`, `kind-ch4` 표시\n\n### 25. 기술 블로그 글 추가 — 도메인 연결\n\n- 블로그 글 저장 위치: `claudharmony-api` 의 `src/main/resources/posts/*.md` (파일명 = slug, YAML front matter: title/summary/date/tags)\n- 글 `custom-domain-cloudflare-tunnel.md` 작성 — 순서, 최소 권한 토큰 표, Terraform 스니펫, 막혔던 곳(권한 이름·빈 body 판별·0/72·영역 범위)\n- **민감 정보 제외**: 토큰·Account ID·Tunnel ID·이메일·공인 IP 없음 (정규식 검사)\n- 다른 세션 저장소라 **새 파일 하나만** API 로 develop 에 추가(`46aeb0b`) → Deploy dev 성공 → https://dev.claudharmony.io/blog/custom-domain-cloudflare-tunnel 200\n- prd 반영은 api release 브랜치로 (사용자 확인 후)\n\n### 26. k9s 기본 설정에도 클러스터 등록\n\n- 사용자: k9s 에 여전히 안 보임 → 새 zsh 에선 정상(`kind-claudharmony`), **수정 전에 열린 터미널**이 원인\n- 셸 환경과 무관하게 보이도록 `~/.kube/config` 에 `kind-claudharmony` 병합 + 기본 컨텍스트 지정 (백업 `~/.kube/config.bak-20261024`)\n- 주의: 클러스터 재생성 시 다시 병합 필요 (03 운영 가이드)\n\n### 27. k9s \"아무것도 안 보임\" 해결 + metrics-server\n\n**증상**: k9s 컨텍스트 0개 → (설정 재로드 후) 연결은 됐는데 화면이 빈 것처럼 보임\n**원인 (k9s 로그 `~/Library/Application Support/k9s/k9s.log`)**\n1. 17:18 `invalid context specified: \"\"` — 예전 터미널 환경\n2. 17:19~ `No resources found for v1/pods in \"default\"` — **연결은 됐고 비어 있는 `default` 네임스페이스를 보고 있었음**\n**해결**\n- k9s 컨텍스트 설정(`clusters/kind-claudharmony/kind-claudharmony/config.yaml`): 기본 네임스페이스 `all`, 즐겨찾기 `all, prd, dev, edge, envoy-gateway-system` (숫자키 0~4)\n- `platform/addons` 스택 신설 → **metrics-server** (Helm 3.14.0, kind 용 `--kubelet-insecure-tls`) → `kubectl top nodes` / k9s CPU·MEM 표시\n- `infra.sh addons`, Infra apply 수동 옵션에 `addons` 추가\n\n**배운 점**: k9s 가 \"안 보이면\" 먼저 로그 — 연결 실패와 빈 네임스페이스를 구분\n\n### 28. DB 선택 — PostgreSQL\n\n- 사용자 방향: **도메인은 앱에, DB 는 단순 저장·조회**. 향후 위치 기반·Redis·트렌드 크롤링·블로그 수집 알림·AI(전용 벡터 DB)·**대량 데이터**\n- 결론: 서비스 DB = **PostgreSQL + PostGIS**, 벡터 = **Qdrant(전용)**, 대량 트렌드 = **ClickHouse**, 원본 = 오브젝트 스토리지, 캐시 = Redis, 버퍼 = Redpanda → [데이터베이스 로드맵](09-database.md)\n- PG 를 고른 이유: K8s Operator(CloudNativePG) 성숙도 → 백업/복구 선언형, PostGIS, JSONB/부분 인덱스/전문검색(조회 도구), 이식성(RDS/Cloud SQL), 라이선스\n\n### 29. PostgreSQL 구축 (dev, prd)\n\n1. 버전 조사: CNPG **1.30.1**(chart 0.29.1, 2026-09-23), 이미지 `postgis:18.6-3.6.4-standard-trixie` (ghcr 태그 목록 페이지네이션으로 PG18 확인)\n2. `platform/database`: CNPG Operator (Helm) → CRD 11개 (`clusters`, `databaseroles`, `scheduledbackups` …)\n3. `kubectl explain cluster.spec.managed.roles / bootstrap.initdb` 로 1.30 스펙 확인 후 `modules/k8s/postgres` 작성\n   - initdb: DB `claudharmony`, owner `app`, `CREATE EXTENSION postgis`\n   - managed role `readonly` (`pg_read_all_data`, 연결 5) + Terraform 랜덤 비밀번호 Secret\n   - 첫 초안의 `GRANT ... TO readonly` 를 initdb SQL 에서 제거 — **initdb 시점엔 managed role 이 아직 없어 실패할 수 있음** → `inRoles` 로 대체\n   - `kubectl_manifest` `wait_for status.phase = \"Cluster in healthy state\"`\n4. `modules/k8s/app`: `secret_env` (Secret → 환경변수) 추가 / `modules/k8s/env`: `database` 변수, 카탈로그 `\"database\": true` → `SPRING_DATASOURCE_*` 주입\n5. 적용 전 확인: api `build.gradle` 에 JDBC/JPA 없음 → 환경변수 주입해도 무시됨(안전)\n6. dev apply → `Cluster in healthy state` (48초), 검증\n   - `PostgreSQL 18.6`, `postgis 3.6.4`, `shared_buffers 96MB`, `Asia/Seoul`\n   - `readonly`: `postgis_version()` 조회 OK, `CREATE TABLE` → `permission denied` ✓\n   - api Pod 에 `SPRING_DATASOURCE_URL/USERNAME/PASSWORD` 주입, 정상 Running\n7. prd apply → healthy, 사이트 정상\n8. `scripts/db.sh`: port-forward + 접속 정보 출력 + **비밀번호 클립보드 복사** (화면 미출력). 로컬에 psql 이 없어 `postgres:18-alpine` 일회용 컨테이너로 검증 ✓\n\n**남은 것**: 백업(Barman Cloud → R2), api 에 JPA/Flyway (다른 세션), Docker 메모리 증설\n\n### 30. 관리자 콘솔 1단계 (조회) — claudharmony-console\n\n목표: \"AWS/GCP 처럼 관리자 페이지에서 시작·종료·확인\" → **조회부터**, 별도 저장소\n1. 설계: 조회 = K8s API 읽기 / 변경(2단계) = 카탈로그 Git 커밋 → Terraform (단일 진실 원천 유지)\n2. 인프라: `envs/console` (환경 모듈 재사용) + ServiceAccount + **ClusterRole 읽기 전용(Secret 제외)**, app 모듈 `service_account`\n3. 앱: Spring Boot 4.1.2 / Java 25 (api 와 동일), fabric8 7.9.0 (8.0.0 은 1개월 된 메이저 → 7.x 최신), Thymeleaf + htmx 2.0.11\n   - 화면: 대시보드(노드·구성요소·외부 접속·환경 카드·배포 이력), 환경 상세(Pod·DB·라우트·경고), 로그\n   - 배포 이력: infra(public) 커밋 메시지 `deploy(env): svc=img:tag` 파싱\n   - `/env/nope` → 404 (설정된 환경만 조회)\n4. 로컬 실행(`KUBECONFIG`)으로 전 페이지 200 확인 → 이미지 빌드 → `deploy.sh console console …` → `http://console.localhost` 정상, RBAC 오류 없음\n5. 저장소 `claudharmony-console` (private, main) 생성·push\n\n**문제 1 — 공개 주소가 보호 없이 열림 (1분여)**\n- edge 에 `console.claudharmony.io` + Access 를 한 번에 apply → DNS·터널 설정은 성공, **Access 는 `auth.forbidden`** (토큰에 Access 쓰기 없음)\n- 그 순간 콘솔 호스트가 prd catch-all 로 공개 홈페이지를 보여줌 → **즉시 hostname 제거 apply** (530 확인)\n- 재발 방지: Access 성공 후 DNS 생성되도록 `depends_on`, 토큰 권한 추가 후 재적용\n- **배운 점**: 보호 장치가 필요한 공개는 \"보호 먼저, 노출 나중\" 순서를 코드로 강제\n\n**문제 2 — Google Java Style 적용 (사용자 요청)**\n- Spotless 8.9.0 + google-java-format 1.37.0 → 모든 파일 `InvocationTargetException`\n- `--add-exports` jvmargs 추가해도 동일, gjf jar 직접 실행은 정상 → **Spotless 보다 나중에 나온 gjf 1.37 과의 비호환**\n- gjf **1.36.1** 로 내려서 해결 (`gradle.properties` 의 add-exports 는 유지)\n- CI: PR 에 `spotlessCheck build`, 배포 워크플로도 `spotlessCheck` 선행\n\n**남은 것**: 토큰 Access 권한 → Access + 공개 주소 / console 저장소 러너 등록 / 2단계(제어)\n\n### 31. 콘솔 자동 새로고침 → 수동 버튼\n\n- 사용자: \"10초마다 자동 새로고침은 나중에\" → htmx `every 10s/60s/5s` 제거, `refresh from:body` 이벤트 + 상단 **새로고침** 버튼(마지막 갱신 시각 표시)\n- 배포 `console-7967449` (러너 미등록이라 `deploy.sh` 수동 실행)\n\n### 32. api 가 PostgreSQL 사용 시작 (api 세션 알림)\n\n- api 세션(ai-root-78): 기존 CNPG(`pg-rw`, `database=true` 주입) 그대로 사용, 추가 인프라 요청 취소\n- 확인: dev `flyway_schema_history` → `1 trend success`, `trend_snapshot` 1행 / `trend_keyword` 10행, https://dev.claudharmony.io/trends 200 (web `dev-4aa262a`)\n- 계약 표(06)·DB 문서(09)에 \"api 는 database=true, 스키마는 Flyway\" 반영\n- 참고: 트렌드 데이터가 커지면 [로드맵](09-database.md)대로 ClickHouse 로 분리\n\n### 33. 스키마 관리 Flyway → Atlas (선언형)\n\n배경: 사용자 \"개발은 자동, 운영은 앱이 스키마 바꾸면 위험\" → 대안 비교(Liquibase/Atlas/Bytebase/pgroll) → **Atlas** 선택 (Terraform 과 같은 plan/apply 감각)\n- 확인 중 발견: api 세션이 이미 prd 에 트렌드 기능 배포 → **Flyway 가 prd 기동 시 자동으로 테이블 생성** (09:18). 안전한 변경이었지만 우려한 경로가 실제로 쓰임\n1. Atlas `1.3.3-community` (1.3.4/1.3.5 는 2주 미만), `schema inspect` 로 dev 현재 구조 → `db/schema.sql`\n2. **문제**: 공식 `postgis/postgis:18-3.6` 은 arm64 이미지 없음 → `imresamu/postgis:18-3.6.1-trixie` (PostGIS 도커 관리자 멀티아치 빌드) 로 차이 계산용 DB\n3. `scripts/db-schema.sh <env> plan|apply|check` — prd: 위험 변경 차단, `CONFIRM=\"apply prd\"`, pg_dump 백업. 제외: `spatial_ref_sys`, `flyway_schema_history`\n4. 테스트(dev plan): 현재 그대로 → `Schema is synced` / 컬럼 추가 → `ADD COLUMN` / 컬럼 삭제 → ⚠️ 위험 감지 / `check` 대기 변경 시 exit 3. prd 는 **계획만**(읽기) — prd apply 거부 테스트는 Claude Code 권한 검사가 \"운영 배포\" 로 차단 (올바른 차단)\n5. api 저장소 (다른 세션 로컬은 안 건드리고 GitHub 에 **커밋 1개** `d89b26a`): `db/schema.sql`, `deploy-dev`(스키마 자동 적용 → 앱), `deploy-prd`(check), `db-schema-prd`(수동·확인문구·백업)\n6. dev 배포에서 새 단계 실행 확인: `DB schema (dev 자동 적용): success` → `Schema is synced`\n\n남은 것: api 코드에서 Flyway 제거 + `ddl-auto=validate` (api 세션) → 이후 `flyway_schema_history` 정리\n\n### 34. Flyway 제거 (api 세션) + dev 정리\n\n- api 세션: Flyway 의존성·`V1__trend.sql` 삭제, JPA 가 아니라 `JdbcClient` 라 `ddl-auto` 대신 **기동 시 information_schema 검증**(없으면 기동 실패), Testcontainers 도 `db/schema.sql` 사용, 테스트 35개 통과 → dev `dev-93204f6`\n- 인프라: dev `flyway_schema_history` DROP → 남은 테이블 `trend_snapshot, trend_keyword, spatial_ref_sys`, Atlas `check` = 변경 없음\n- prd 는 아직 Flyway 포함 버전(`20261024-63e8dca`) → release → DB schema prd → Deploy prd 이후 prd 이력 테이블 정리 예정\n\n### 35. 구성도·가이드 문서 정리 (학습 기준)\n\n- `01-architecture` 전면 개편: 실제 클러스터 조사(ns·deploy·svc·route·pg·pvc·helm·state·저장소) 기반 — 시스템 컨텍스트, 물리/노드, Namespace 논리도, 요청 시퀀스, 배포 흐름, Terraform 스택 의존, 데이터, 보안 경계, 버전, 설계 결정\n- `11-learning-guide` 신규: 10단계 커리큘럼(개념 → 우리 구성 → 확인 명령 → 실습 → 체크리스트) + 장애 사례 복기 표 + 다음 과제\n- 실습은 dev·읽기 전용만 (prd 변경 명령 없음)\n\n### 36. 정리 (사용자 요청 \"불필요한 거 정리\")\n\n| 대상 | 처리 | 되돌리기 |\n|------|------|----------|\n| Docker 이미지 `claudharmony/*` 31개 | **21개 삭제** — hello/hello-app 전부, 오래된 dev/prd 태그, console-initial. 남김: 배포 중 5개 + prd 롤백용 이전 버전(api `63e8dca`, web `05aa8f3`) + `:local`(api 세션 로컬용) | 다시 빌드 |\n| kind 노드 안 미사용 이미지 | `crictl rmi --prune` (worker 38→34) | 롤백 시 deploy.sh 가 kind load |\n| 빌드 캐시 | 24시간 지난 것만 prune (다른 프로젝트 캐시 보호) | — |\n| 구 `claudharmony-homepage` | 러너 서비스 중지·등록 해제·디렉토리 삭제, 저장소 **archive**, 로컬 클론 삭제(변경·미push 없음 확인) | GitHub 에서 unarchive |\n| `modules/docker/` (K8s 이전 Docker 모듈) | 삭제 | Git 이력 |\n| `setup-runner.sh` 기본 대상 | homepage → web, api, console | — |\n| prd `flyway_schema_history` | ✅ 사용자 직접 DROP (#39) — Claude Code 권한 검사가 운영 DB 쓰기를 차단해서 | pg_dump 백업 |\n\n**문제**: 이미지 일괄 삭제가 조용히 실패 — `docker rmi $RM` 에서 **zsh 는 따옴표 없는 변수를 단어로 쪼개지 않음** → 줄바꿈 포함 한 덩어리로 전달. `while read` 로 하나씩 처리해서 해결\n**남겨 둔 것**: 다른 프로젝트 이미지·볼륨(airflow, qdrant, kind ch4), Atlas 임시 DB 컨테이너(재사용), Terraform state `.backup`\n\n### 37. 로컬에서 PostgreSQL 확인 환경\n\n1. `brew install libpq` → psql 18.6 (`~/.zshrc` PATH 추가). 이 Mac 의 DB 도구는 IntelliJ 뿐\n2. `scripts/db.sh` 개편: `up/down/status/info/psql/pgpass` — 비밀번호는 기본 가림, `~/.pgpass` 는 **prd 쓰기 계정 제외**\n3. **문제**: 백그라운드 `kubectl port-forward` + 재연결 루프 → 첫 접속 뒤 계속 `Connection refused`\n   - 처음엔 상태 확인용 `nc -z` 탓으로 보고 `lsof` 로 바꿨으나 동일\n   - 포그라운드 실행으로 원인 확인: `error forwarding port 5432 ... read: connection reset by peer` → `error: lost connection to pod` — **클라이언트가 끊을 때 DB 쪽 리셋에 port-forward 프로세스가 종료** (kubectl 의 알려진 한계)\n   - **해결**: port-forward 를 버리고 `modules/k8s/postgres` 에 NodePort `pg-local`(dev 31432 / prd 32432) + Mac 의 **socat 프록시 컨테이너**(127.0.0.1 전용, unless-stopped) → 12회 연속 접속 성공, 재시작 0\n4. 적용 중 주의: 로컬 infra 가 원격보다 뒤처진 상태의 plan 이 **api·web 을 옛 이미지로 되돌리려 함** → 적용 전 발견, `git pull` 후 재plan = Service 1개 추가만. **apply 전에 항상 최신 pull**\n5. readonly 로 INSERT → `permission denied` 확인, IntelliJ 연결 방법·prd 읽기전용 설정 문서화\n\n### 38. DataGrip 으로 DB 연결\n\n- 사용자 보유 도구: JetBrains **DataGrip** → `127.0.0.1:15432`(dev) / `25432`(prd), `readonly` 로 연결 성공\n- 권장: prd 데이터 소스 Read-only + 빨간색 표시\n\n### 39. prd Flyway 이력 테이블 삭제 → Atlas 제외 목록 정리\n\n- 사용자가 직접 실행: `kubectl -n prd exec pg-1 -c postgres -- psql -U postgres -d claudharmony -c \"DROP TABLE IF EXISTS flyway_schema_history;\"` → `DROP TABLE`\n- dev 는 #37 에서 이미 삭제 → 이제 dev·prd 모두 public 테이블 = `trend_snapshot, trend_keyword, spatial_ref_sys`\n- `scripts/db-schema.sh` 제외 목록: `spatial_ref_sys, flyway_schema_history, flyway_schema_history.*` → **`spatial_ref_sys` 만**\n- 확인: `db-schema.sh dev check` / `prd check` → 둘 다 `Schema is synced` ✅\n\n**배운 점**: 운영 DB 에 쓰는 일회성 명령은 사람이 `!` 로 직접 실행 — 자동화 도구가 운영 데이터를 바꾸지 않게 하는 안전장치가 제대로 동작한 것\n\n### 40. 인증 서버 Keycloak 추가\n\n사용자 요청: \"키클락 추가 — 다양한 로그인 인증 서비스 관리, 내 시스템과 연동\" + 블로그(스크린샷). 앱 연동은 앱 세션 담당 → 인프라만.\n\n1. 버전: Keycloak `26.7.5`(2026-09-30, 2주 이상 지난 최신), Terraform provider `keycloak/keycloak ~> 5.10.0`\n2. `platform/identity` — Namespace `identity`, 전용 CNPG `pg`(DB `keycloak`, 2Gi, 256Mi), bootstrap **client**(사람 계정 대신 client_credentials), Deployment(`start`, Recreate, 관리 포트 9000 probe), Service, HTTPRoute 2개\n   - 공개 `auth.claudharmony.io`: `/realms/claudharmony`, `/realms/claudharmony-dev`, `/resources`만 → 나머지는 https://claudharmony.io/ 로 302\n   - 관리 `auth.localhost`: 전체 (터널이 받지 않는 호스트 = 사무실 Mac 전용)\n3. `platform/realms` — realm `claudharmony`(prd)/`claudharmony-dev`(dev), 역할 `user`(기본)/`admin`, client `web`(confidential+PKCE, redirect URI 제한, aud=api 매퍼)/`api`(bearer-only)/`console`(prd), master 관리자 `claudharmony-admin`, dev `tester`, 앱 Namespace에 Secret `keycloak-web|api|console|tester` — 27개 리소스\n4. 소셜 로그인 `social.tf` (Google·GitHub·카카오) — `~/.claudharmony/identity.env` 값이 있을 때만 생성. 가짜 값으로 **plan만** 검증(6개 생성 예정 확인)\n5. `infra.sh`: 스택 `identity`, `realms` 추가, realms는 실행 중에만 port-forward(18080) + bootstrap 비밀 주입. CI 수동 실행 목록에도 추가\n6. `platform/edge` hostnames에 `auth.claudharmony.io` 추가 — plan: DNS 1 추가, 터널 설정 1 변경. **apply는 자동 권한 검사가 거부(공개 DNS 변경)** → 사용자 실행 대기\n7. 확인 (Gateway에 Host 헤더로): 공개 realm 200, `/admin`·`/realms/master`·`/` 302 → https://claudharmony.io/, issuer `https://auth.claudharmony.io/realms/claudharmony`\n8. 관리 콘솔 스크린샷 9장 (Playwright + 로컬 Chrome for Testing) → `docs/images/keycloak/`, 문서 [12. 인증 서버](12-identity.md), Obsidian 동기화에 이미지 복사 추가\n9. 메모리 사용: Keycloak 약 560Mi, DB 73Mi\n\n**문제 1**: Keycloak 재시작 2회 — `Connection to pg-rw.identity.svc:5432 refused`\n**원인**: DB 출력값(jdbc_url)은 계산만으로 알 수 있어 Terraform이 Deployment를 DB와 동시에 만듦\n**해결**: `depends_on = [module.db]`\n\n**문제 2**: 관리 콘솔 빈 화면 — `https://auth.claudharmony.io/realms/master/.../3p-cookies` 요청 실패\n**원인**: `KC_HOSTNAME_ADMIN`은 콘솔 화면 주소만 바꿈. master realm 로그인은 여전히 공개 주소로 가는데, 그 경로는 일부러 막아 둠\n**해결**: master realm **Frontend URL**만 `http://auth.localhost`로 (`terraform_data` + REST PUT, master realm 전체를 Terraform으로 가져오면 기본값으로 덮어쓸 위험)\n\n**문제 3**: 공개 주소 리다이렉트가 `http://claudharmony.io/` → `RequestRedirect`에 `scheme = \"https\"` 명시 (터널 안쪽 요청은 http)\n\n**문제 4**: `*.localhost`는 브라우저만 127.0.0.1로 풀어 줌(macOS 시스템 DNS·Terraform은 못 풂) → realms 스택은 port-forward\n\n**배운 점**: 인증 서버는 \"공개할 경로\"를 먼저 정한다. 토큰 issuer는 하나(공개 주소)로 고정하고, 서버끼리 통신만 클러스터 안 주소로.\n\n---\n### 41. 장애: Docker VM 메모리 고갈 → prd·dev 502/530 (약 15분)\n\n- 증상: edge apply 직후 공개 로그인 화면 확인 중 `auth`·prd·dev 모두 502/530, `kubectl` TLS handshake timeout, Docker VM CPU 900%\n- 노드 안에서 확인: 메모리 7.8GB 중 남은 것 93MB, **swap 1GB 전부 사용**, load average 550, `/proc/pressure/memory` full 52~59% → 거의 모든 Pod가 두 번 연속 재시작\n- 원인: Docker Desktop VM(7.65GB) 하나에 여러 프로젝트가 함께 떠 있음\n  - claudharmony kind 클러스터 (+ 이번에 추가한 Keycloak ~600Mi, DB ~70Mi)\n  - 다른 kind 클러스터 `ch4` (노드 3개, ~1.2GB)\n  - Airflow·Qdrant `digest_*` 컨테이너 (~1.5GB)\n  - 장애 직전에 뜬 로컬 컨테이너 `dev-keycloak-1` (~600Mi, 이후 사라짐)\n- 조치: 클러스터 안 Keycloak `replicas=0` (`kubectl scale`, Terraform 상태와 다름) → 메모리 압박 0, prd·dev 200 복구. `auth.claudharmony.io`는 503\n- 다음: Docker Desktop 메모리 **16GB 이상**으로 증설 (Mac 본체 48GB) → `scripts/infra.sh identity apply`로 Keycloak 1대 복구 → 공개 로그인 화면 스크린샷\n\n**배운 점**: kind는 노드가 전부 한 Docker VM 안에 있음 → VM 메모리가 클러스터 전체의 한도. 새 구성요소를 올리기 전에 `docker stats`로 **VM 전체**(다른 프로젝트 포함) 여유를 볼 것. swap이 가득 차면 OOM으로 죽지 않고 전체가 느려지면서 연쇄 재시작한다.\n\n---\n### 42. Keycloak 커스텀 이미지 배포 경로 + 테마 변수 (앱 세션 요청)\n\n- 앱 세션(ai-root-78) 요청: claudharmony-keycloak 이미지(테마 `claudharmony`)로 교체할 수 있는 경로, `login_theme`, kind load\n- `scripts/deploy.sh`: `identity` 스택 지원 → `platform/identity/images.auto.tfvars.json` 기록, Namespace `identity`\n- `platform/identity`: `var.images` (`images.keycloak`이 있으면 우선, 없으면 공식 이미지)\n- `platform/realms`: realm별 `login_theme` (optional, 기본 null) — 이미지 배포 후 dev → prd 순서로 켬\n- 확인: identity plan = 손으로 줄인 replicas 0→1 외에 변경 없음. realms plan은 Keycloak이 꺼져 있어 접속 오류(예상)\n- 앱 세션 보고: 로컬 Keycloak(테마 미리보기)을 중지했고, 장애 뒤 xDS를 못 받아 1/2로 남은 Envoy 프록시 Pod를 delete해 복구함 (#41 보충)\n\n---\n### 43. Docker 메모리 증설 → Keycloak 복구 → 공개 로그인 확인\n\n- 사용자: \"니가 해줘\" → Docker Desktop `settings-store.json`에 `MemoryMiB: 20480`, `SwapMiB: 2048` (백업 `settings-store.json.bak-20261024`)\n  - `osascript quit`은 VM만 내려가고 backend가 멈춘 상태로 남음(docker 명령 무응답) → 걸린 docker 클라이언트 종료 후 `docker desktop restart` → **19.5GB** 확인\n  - 재시작 후 꺼져 있던 것: `ch-pg`(재시작 정책 없음 → `docker start`로 원상복구), `claudharmony-atlas-dev`(필요할 때 스크립트가 다시 만듦)\n  - prd·dev 200 (약 1분), 모든 Pod Ready\n- `scripts/infra.sh identity apply` → Keycloak replicas 0 → 1, `realms plan` = 변경 없음\n- 공개 로그인 확인 중 두 가지 수정:\n  1. `/token` 403 `Invalid origin` — Envoy가 `X-Forwarded-Proto`를 http로 덮어씀 → 공개 HTTPRoute에서 `https`로 고정\n  2. 계정 화면 401 — default_roles에서 `account/view-profile`, `account/manage-account`가 빠져 있었음 → 다시 포함\n- 스크린샷 `11-login-page`, `12-account` 추가 (문서 4-4, 블로그)\n\n**배운 점**: 프록시가 여러 겹(Cloudflare → cloudflared → Envoy)이면 \"원래 https였다\"는 정보가 중간에 사라질 수 있다. 앱이 http/https를 판단하는 곳(Keycloak, SvelteKit ORIGIN, Spring `forward-headers-strategy`)은 하나씩 확인할 것. Terraform의 \"목록 전체를 지정하는\" 리소스(default_roles)는 기본값을 덮어쓴다.\n\n---\n### 44. 배포 실패 수정(db-schema 임시 DB) + 네이버 로그인\n\n- api Deploy dev 실패: `db-schema.sh`가 Docker 재시작으로 꺼진 Atlas 임시 DB를 다시 만들 때 `duplicate key ... extname=postgis`\n  - 원인: 초기화 중 소켓 전용 임시 서버에 `pg_isready`가 먼저 성공 → 이미지의 postgis 생성 스크립트와 `CREATE EXTENSION`이 겹침\n  - 해결: `pg_isready -h 127.0.0.1`(TCP = 초기화 끝난 진짜 서버)로 대기. 컨테이너를 지우고 dev check로 재현 확인 → 실패한 배포 재실행\n- 앱 세션 제공 설정으로 네이버 로그인 추가: Keycloak 기본 OAuth 2.0 공급자(`provider_id = oauth2`), `response.*` claim, alias `naver`\n- GitHub는 provider 전용 리소스 `keycloak_oidc_github_identity_provider`로 교체\n- 가짜 키로 plan만: 4종 × 2 realm = 8개 생성 예정. 실제 키가 없으면 변경 없음\n- 앱 세션: 블로그 img CSS dev 배포(web #15), claudharmony-keycloak 테마(카드형·네이버 버튼) develop 머지\n\n---\n### 45. claudharmony-keycloak 러너 등록\n\n- 사용자 실행: `scripts/setup-runner.sh claudharmony-keycloak` → `office-mac-claudharmony-keycloak` **online** (라벨 `claudharmony-office`). 등록 직후 출력은 offline이었지만 수 초 뒤 online\n- `setup-runner.sh` 기본 대상에 keycloak 추가\n- 다음: 앱 세션이 main 배포 workflow(`deploy.sh identity keycloak`)로 첫 테마 이미지 배포 → dev realm `login_theme = \"claudharmony\"`\n\n---\n### 46. Keycloak 테마 이미지 첫 배포 + dev realm 테마 적용\n\n- 앱 세션이 claudharmony-keycloak Actions \"Deploy\"(release/20261024)로 배포 → `deploy.sh identity keycloak claudharmony/keycloak:20261024-39bdf59` 성공. 배포 기록 `platform/identity/images.auto.tfvars.json`, Pod 안 `/opt/keycloak/themes/claudharmony`\n- `platform/realms`: dev realm `login_theme = \"claudharmony\"` → apply. tester 로그인부터 계정 화면까지 정상\n- 화면 확인: 휴대폰 폭(400px)은 정상. **데스크톱 폭에서 카드가 왼쪽에 붙음**(x≈20px, 아래 링크만 가운데) → 앱 세션에 수정 요청. prd realm은 수정 후 켬\n\n---\n### 47. 테마 prd 적용 + web·api에 Keycloak 환경변수 연결\n\n- 앱 세션이 카드 정렬 수정 이미지 `claudharmony/keycloak:20261024-b007757` 배포. 확인 결과 1440px에서 카드 x=492(가운데), 모바일 정상\n  - 앱 세션 참고: Cloudflare가 `/resources/...`를 30일 캐시해서 옛 CSS가 남아 있었음 → 테마가 CSS 주소에 `?v=<이미지버전>`을 붙이도록 수정\n- prd realm `login_theme = \"claudharmony\"` → apply\n- 서비스 카탈로그에 `secret_env` 추가 (`modules/k8s/env`: DB Secret env와 merge)\n  - api ← `keycloak-api`: `KEYCLOAK_ISSUER_URI`, `KEYCLOAK_JWK_SET_URI`, `KEYCLOAK_AUDIENCE`\n  - web ← `keycloak-web`: `KEYCLOAK_ISSUER_URI`, `KEYCLOAK_INTERNAL_URI`, `KEYCLOAK_CLIENT_ID`, `KEYCLOAK_CLIENT_SECRET`\n  - plan: dev·prd 각각 Deployment 2개 변경만. 이미지 그대로, 빠지는 env 없음 (diff가 크게 보이는 건 env 목록이 이름순으로 다시 정렬되기 때문)\n- dev apply → rollout 정상, Pod 안 env 확인, dev 200\n- **prd apply는 자동 권한 검사가 운영 배포로 분류해 거부** → 사용자 실행 대기 (다음 prd 앱 배포 때도 함께 반영됨)\n\n---\n### 48. 홈페이지 로그인 → 관리자 콘솔 (console.claudharmony.io)\n\n사용자: \"홈페이지에 로그인했을 때 어드민 페이지 접속되게\" → 대상은 `console.claudharmony.io`.\n\n1. **공개 도메인 HTTPRoute 분리** (`modules/k8s/app`): `*.localhost`(http)는 기존 route, 공개 도메인은 `<name>-public` route에서 `X-Forwarded-Proto: https` 고정. 호스트 지정이 없는 prd catch-all은 그대로\n   - 이유: Envoy가 XFP를 http로 덮어써서 Spring `{baseUrl}`(OAuth2 redirect_uri)이 http가 됨 → Keycloak redirect URI 불일치\n   - 적용: dev(web-public), console(console-public). dev·localhost·prd 모두 200 확인\n   - 교훈 재확인: 적용 전 `git pull` — 앱 세션 배포 기록이 그새 3건 쌓여 있었음\n2. **Keycloak** (`platform/realms`): console client에 realm 역할 매퍼(claim `roles`, ID 토큰), prd realm 관리자 `admin`(admin 역할, 임시 비밀번호, Secret `identity/keycloak-service-admin`)\n3. **콘솔 앱** (`claudharmony-console` d67c748): Keycloak 로그인, admin만, 설정이 없으면 전부 거부. 상단에 사용자·로그아웃\n4. **배포**: `deploy.sh console console claudharmony/console:console-d67c748` (콘솔 저장소 러너가 없어 수동. main push 워크플로는 pending)\n5. **확인**: 비로그인 → Keycloak으로 이동, 관리자 로그인 → 비밀번호 변경 화면까지 정상\n   - admin 역할로 콘솔 화면까지 들어가는 확인은, 임시 확인 계정에 운영 realm 권한을 주는 작업이 자동 권한 검사에서 거부됨 → 사용자가 직접 첫 로그인으로 확인\n6. **DNS**: `platform/edge` hostnames에 `console.claudharmony.io` 추가 (plan: DNS 1, 터널 설정 1). 적용은 사용자 확인 후 사용자가 실행\n\n---\n### 49. console.claudharmony.io 공개 + dev web 이미지 되돌림 사고와 재발 방지\n\n- 사용자가 `edge apply` 실행 → `console.claudharmony.io` DNS·터널 추가\n  - 확인: 비로그인 `/`, `/env/prd` → Keycloak 로그인으로 302, redirect_uri `https://console.claudharmony.io/login/oauth2/code/keycloak`\n  - 로컬 DNS가 새 레코드를 바로 못 받아 처음엔 000 → Cloudflare IP로 `--resolve` 해서 확인\n- 공개 route의 `/actuator` 리다이렉트가 `http://`로 나가던 것 → 공개 route만 `scheme = \"https\"`\n- **사고**: 위 수정을 dev에 apply하는 사이 앱 세션이 web `dev-197c9bc`를 배포 → 내 로컬 배포 기록(`dev-9f36e2e`)이 뒤처진 채 apply되어 **dev web이 이전 이미지로 되돌아감** (약 2분). pull 후 재적용으로 복구\n- **재발 방지** (`scripts/infra.sh`): `images.auto.tfvars.json`이 있는 스택(dev/prd/console/identity)의 apply는\n  1. `deploy.sh`와 같은 잠금(`~/.claudharmony/deploy.lock`)을 잡고\n  2. `git fetch` 후 배포 기록이 `origin/main`과 다르면 **거부** (\"git pull --rebase 후 다시\")\n  - `deploy.sh`는 이미 잠금을 잡고 기록을 갱신한 뒤 부르므로 `CLAUDHARMONY_DEPLOY_LOCKED=1`로 건너뜀\n  - 시험: 정상 → 적용·잠금 해제, 3커밋 뒤처진 복제본 → 거부\n- **사용자 확인**: prd realm `admin`으로 첫 로그인 → 비밀번호 변경 → 콘솔 대시보드 진입 ✅ (admin 역할 경로 끝까지 확인)\n- 앱 세션: 홈페이지 '관리자' 링크(web #18, admin 역할일 때만, prd → console.claudharmony.io), dev에서 tester 로그인 → /me → 로그아웃 확인. prd는 사용자 승인 후 release\n\n**배운 점**: \"apply 전에 pull\"은 사람이 기억하는 규칙이 아니라 스크립트가 강제해야 한다. 같은 state를 여러 곳(러너·세션)이 바꾸면 잠금과 기록 확인이 함께 필요하다.\n\n---\n### 50. prd 배포 — 홈페이지 로그인 + 관리자 링크 운영 반영\n\n- 앱 세션이 release/20261025로 운영 배포 (사용자 승인): api `20261025-e0d27f1`(DB schema prd → Deploy prd), web `20261025-197c9bc`\n- 배포가 prd 전체를 apply하면서 #47에서 보류했던 prd Keycloak 환경변수도 함께 반영 → Pod 안 api 3개, web 4개 확인\n- 확인: https://claudharmony.io 200, `/auth/login` → `auth.claudharmony.io/realms/claudharmony` (redirect_uri `https://claudharmony.io/auth/callback`)\n- 흐름: 홈페이지 로그인(admin 계정) → 헤더 '관리자' → https://console.claudharmony.io (Keycloak 세션으로 SSO)\n\n---\n\n## 템플릿 (다음 작업용)\n\n```markdown\n### N. 작업 제목\n\n- 무엇을 했나\n- 결과 (명령/출력 요약)\n\n**문제**: 증상\n**원인**: 왜\n**해결**: 어떻게\n**배운 점**: 다음에 기억할 것\n```\n"}, {"id": "08-domain", "md": "# 08. 도메인 연결 — claudharmony.io + Cloudflare Tunnel\n\n> 민감 정보(API 토큰, Account ID, Tunnel ID/토큰)는 이 문서에 적지 않는다.\n> 토큰은 저장소 밖 `~/.claudharmony/cloudflare.env` (chmod 600) 에만 있다.\n\n## 결과\n\n| 주소 | 환경 | 비고 |\n|------|------|------|\n| https://claudharmony.io | prd | |\n| https://www.claudharmony.io | prd | |\n| https://dev.claudharmony.io | dev | |\n| http://localhost/ , http://dev.localhost/ | prd / dev | 사무실 Mac 에서 |\n\n- **주소 고정** — 재시작/재배포해도 안 바뀐다 (임시 `*.trycloudflare.com` 은 제거)\n- **HTTPS 자동** — Cloudflare 엣지에서 종단 (인증서 자동 발급·갱신)\n- **포트포워딩 불필요** — 이중 NAT 그대로. 클러스터 안 cloudflared 가 **바깥으로** 연결\n- **이중화** — cloudflared 커넥터 2개, 각 2개 연결 → 서울 엣지(ICN) 총 4개 연결\n\n## 구조\n\n```mermaid\nflowchart LR\n    U[사용자] -->|HTTPS<br/>claudharmony.io| CF[Cloudflare 엣지<br/>DNS · TLS]\n    CF ===|Tunnel<br/>아웃바운드 연결 4개| C1\n    CF === C2\n    subgraph K8S[kind 클러스터]\n      subgraph EDGE[ns: edge]\n        C1[cloudflared #1]\n        C2[cloudflared #2]\n      end\n      C1 & C2 -->|Host 헤더 그대로| GW[Gateway<br/>Envoy]\n      GW -->|hostnames: dev.claudharmony.io| DEV[ns dev · web]\n      GW -->|hostnames 없음 = 기본| PRD[ns prd · web]\n    end\n```\n\n- 터널은 **모든 호스트를 Gateway 하나로** 보낸다. 환경(dev/prd) 구분은 Gateway 의 **HTTPRoute hostnames** 가 한다.\n  → 새 서브도메인을 추가할 때 터널은 호스트 이름만 추가하면 되고, 라우팅 규칙은 K8s 쪽에 있다.\n\n## Terraform 구성 — `platform/edge` (2.5단계)\n\n| 리소스 | 역할 |\n|--------|------|\n| `cloudflare_zero_trust_tunnel_cloudflared` | 터널 객체 (`config_src = \"cloudflare\"` → 라우팅 설정을 Cloudflare 가 보관) |\n| `cloudflare_zero_trust_tunnel_cloudflared_config` | ingress 규칙: 각 호스트 → `http://claudharmony-gateway.envoy-gateway-system.svc.cluster.local:80`, 마지막은 `http_status:404` |\n| `cloudflare_dns_record` × 3 | `CNAME <tunnel-id>.cfargotunnel.com`, `proxied = true` |\n| `data.cloudflare_zero_trust_tunnel_cloudflared_token` | 커넥터 실행 토큰 |\n| `kubernetes_secret_v1` | 토큰 → Secret `edge/cloudflared-token` |\n| `kubernetes_deployment_v1` | cloudflared × 2 (`tunnel run`, `TUNNEL_TOKEN`), `/ready` probe |\n\n```bash\nscripts/infra.sh edge plan\nscripts/infra.sh edge apply      # ~/.claudharmony/cloudflare.env 를 읽어 CLOUDFLARE_API_TOKEN, TF_VAR_cloudflare_account_id 설정\nscripts/infra.sh edge status\nscripts/infra.sh prd check       # local + https://claudharmony.io\n```\n\n서브도메인 추가: `platform/edge/variables.tf` 의 `hostnames` 에 추가 → `edge apply` → 해당 환경 HTTPRoute hostnames 에도 추가.\n\n## 처음부터 설정하는 순서\n\n### 1. 도메인 구매 — Cloudflare Registrar\n- dash.cloudflare.com → **Domain Registration → Register Domains** → 검색 → 구매\n- 원가 판매(갱신가 동일), WHOIS 비공개 기본, 네임서버 자동 설정\n- `.kr` 은 미지원 → 국내 등록업체 구매 후 네임서버를 Cloudflare 로 변경\n\n### 2. Zero Trust 활성화 (터널 사용 전 필수)\n- https://one.dash.cloudflare.com → 팀 이름 지정 → **Free** 플랜 (결제수단 등록 요구될 수 있음, 과금 없음)\n- 안 하면 API 로 터널 생성 시 `10000 Authentication error`, Access 조회 시 `access.api.error.not_enabled`\n\n### 3. API 토큰 (계정 API 토큰, 최소 권한)\n대시보드 → 계정 관리 → **계정 API 토큰 → 토큰 생성 → 처음부터 시작(Custom)**\n\n| 정책 | 리소스 | 권한 |\n|------|--------|------|\n| 1 | 전체 계정 | **Cloudflare One Connector: cloudflared — Edit** |\n| | | Cloudflare One Connectors — Edit |\n| | | Argo Tunnel (Legacy) — Edit |\n| | | Access: Apps and Policies — Edit (dev 접근 제한용, 선택) |\n| 2 | 영역 `claudharmony.io` | **DNS — Edit**, **Zone — Read** |\n\n- 만료 1년, IP 필터링 없음 (사무실 공인 IP 가 바뀔 수 있음)\n- `Zone — Read` 는 Terraform 이 도메인 이름으로 zone 을 찾을 때 필요\n\n### 4. 자격증명 파일 (저장소 밖)\n```bash\n# ~/.claudharmony/cloudflare.env  (chmod 600)\nCLOUDFLARE_API_TOKEN=<토큰>\nCLOUDFLARE_ACCOUNT_ID=<32자리 — 대시보드 URL dash.cloudflare.com/<여기>/...>\n```\n\n### 5. 적용\n```bash\nscripts/infra.sh edge apply\nscripts/infra.sh dev apply   # dev HTTPRoute 에 dev.claudharmony.io 추가\n```\n\n## 트러블슈팅 (실제로 겪은 것)\n\n| 증상 | 원인 | 해결 |\n|------|------|------|\n| 터널 생성 `10000 Authentication error`, 목록 조회는 성공 | 토큰에 터널 **쓰기** 권한 없음. UI 에서 \"Cloudflare Tunnel\" 로 검색하면 **Argo Tunnel (Legacy)** 만 나오는데 그것만으론 부족 | **Cloudflare One Connector: cloudflared — Edit** 추가 |\n| 위와 동시에 `access.api.error.not_enabled` | 계정에 Zero Trust 미개설 | one.dash.cloudflare.com 에서 Free 플랜 활성화 |\n| 권한을 넣었는데도 같은 오류 | 정책 카운터가 `0/72` — 체크가 저장 안 됨 | 정책 화면 카운터 확인 후 **토큰 업데이트** 버튼까지 누르기 |\n| DNS 권한 항목이 `Account DNS Settings` 로 보임 | 정책 범위가 \"전체 계정\" | 범위를 **영역 → claudharmony.io** 로 바꾸면 `DNS`, `Zone` 항목이 나옴 |\n| 토큰 상태 확인 `/user/tokens/verify` 실패 | 계정 API 토큰은 경로가 다름 | `/accounts/<id>/tokens/verify` |\n\n인증 문제인지 입력 문제인지 가르는 요령: **빈 body 로 POST** → `10000 Authentication error` 면 권한, `1030 ... missing field` 면 권한 통과.\n\n## 보안 메모\n\n- 토큰은 API 토큰 화면에서 언제든 회수(Roll/Delete) 가능 — 유출 의심 시 즉시 Roll 하고 파일 교체\n- 터널 토큰은 K8s Secret 으로만 존재 (`kubectl -n edge get secret cloudflared-token`) — 커밋 금지\n- 다음 단계 후보: **Cloudflare Access** 로 `dev.claudharmony.io` 를 이메일 로그인 뒤로 숨기기 (토큰에 권한 이미 포함)\n"}, {"id": "09-database", "md": "# 09. 데이터베이스 — PostgreSQL (CloudNativePG) 와 데이터 플랫폼 로드맵\n\n## 원칙\n\n| 위치 | 역할 |\n|------|------|\n| **애플리케이션 (api)** | 도메인 규칙·검증·트랜잭션 경계 |\n| **PostgreSQL** | 저장·조회만. **저장 프로시저/트리거/DB 함수에 업무 규칙 넣지 않음** |\n| **스키마** | api 저장소의 **`db/schema.sql` (Atlas 선언형)** — 앱은 스키마를 바꾸지 않는다 |\n| **web** | DB 직접 접근 금지 — api 만 경유 |\n\nDB 는 언제든 갈아끼울 수 있는 저장소로 둔다 → 나중에 RDS / Cloud SQL 이전 시 접속 정보만 교체.\n\n## 지금 구성 (2026-10-24)\n\n| 항목 | 값 |\n|------|----|\n| Operator | **CloudNativePG 1.30.1** (Helm chart 0.29.1) — `platform/database`, ns `cnpg-system` |\n| 이미지 | `ghcr.io/cloudnative-pg/postgis:18.6-3.6.4-standard-trixie` — **PostgreSQL 18.6 + PostGIS 3.6.4** |\n| 환경 | dev, prd 각 Namespace 에 Cluster `pg` (인스턴스 1, 스토리지 5Gi) |\n| 메모리 | dev 384Mi / prd 512Mi (shared_buffers = 1/4) |\n| 설정 | `timezone=Asia/Seoul`, `max_connections=50`, 0.5초 이상 쿼리 로그 |\n| 확장 | `postgis` (initdb 시 생성) |\n| 외부 공개 | **없음** — 클러스터 안 api 만 접근 |\n\n### 만들어지는 것 (Namespace 마다)\n\n| 종류 | 이름 | 용도 |\n|------|------|------|\n| Service | `pg-rw` | 읽기·쓰기 (primary) — **앱은 이것** |\n| Service | `pg-ro` / `pg-r` | 읽기 전용 replica / 아무 인스턴스 (인스턴스 2개 이상일 때 의미) |\n| Secret | `pg-app` | 앱 계정 `app` — `username`, `password`, `jdbc-uri`, `uri` … (CN
