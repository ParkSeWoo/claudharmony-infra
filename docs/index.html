PG 자동 생성) |\n| Secret | `pg-readonly` | 조회 계정 `readonly` — Terraform 이 랜덤 생성, `pg_read_all_data` 역할 |\n| PVC | `pg-1` | 데이터 (kind `standard` = local-path) |\n\n### 계정\n\n| 계정 | 권한 | 쓰는 곳 |\n|------|------|---------|\n| `app` | DB `claudharmony` 소유자 (읽기·쓰기·DDL) | api, Flyway |\n| `readonly` | 모든 테이블 조회만 (`pg_read_all_data`), 연결 5개 제한 | DB 툴, 어드민 콘솔, 분석 |\n| `postgres` | 슈퍼유저 | 운영자만 (`kubectl exec`) |\n\n`readonly` 로 `CREATE TABLE` → `permission denied for schema public` 확인함.\n\n## 앱에 연결하기\n\n서비스 카탈로그에서 `\"database\": true` 인 서비스에 접속 정보가 자동 주입된다 (현재 `api`).\n\n```json\n\"api\": { \"port\": 8080, \"database\": true }\n```\n\n| 환경변수 | 값 |\n|----------|----|\n| `SPRING_DATASOURCE_URL` | `jdbc:postgresql://pg-rw.<env>.svc.cluster.local:5432/claudharmony` |\n| `SPRING_DATASOURCE_USERNAME` | Secret `pg-app` → `username` |\n| `SPRING_DATASOURCE_PASSWORD` | Secret `pg-app` → `password` |\n\napi 에 `spring-boot-starter-data-jpa`(또는 jdbc) + `org.postgresql:postgresql` + `flyway-database-postgresql` 를 추가하면 바로 연결된다.\n**의존성이 없으면 이 환경변수는 무시**된다.\n\n2026-10-24 api 가 JPA 연결 완료 (api 세션, 처음엔 Flyway → 같은 날 Atlas 로 전환): dev 에 `V1 trend` 적용 → `trend_snapshot`, `trend_keyword` 테이블. 기동 직후 + 10분 주기로 Google 트렌드(KR) Top 10 을 시간당 1건 저장 → https://dev.claudharmony.io/trends\n\n## 스키마 관리 — Atlas (선언형)\n\n> 2026-10-24 Flyway → **Atlas** 로 전환. 이유: 운영에서 **앱 기동 시 자동 마이그레이션은 위험** (배포 = 스키마 변경, 실패 시 앱·DB 동시 꼬임).\n\n\"테이블이 이렇게 생겨야 한다\"를 **`db/schema.sql` 한 파일**로 관리하고, Atlas 가 실제 DB 와 비교해 변경 SQL 을 **계산**한다 (Terraform 의 plan/apply 와 같은 감각).\n\n| | dev | prd |\n|---|---|---|\n| 적용 시점 | `develop` push → `deploy-dev` 의 **DB schema 단계에서 자동** (앱 배포 전) | **`DB schema prd` 워크플로 수동 실행** (release/* 브랜치) |\n| 안전장치 | — | ① 계획만 먼저 (confirm 비움) ② `confirm = \"apply prd\"` ③ 적용 직전 **pg_dump 백업** (`~/.claudharmony/backups/`) ④ 위험 변경(DROP·타입 변경)은 `allow_destructive` 필요 |\n| 앱 배포 | 스키마 적용 뒤 | **`deploy-prd` 가 `check` — 적용 안 된 변경이 있으면 배포 중단** → \"스키마 먼저, 앱 나중\" 강제 |\n| 앱의 역할 | 스키마 변경 안 함. api 는 JDBC(`JdbcClient`) — **기동 시 `information_schema` 로 필요한 테이블·컬럼 검증, 없으면 기동 실패** (JPA `validate` 와 같은 역할) | 동일 |\n\n```bash\n# 로컬에서\nscripts/db-schema.sh dev plan  ~/workspace/claudharmony-api/db/schema.sql   # 실행될 SQL 미리보기\nscripts/db-schema.sh dev apply ~/workspace/claudharmony-api/db/schema.sql\nscripts/db-schema.sh prd plan  …                                            # prd 는 계획만 로컬에서, 적용은 워크플로로\n```\n\n동작: 로컬 Docker 에 빈 PostGIS DB(`claudharmony-atlas-dev`, `imresamu/postgis:18-3.6.1-trixie` — 공식 이미지는 arm64 없음)를 띄워 차이 계산용으로 쓰고, 대상 DB 는 port-forward + 앱 계정(소유자)으로 접속. Atlas `1.3.3-community` (오픈소스, 로그인 불필요).\n\n| 변경 | 계획 결과 예 |\n|------|-------------|\n| 컬럼 추가 | `ALTER TABLE \"trend_keyword\" ADD COLUMN \"region\" character varying(20) NULL;` |\n| 컬럼 삭제 | `ALTER TABLE ... DROP COLUMN ...` + **⚠️ 위험 변경 감지** |\n\n규칙\n- **뷰·트리거·프로시저 금지** (Community 판도 미지원 — \"DB 에 업무 규칙 없음\" 원칙과 일치)\n- **하위 호환으로**: 새 컬럼은 NULL 허용으로 추가 → 앱 배포 → 필요하면 다음 릴리스에서 NOT NULL. 삭제는 코드에서 안 쓰게 한 다음 릴리스에서\n- 제외 객체: `spatial_ref_sys`(PostGIS 시스템 테이블). 과거 Flyway 이력 `flyway_schema_history` 는 2026-10-24 dev·prd 모두 삭제\n- 테스트 DB(Testcontainers)도 `db/schema.sql` 로 생성 → **스키마 기준 파일 하나**\n\n## 로컬에서 DB 확인하기 — `scripts/db.sh`\n\n```bash\nscripts/db.sh up            # 한 번만 — dev·prd 상시 연결 (재부팅 후에도 자동)\nscripts/db.sh status        # 연결 상태\nscripts/db.sh info          # 접속 정보 표 (비밀번호 가림 / --show 표시 / info dev app --copy 클립보드)\nscripts/db.sh pgpass        # ~/.pgpass 생성 → psql·pg_dump 비밀번호 생략 (prd 쓰기 계정 제외)\nscripts/db.sh psql dev      # 바로 SQL (기본 readonly) · psql dev app 은 쓰기 계정\nscripts/db.sh down          # 연결 끊기\n```\n\n| 환경 | 호스트 | 포트 | DB | 계정 |\n|------|--------|------|----|------|\n| dev | `127.0.0.1` | **15432** | `claudharmony` | `readonly`(기본) / `app` |\n| prd | `127.0.0.1` | **25432** | `claudharmony` | `readonly`(기본) / `app`(명시할 때만) |\n\nSSL 은 끔 (Mac 안에서만 연결). 비밀번호는 `scripts/db.sh info --show` 또는 `--copy`.\n\n### 동작 방식\n\n```mermaid\nflowchart LR\n    T[DB 툴 · psql<br/>127.0.0.1:15432/25432] --> P[socat 프록시 컨테이너<br/>claudharmony-pg-dev/prd<br/>127.0.0.1 에만 열림]\n    P -->|kind Docker 네트워크| N[NodePort 31432 / 32432<br/>Service pg-local]\n    N --> PG[(pg-1 primary)]\n```\n\n- 처음엔 `kubectl port-forward` 였는데, **클라이언트가 접속을 끊을 때 DB 쪽 리셋으로 port-forward 프로세스 자체가 종료**(`lost connection to pod`)되는 한계 → DB 툴(연결을 자주 여닫음)에서 불안정\n- 그래서 `modules/k8s/postgres` 에 **NodePort Service `pg-local`**(dev 31432, prd 32432) + Mac 의 **socat 프록시 컨테이너**(`alpine/socat:1.8.1.1`, `--restart unless-stopped`, 127.0.0.1 바인딩)\n- NodePort 는 호스트 포트 매핑이 없어 **인터넷·사무실 LAN 에서는 닿지 않음** (같은 Mac 의 kind Docker 네트워크 안에서만)\n\n### DataGrip / IntelliJ 에서 보기 (2026-10-24 DataGrip 연결 확인)\n\nDataGrip: **Database Explorer → + → Data Source → PostgreSQL**, URL 칸에 `jdbc:postgresql://127.0.0.1:15432/claudharmony` 붙여넣으면 호스트·포트·DB 자동 입력 (prd 는 25432). 이하 절차는 IntelliJ 와 동일.\n\n#### IntelliJ (Database 도구)\n\n1. `scripts/db.sh up` (한 번만)\n2. 오른쪽 **Database** 탭 → **+ → Data Source → PostgreSQL** (드라이버 다운로드 승인)\n3. 이름 `claudharmony dev`, Host `127.0.0.1`, Port `15432`, Database `claudharmony`, User `readonly`, Password = `scripts/db.sh info dev readonly --copy` 후 붙여넣기 → **Test Connection** → OK\n4. prd 도 같은 방법으로 Port `25432` — **prd 는 readonly 만** 등록 권장. 데이터 소스 설정의 *Options → Read-only* 도 체크\n5. 색 구분: 데이터 소스 우클릭 → *Color Settings* → prd 를 빨간색\n\n### psql 자주 쓰는 것\n\n```sql\n\\dt                      -- 테이블 목록\n\\d trend_keyword         -- 테이블 구조\nselect * from trend_snapshot order by collected_hour desc limit 5;\nselect postgis_version();\n```\n\n## 운영\n\n```bash\nscripts/infra.sh database status                       # Operator + 모든 Cluster\nkubectl -n dev get cluster pg                          # STATUS: Cluster in healthy state\nkubectl -n dev describe cluster pg                     # 이벤트\nkubectl -n dev logs pg-1 -c postgres | tail            # PG 로그 (JSON)\nkubectl top pods -n dev                                # 메모리\n```\n\nk9s: `:clusters.postgresql.cnpg.io` 또는 `:pods` 에서 `pg-1`.\n\n### 스펙 변경\n\n| 바꿀 것 | 위치 | 영향 |\n|---------|------|------|\n| 메모리·스토리지·인스턴스 수 | `envs/<env>/main.tf` 의 `database = { ... }` | Operator 가 롤링 적용. 스토리지는 늘리기만 가능 |\n| PostgreSQL 마이너 버전 | `modules/k8s/postgres` 의 `image` | Operator 가 롤링 업데이트 |\n| 확장 추가 | `extensions` (예: `postgis_topology`) | **initdb 때만 실행** → 기존 DB 는 `CREATE EXTENSION` 수동 또는 Flyway |\n\n### ⚠️ 데이터 보존 — 아직 백업 없음\n\n- PVC 는 kind 노드 컨테이너 안 디스크 → Pod/노드 재시작은 안전, **`cluster apply` 로 클러스터 재생성 시 데이터 소실**\n- 다음 작업: CNPG **Barman Cloud Plugin** 으로 Cloudflare R2(또는 MinIO)에 base backup + WAL 아카이브 → 클러스터 재생성 시 `bootstrap.recovery` 로 복구\n\n## 데이터 플랫폼 로드맵\n\n앞으로 붙일 기능(위치 기반, 트렌드 크롤링, 기술 블로그 수집·알림, AI)에 맞춘 저장소 분리:\n\n| 계층 | 저장소 | 데이터 | 단계 |\n|------|--------|--------|------|\n| 서비스 DB (OLTP) | **PostgreSQL + PostGIS** | 회원·게시글·설정·위치 원본 | ✅ 지금 |\n| 백업 | R2 / MinIO (Barman Cloud) | base backup + WAL | 다음 |\n| 캐시·실시간 | **Redis** | 캐시, GEO 주변 검색, 순위, Streams 큐 | 2 |\n| 원본 저장소 | **오브젝트 스토리지** (MinIO → R2/S3) | 크롤링 원본(Bronze), Parquet | 2 |\n| 워커 | 카탈로그에 CronJob / Worker 유형 | 크롤러, 수집기, 임베딩, 알림 | 3 |\n| 벡터 DB | **Qdrant** (전용) | 글·트렌드·블로그 임베딩 | 3~4 |\n| 분석 DB (OLAP) | **ClickHouse** | 전국 트렌드 (지역 × 연령 × 시간 × 키워드), 수억 건 | 4 |\n| 수집 버퍼 | **Redpanda** (Kafka 호환) | 크롤러 → 정제 사이 이벤트 | 4 |\n| 관측 | Prometheus + Grafana | 메트릭, 수집 실패 알림 | 5 |\n\n```\n크롤러(CronJob) ─원본→ 오브젝트 스토리지 (Bronze)\n      └─이벤트→ Redpanda → 정제/집계 → ClickHouse (Silver/Gold)\n                         └→ 임베딩 → Qdrant\napi (도메인) ── PostgreSQL / Redis ── 서비스는 Gold 집계 + 벡터 검색 결과만 조회\n```\n\n선행 조건: **Docker Desktop 메모리 8GB → 16~20GB** (현재 사용 ~5.5GB), 대량 데이터용 디스크(Mac 폴더 extraMounts 또는 R2).\n"}, {"id": "10-console", "md": "# 10. 관리자 콘솔 (claudharmony-console)\n\nAWS/GCP 콘솔처럼 사무실 Kubernetes 인프라를 한 화면에서 보는 관리자 페이지.\n저장소: [claudharmony-console](https://github.com/ParkSeWoo/claudharmony-console) (private) · 로컬 `~/workspace/claudharmony-console`\n\n| 주소 | 상태 |\n|------|------|\n| http://console.localhost | ✅ 사무실 Mac |\n| https://console.claudharmony.io | ✅ 2026-10-25 공개 — Keycloak 로그인, admin 역할만 |\n\n## 1단계 — 조회 전용 (2026-10-24)\n\n| 화면 | 내용 |\n|------|------|\n| 대시보드 | 노드(Ready·버전·CPU/MEM), 플랫폼 구성요소(Gateway·도메인 터널·CNPG·Envoy Gateway·metrics-server), 외부 접속(응답코드·버전·지연), 환경 카드(prd/dev/console), 최근 배포 |\n| 환경 상세 `/env/{ns}` | 서비스별 Pod·재시작·노드·CPU/MEM, PostgreSQL 상태, HTTPRoute(호스트·경로·Accepted), 최근 1시간 경고 이벤트 |\n| 로그 `/env/{ns}/logs/{svc}` | 마지막 200줄(최대 2000), 새로고침 버튼으로 갱신 |\n\n- 화면 갱신은 상단 **새로고침 버튼**으로만 (자동 갱신은 사용자 요청으로 보류). 배포 이력은 GitHub 비인증 API 2분 캐시\n- 상태를 바꾸는 엔드포인트는 **없음**\n\n## 로그인 — Keycloak (2026-10-25)\n\n- 홈페이지와 같은 prd realm(`claudharmony`)의 client `console`로 로그인. **realm 역할 `admin`이 있는 사람만** 볼 수 있음 (그 외 403)\n- 홈페이지에서 이미 로그인했다면 Keycloak 세션이 있어 콘솔은 다시 묻지 않고 열림 (SSO)\n- 관리자 계정: prd realm `admin` (Terraform `platform/realms`, admin 역할). 임시 비밀번호 → 첫 로그인 때 변경\n  ```bash\n  kubectl -n identity get secret keycloak-service-admin -o jsonpath='{.data.password}' | base64 -d | pbcopy\n  ```\n- 앱 구현 (claudharmony-console `security/`):\n  - Spring Security `oauth2Login`. client 등록은 **discovery 없이 직접** — 기동 때 인터넷 주소를 부르지 않아 터널 장애 때도 콘솔이 뜬다\n  - 브라우저가 가는 주소(로그인·로그아웃)는 공개 주소, 토큰 교환·키·사용자 정보는 클러스터 안 주소. ID 토큰 `iss`는 공개 주소와 비교\n  - 역할은 ID 토큰 `roles` claim (`platform/realms`의 `realm-roles` 매퍼) → `ROLE_admin`\n  - 프로필 `keycloak`이 없으면 **모든 요청 거부** (fail-closed). 로컬에서만 `console.auth.local-dev=true`\n- 인프라 연결: `envs/console/services.auto.tfvars.json` — `SPRING_PROFILES_ACTIVE=keycloak` + Secret `keycloak-console` 4개\n- 공개 도메인은 HTTPRoute `console-public`에서 `X-Forwarded-Proto: https` 고정 → `{baseUrl}`이 https가 되어 redirect URI가 맞음\n\n## 구조\n\n```mermaid\nflowchart LR\n    B[브라우저] -->|console.localhost / console.claudharmony.io| GW[Gateway]\n    GW -->|HTTPRoute hostnames| C[console Pod<br/>ns console]\n    C -->|ServiceAccount console<br/>읽기 전용| API[kube-apiserver]\n    C -->|/version| EXT[https://claudharmony.io<br/>https://dev.claudharmony.io]\n    C -->|public API| GH[GitHub<br/>infra 배포 기록 커밋]\n```\n\n| 항목 | 값 |\n|------|----|\n| 스택 | Java 25, Spring Boot 4.1.2, fabric8 kubernetes-client 7.9.0, Thymeleaf + htmx 2.0.11 |\n| 코드 컨벤션 | **Google Java Style** — Spotless 8.9.0 + google-java-format 1.36.1 (`./gradlew spotlessApply`) |\n| 배포 | `main` push → `deploy.yml` (self-hosted runner) → `deploy.sh console console <image>` |\n| 인프라 | `envs/console` — Namespace `console`, 서비스 카탈로그 1개, `hostnames = [console.localhost, console.claudharmony.io]` |\n\n## 권한 — 최소 권한\n\nClusterRole `claudharmony-console-read` + ServiceAccount `console` (`envs/console/main.tf`):\n\n| API 그룹 | 리소스 | 동작 |\n|----------|--------|------|\n| core | namespaces, nodes, pods, pods/log, services, events, PVC, configmaps | get/list/watch |\n| apps / batch | deployments, replicasets, statefulsets / jobs, cronjobs | get/list/watch |\n| gateway.networking.k8s.io | gateways, httproutes, gatewayclasses | get/list/watch |\n| postgresql.cnpg.io | clusters, backups, scheduledbackups | get/list/watch |\n| metrics.k8s.io | pods, nodes | get/list |\n\n**Secret 은 권한에 없음** — DB 비밀번호·터널 토큰을 콘솔이 읽을 수 없다. 화면에서 볼 수 있는 Namespace 도 설정(`console.environments`)으로 제한.\n\n## 공개 주소 보호 — Cloudflare Access\n\n`console.claudharmony.io` 는 Cloudflare 엣지에서 **이메일 일회용 코드 로그인**을 통과해야 터널에 닿게 한다 (`platform/edge`).\n허용 이메일은 공개 저장소에 두지 않고 `~/.claudharmony/cloudflare.env` 의 `CONSOLE_ALLOWED_EMAILS` 로 주입.\n\n⚠️ 2026-10-24 첫 시도: 토큰에 Access 쓰기 권한이 없어 **DNS 는 생기고 Access 는 실패** → 1분여 보호 없이 열림(콘솔 미배포 상태라 공개 홈페이지만 보임) → 즉시 DNS 제거.\n재적용 시 **Access 리소스가 성공한 뒤에 DNS 를 만들도록 의존성(`depends_on`)** 을 건다.\n\n## 로드맵\n\n| 단계 | 기능 | 방식 |\n|------|------|------|\n| 1 ✅ | 조회 | K8s API 읽기 |\n| 2 | 시작/중지 | 카탈로그 `replicas` 0↔N → infra 저장소 커밋 → Infra apply (GitHub App/토큰) |\n| 2 | 재시작 | `rollout restart` (권한: deployments patch) |\n| 2 | prd 배포 / 롤백 | 앱 저장소 `deploy-prd` 워크플로 실행 / images 기록 되돌리기 커밋 |\n| 3 | 서비스 추가, DB 생성, 크롤러 주기 | 카탈로그 폼 → 커밋 |\n| 3 | 감사 로그, 권한 | Access 사용자 → 동작 기록 |\n"}, {"id": "11-learning-guide", "md": "# 11. 학습 가이드 — 이 인프라를 바닥부터 이해하기\n\n이 문서는 **우리 인프라를 교재로** 순서대로 따라가는 커리큘럼이다.\n각 단계는 **① 개념 → ② 우리 구성(파일 위치) → ③ 직접 확인 → ④ 실습 → ⑤ 체크리스트** 로 되어 있다.\n전체 그림은 [아키텍처](01-architecture.md), K8s 개념 상세는 [Kubernetes 학습 가이드](05-kubernetes-guide.md).\n\n```bash\n# 시작 전 — 모든 단계에서 쓰는 준비\nexport KUBECONFIG=~/.claudharmony/kubeconfig   # (~/.zshrc 에 이미 설정됨)\ncd ~/infra\n```\n\n> ⚠️ 실습은 **dev 또는 읽기 전용 명령**만. prd 를 바꾸는 명령은 이 문서에 없다.\n\n## 학습 지도\n\n```mermaid\nflowchart LR\n    S1[1 컨테이너<br/>Docker] --> S2[2 클러스터<br/>kind · 노드]\n    S2 --> S3[3 워크로드<br/>Pod · Deployment · Service]\n    S3 --> S4[4 트래픽<br/>Gateway API]\n    S4 --> S5[5 외부 공개<br/>NAT · Tunnel · DNS · TLS]\n    S3 --> S6[6 IaC<br/>Terraform 스택·모듈·state]\n    S3 --> S7[7 데이터<br/>CloudNativePG · Atlas]\n    S7 --> S7B[7.5 인증<br/>Keycloak · OIDC]\n    S6 --> S8[8 CI/CD<br/>브랜치 · 러너 · deploy.sh]\n    S8 --> S9[9 운영<br/>k9s · 로그 · 메트릭 · 콘솔]\n    S9 --> S10[10 장애 사례<br/>작업 기록]\n```\n\n| 단계 | 주제 | 예상 시간 |\n|------|------|-----------|\n| 1 | 컨테이너 | 30분 |\n| 2 | 클러스터와 노드 | 30분 |\n| 3 | 워크로드 (Pod/Deployment/Service) | 1시간 |\n| 4 | 트래픽 (Gateway API) | 1시간 |\n| 5 | 외부 공개 (이중 NAT, Tunnel, DNS, TLS) | 1시간 |\n| 6 | Terraform 구조 | 1~2시간 |\n| 7 | 데이터 (PostgreSQL Operator, Atlas) | 1시간 |\n| 7.5 | 인증 (Keycloak, OIDC) | 1시간 |\n| 8 | CI/CD | 1시간 |\n| 9 | 운영 도구 | 30분 |\n| 10 | 장애 사례 복기 | 1시간 |\n\n---\n\n## 1단계 — 컨테이너\n\n**① 개념**: 이미지 = 실행 파일 묶음(불변), 컨테이너 = 이미지를 실행한 프로세스. 멀티스테이지 빌드로 \"빌드 도구 이미지 → 실행용 작은 이미지\".\n\n**② 우리 구성**: 각 앱 저장소 루트 `Dockerfile` (예: `~/workspace/claudharmony-api/Dockerfile` — `temurin:25-jdk` 로 빌드 → `temurin:25-jre` 로 실행). 이미지 이름 `claudharmony/<서비스>:<태그>`.\n\n**③ 확인**\n```bash\ndocker images 'claudharmony/*' --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | head\ndocker ps --filter name=claudharmony     # kind 노드도 사실은 컨테이너!\n```\n\n**④ 실습**: `docker history claudharmony/api:<태그>` 로 레이어 보기 → 어떤 레이어가 큰지 찾아보기.\n\n**⑤ 체크**: □ 이미지와 컨테이너의 차이 □ 멀티스테이지 빌드의 이점 □ 태그 `dev-<sha>` / `20261024-<sha>` 의 의미\n\n---\n\n## 2단계 — 클러스터와 노드\n\n**① 개념**: 클러스터 = API 서버(+etcd, 스케줄러, 컨트롤러) + 노드. 노드의 kubelet 이 컨테이너를 실행. kind 는 \"노드 = Docker 컨테이너\".\n\n**② 우리 구성**: `platform/cluster/` — `kind-config.yaml.tftpl` (노드 2개, `extraPortMappings 30080 → 호스트 80`), `main.tf` (`terraform_data` + `kind create cluster`).\n\n**③ 확인**\n```bash\nkubectl get nodes -o wide\nkubectl -n kube-system get pods                  # API 서버, etcd, coredns …\ndocker port claudharmony-control-plane           # 30080/tcp -> 0.0.0.0:80\nkubectl top nodes                                # metrics-server\n```\n\n**④ 실습**: `docker exec -it claudharmony-worker crictl ps` — 노드 안에서 실제로 도는 컨테이너 목록을 `kubectl get pods -A -o wide` 와 비교.\n\n**⑤ 체크**: □ control-plane 과 worker 의 역할 □ 왜 kubeconfig 를 분리했는지(`kind-ch4` 보호) □ kind 업그레이드 = 재생성인 이유\n\n---\n\n## 3단계 — 워크로드 (Pod · Deployment · Service)\n\n**① 개념**: Pod(일회용) ← ReplicaSet(개수 유지) ← Deployment(버전·롤링 업데이트). Service = Pod 앞의 고정 주소(DNS `이름.ns.svc.cluster.local`). Probe: liveness(재시작) / readiness(트래픽 제외).\n\n**② 우리 구성**: `modules/k8s/app/main.tf` — Deployment(`RollingUpdate maxSurge 1 / maxUnavailable 0` = 무중단), Service(80 → 컨테이너 포트), probe(`/actuator/health/liveness|readiness`), 리소스(`memory_mb`). 어떤 서비스가 있는지는 `envs/<env>/services.auto.tfvars.json`.\n\n**③ 확인**\n```bash\nkubectl -n dev get deploy,rs,pod,svc\nkubectl -n dev describe deploy api | sed -n '/Containers/,/Conditions/p'\nkubectl -n dev rollout history deploy/web\nkubectl run t --rm -it --image=curlimages/curl -n dev --restart=Never -- curl -s http://api/actuator/health\n```\n\n**④ 실습 (dev)**: `kubectl -n dev delete pod -l app.kubernetes.io/name=web` → `kubectl -n dev get pod -w` 로 자가 치유 관찰 (새 Pod 가 바로 생김).\n\n**⑤ 체크**: □ Pod 를 직접 지워도 되는 이유 □ readiness 실패 시 일어나는 일 □ `http://api` 가 같은 Namespace 의 Service 로 풀리는 원리\n\n---\n\n## 4단계 — 트래픽 (Gateway API)\n\n**① 개념**: GatewayClass(어떤 구현체) → Gateway(리스너, 실제 LB) → HTTPRoute(호스트·경로 → Service). 인프라 담당과 앱 담당이 리소스로 분리됨. 경로가 겹치면 **오래된 라우트 우선**, 경로는 **긴 것 우선**.\n\n**② 우리 구성**: `platform/gateway/main.tf` (Envoy Gateway Helm, `EnvoyProxy` = NodePort 30080 + `externalTrafficPolicy: Cluster`, Gateway 는 라벨 `claudharmony.io/gateway-access=true` Namespace 만 허용), `modules/k8s/app` 의 HTTPRoute (`/actuator` → `/` 리다이렉트 규칙 포함).\n\n**③ 확인**\n```bash\nkubectl get gatewayclass,gateway -A\nkubectl get httproute -A\nkubectl -n dev describe httproute web | sed -n '/Status/,$p'    # Accepted / ResolvedRefs\ncurl -s http://localhost/version; curl -s http://dev.localhost/version\ncurl -s -H 'Host: dev.localhost' http://127.0.0.1/version       # Host 헤더로 환경이 갈림\n```\n\n**④ 실습**: `curl -sI http://localhost/actuator/env` → 302 확인 (외부 비공개 규칙). 왜 Pod 의 probe 는 영향이 없는지 설명해 보기.\n\n**⑤ 체크**: □ prd 라우트에 hostnames 가 없는 이유 □ `externalTrafficPolicy: Local` 이면 왜 안 됐는지 ([작업 기록 #9](07-worklog.md)) □ 네임스페이스 라벨 selector 의 보안 의미\n\n---\n\n## 5단계 — 외부 공개 (이중 NAT · Tunnel · DNS · TLS)\n\n**① 개념**: NAT 뒤 서버는 밖에서 못 들어온다 → 포트포워딩(인바운드) 또는 **터널(아웃바운드)**. Cloudflare Named Tunnel = 고정 이름 + 여러 커넥터. DNS CNAME → `<tunnel>.cfargotunnel.com`, `proxied` 레코드는 Cloudflare 가 TLS 종단. Access = 엣지에서 로그인.\n\n**② 우리 구성**: [사무실 네트워크](02-office-network.md) (SK 공유기 → 상위 GNT2400 이중 NAT), `platform/edge/main.tf` (터널, ingress = 모든 호스트 → Gateway, DNS ×3, cloudflared ×2), [도메인 연결](08-domain.md).\n\n**③ 확인**\n```bash\nkubectl -n edge get deploy,pods\nkubectl -n edge logs deploy/cloudflared | grep -E 'Registered tunnel connection' | tail -4   # icn = 서울 엣지\ndig +short claudharmony.io                       # Cloudflare IP (사무실 IP 아님)\ncurl -sI https://claudharmony.io | grep -i server\nscripts/infra.sh prd check\n```\n\n**④ 실습**: `kubectl -n edge delete pod <cloudflared 하나>` → 그동안 `curl https://claudharmony.io/version` 이 계속 되는지 (커넥터 이중화).\n\n**⑤ 체크**: □ 인바운드 vs 아웃바운드 연결 □ 공인 IP:80 에서 공유기 로그인 화면이 보였던 이유 □ Quick Tunnel 대신 Named Tunnel 로 바꾼 이유 □ \"보호 먼저, 노출 나중\" (콘솔 사고 — [작업 기록 #30](07-worklog.md))\n\n---\n\n## 6단계 — Terraform 구조\n\n**① 개념**: 선언(원하는 상태) → `plan`(차이) → `apply`. state = Terraform 이 관리하는 실제 리소스 목록. 모듈 = 재사용 단위. provider = 대상 API(kubernetes, helm, cloudflare…).\n\n**② 우리 구성**\n```\nplatform/{cluster,gateway,edge,addons,database}   # 클러스터 공용 — 단계별 state\nenvs/{dev,prd,console}                             # 환경 — 카탈로그(JSON) + 배포 기록(JSON)\nmodules/k8s/{env,app,postgres,tunnel}             # 재사용 모듈\nscripts/infra.sh <stack> <plan|apply|status|...>  # backend 경로·자격증명 주입\n```\nstate 는 저장소 밖 `~/.claudharmony/state/<stack>.tfstate`.\n\n**③ 확인**\n```bash\nscripts/infra.sh dev plan            # \"No changes\" = 코드와 실제가 일치\nterraform -chdir=envs/dev state list\ncat envs/dev/services.auto.tfvars.json envs/dev/images.auto.tfvars.json\n```\n\n**④ 실습 (plan 만)**: `envs/dev/services.auto.tfvars.json` 의 web `memory_mb` 를 바꿔 `scripts/infra.sh dev plan` → 어떤 리소스가 \"update in-place\" 인지 확인 → **되돌리기** (`git checkout envs/dev`).\n\n**⑤ 체크**: □ 왜 스택을 나눴나(CRD 순서, 폭발 반경) □ HCL 대신 JSON 카탈로그를 둔 이유(콘솔) □ provider 가 기본값을 채워서 생기는 드리프트(`memory_swap` 사례)\n\n---\n\n## 7단계 — 데이터 (PostgreSQL Operator · Atlas)\n\n**① 개념**: Operator = \"운영 지식을 코드로 만든 컨트롤러\". `Cluster` CR 하나로 PostgreSQL 생성·장애조치·업그레이드. 스키마는 **선언형**(최종 모습) → 도구가 ALTER 계산.\n\n**② 우리 구성**: `platform/database` (CNPG Operator), `modules/k8s/postgres` (Cluster `pg`, 계정 `app`/`readonly`, PostGIS), api `db/schema.sql` + `scripts/db-schema.sh` (Atlas). 상세 [데이터베이스](09-database.md).\n\n**③ 확인**\n```bash\nkubectl get clusters.postgresql.cnpg.io -A\nkubectl -n dev exec pg-1 -c postgres -- psql -U postgres claudharmony -c '\\dt'\nscripts/db.sh up && scripts/db.sh psql dev   # 로컬 접속 (readonly) — IntelliJ 는 127.0.0.1:15432\nscripts/db-schema.sh dev plan ~/workspace/claudharmony-api/db/schema.sql\n```\n\n**④ 실습 (plan 만)**: schema.sql 복사본에 컬럼을 하나 추가/삭제해서 `plan` → `ADD COLUMN` / ⚠️ 위험 변경 감지 보기.\n\n**⑤ 체크**: □ 왜 앱 기동 시 자동 마이그레이션을 운영에서 금지했나 □ `DB schema prd` → `Deploy prd` 순서와 `check` □ readonly 계정이 쓰기를 못 하는 원리(`pg_read_all_data`) □ 아직 정기 백업이 없다는 위험\n\n---\n\n## 7.5단계 — 인증 (Keycloak · OIDC)\n\n**① 개념**: 로그인을 앱마다 만들지 않고 **IdP**(Keycloak)에 맡긴다. 앱은 OIDC로 토큰을 받고, api는 토큰 서명(JWKS)·`iss`·`aud`만 검증한다. realm = 사용자·설정이 완전히 분리되는 단위.\n\n**② 우리 구성**: `platform/identity`(서버, Namespace `identity`, 전용 DB) → `platform/realms`(Keycloak provider로 realm·client·역할·계정, 앱 Namespace에 `keycloak-*` Secret). 인터넷에는 로그인 경로만, 관리 콘솔은 `auth.localhost`. 상세 [인증 서버](12-identity.md).\n\n**③ 확인**\n```bash\nscripts/infra.sh identity status\ncurl -s -H 'Host: auth.localhost' http://127.0.0.1/realms/claudharmony-dev/.well-known/openid-configuration | python3 -m json.tool | head\ncurl -s -o /dev/null -w '%{http_code} %{redirect_url}\\n' -H 'Host: auth.claudharmony.io' http://127.0.0.1/admin/   # 302 → 공개 주소에서 관리 콘솔 차단\nkubectl -n dev get secret keycloak-api -o jsonpath='{.data.issuer-uri}' | base64 -d; echo\n```\n\n**④ 실습**: dev 사용자 `tester`로 토큰 받아 보기 — 관리 콘솔 → `claudharmony-dev` → Clients → web → Client scopes → Evaluate → `tester` 선택 → Generated access token에서 `iss`, `aud`, `realm_access.roles` 확인.\n\n**⑤ 체크**: □ 서버와 설정을 왜 다른 Terraform 스택으로 나눴나 □ issuer는 공개 주소인데 JWKS는 왜 클러스터 안 주소로 받나 □ redirect URI 제한이 없으면 무슨 일이 생기나 □ master realm을 인터넷에 열지 않는 이유\n\n---\n\n## 8단계 — CI/CD\n\n**① 개념**: 브랜치 전략(develop → dev 자동, release → prd 수동, main = 운영 코드). self-hosted runner = 우리 장비에서 도는 Actions 실행기(아웃바운드 폴링).\n\n**② 우리 구성**: 앱 저장소 `.github/workflows/{ci,deploy-dev,deploy-prd,db-schema-prd}.yml`, infra `scripts/deploy.sh` (kind load → images 기록 → apply → rollout → 기록 커밋, mkdir 잠금으로 직렬화), infra `.github/workflows/infra-apply.yml`. 상세 [CI/CD](06-cicd.md).\n\n**③ 확인**\n```bash\ngh run list -R ParkSeWoo/claudharmony-web -L 5\ngit -C ~/infra log --oneline --grep '^deploy(' -8      # 배포 이력 = 커밋\nls ~/.claudharmony/runners/\n```\n\n**④ 실습**: web 저장소 develop 에 작은 변경 push → Actions 화면에서 단계별 로그 → `curl https://dev.claudharmony.io/version` 으로 태그 확인.\n\n**⑤ 체크**: □ 왜 GitHub 이 우리 Mac 에 접속하지 않아도 배포가 되나 □ `| tee` + pipefail 이 왜 필요한가(거짓 성공 사례) □ `[skip ci]` 의 역할 □ public 저장소 + self-hosted runner 의 위험과 대책\n\n---\n\n## 9단계 — 운영 도구\n\n| 도구 | 용도 | 시작 |\n|------|------|------|\n| **관리자 콘솔** | 전체 상태 한 화면 (노드·구성요소·서비스·DB·라우트·경고·배포·로그) | http://console.localhost |\n| **k9s** | 터미널 UI | `k9s` → `:ctx`, `0` 전체, `1` prd, `2` dev |\n| `scripts/infra.sh` | status / logs / check | `scripts/infra.sh prd status` |\n| `kubectl top` | CPU/메모리 | `kubectl top pods -A` |\n| `scripts/db.sh` | DB 접속 | `scripts/db.sh dev` |\n\n**실습**: 콘솔에서 dev → web → 로그. 같은 로그를 k9s(`l`)와 `scripts/infra.sh dev logs web` 으로도 열어 비교.\n\n---\n\n## 10단계 — 장애 사례 복기 (실제로 겪은 것)\n\n[작업 기록](07-worklog.md) 에서 아래를 원인 → 해결 순으로 다시 읽어 보기. **\"내가 겪었다면 어떻게 진단했을까\"** 를 먼저 생각하고 읽으면 효과가 크다.\n\n| # | 증상 | 핵심 교훈 |\n|---|------|-----------|\n| 5 | 공인 IP 포트포워딩 실패 | 이중 NAT — 안에서 본 화면은 증거가 아니다 |\n| 9 | localhost 응답 없음 | externalTrafficPolicy Local × 노드 배치 |\n| 14 | 배포 성공 표시인데 반영 안 됨 | pipefail, 결과(/version)로 검증 |\n| 14 | 배포 기록 push 실패 | launchd 서비스는 키체인 못 읽음 → deploy key |\n| 15 | SSH 22 타임아웃 | 사무실망 22 차단 → ssh.github.com:443 |\n| 22 | 사이트 순간 끊김 | 회선 순간 단절 → 커넥터 이중화 |\n| 23 | 터널 생성 Authentication error | Zero Trust 미개설 + 권한 이름 변경, 빈 body 로 판별 |\n| 27 | k9s 에 아무것도 안 보임 | 연결 실패 vs 빈 default 네임스페이스 — 로그부터 |\n| 30 | 콘솔 주소 1분 무방비 | 보호 먼저, 노출 나중 |\n| 33 | prd 에서 Flyway 자동 실행 | 운영 스키마 변경은 별도 단계 |\n\n---\n\n## 다음 학습 과제 (난이도 순)\n\n| # | 과제 | 배우는 것 |\n|---|------|-----------|\n| 1 | PostgreSQL 정기 백업 (CNPG Barman → R2) + 복구 연습 | 백업/PITR, 오브젝트 스토리지 |\n| 2 | NetworkPolicy 로 dev ↔ prd 차단 | 네트워크 격리 |\n| 3 | HPA (CPU 기반 자동 확장) | metrics-server 활용 |\n| 4 | Prometheus + Grafana | 관측성 |\n| 5 | Redis → Qdrant → ClickHouse | [데이터 플랫폼 로드맵](09-database.md) |\n| 6 | 콘솔 2단계 (시작/중지/배포 버튼) | Git → Terraform 기반 변경 자동화 |\n| 7 | k3s/EKS 로 `platform/cluster` 교체 | 이식성 |\n"}, {"id": "12-identity", "md": "# 12. 인증 서버 — Keycloak\n\n여러 로그인 방식(아이디·비밀번호, Google, GitHub, 카카오 …)을 **한곳에서** 관리하고, web·api·console은 표준 OIDC로 로그인을 Keycloak에 맡깁니다. 클라우드로 치면 AWS Cognito나 GCP Identity Platform에 해당합니다.\n\n| 주소 | 용도 | 공개 범위 |\n|------|------|-----------|\n| https://auth.claudharmony.io | 로그인 화면, 토큰 발급 | 인터넷 (공개 realm 경로만) |\n| http://auth.localhost/admin/ | 관리 콘솔 | 사무실 Mac 전용 |\n\n- 이미지 `quay.io/keycloak/keycloak:26.7.5`, Namespace `identity`, 전용 PostgreSQL(CNPG `identity/pg`, DB `keycloak`)\n- Terraform 스택 두 개: `platform/identity`(서버) → `platform/realms`(설정)\n- 앱 연동은 앱 세션이 맡습니다. 인프라가 각 Namespace에 넣어 주는 **Secret 계약**은 [6. 앱 연동 계약](#6-앱-연동-계약)을 보세요.\n\n---\n\n## 1. 개념 — 처음 보는 단어 정리\n\n| 단어 | 뜻 | 여기서는 |\n|------|----|----------|\n| **IdP** (Identity Provider) | \"이 사람이 누구인지\" 확인해 주는 서버 | Keycloak |\n| **OIDC** (OpenID Connect) | 로그인 표준. OAuth 2.0 위에 \"누구인지(ID 토큰)\"를 얹은 것 | web·console ↔ Keycloak |\n| **realm** | 사용자·client·설정이 완전히 분리되는 단위 (테넌트) | `claudharmony`(prd), `claudharmony-dev`(dev), `master`(관리용) |\n| **client** | Keycloak에 로그인을 맡기는 앱 | `web`, `api`, `console` |\n| **role** | 권한 이름표 | `user`(가입 시 기본), `admin` |\n| **Identity Provider (broker)** | Keycloak이 다시 외부 로그인(Google 등)에 위임 | `social.tf` (키 등록 대기) |\n| **issuer** | 토큰을 발급한 주소. 앱은 이 값이 맞는 토큰만 믿음 | `https://auth.claudharmony.io/realms/<realm>` |\n| **JWKS** | 토큰 서명을 검증할 공개키 목록 | api가 클러스터 안 주소로 받아감 |\n| **audience (aud)** | 토큰을 받을 대상 | web이 받은 토큰에 `aud=api` |\n\n로그인 흐름 (Authorization Code + PKCE):\n\n```mermaid\nsequenceDiagram\n    participant U as 브라우저\n    participant W as web (SvelteKit 서버)\n    participant K as Keycloak<br/>auth.claudharmony.io\n    participant A as api (Spring)\n    U->>W: /login\n    W-->>U: 302 → Keycloak 로그인 화면 (code_challenge)\n    U->>K: 아이디·비밀번호 (또는 Google/카카오)\n    K-->>U: 302 → web/callback?code=...\n    U->>W: code 전달\n    W->>K: code + client_secret + code_verifier → 토큰 교환\n    K-->>W: access token (aud=api), id token, refresh token\n    W->>A: Authorization: Bearer <access token>\n    A->>A: 서명(JWKS)·issuer·aud·만료 검증 후 처리\n```\n\n## 2. 구성도\n\n```mermaid\nflowchart LR\n    subgraph Internet\n      B[사용자 브라우저]\n    end\n    subgraph Mac[사무실 Mac]\n      AB[관리자 브라우저<br/>auth.localhost]\n      TF[Terraform<br/>platform/realms]\n    end\n    B -->|https auth.claudharmony.io| CF[Cloudflare Tunnel]\n    CF --> GW[Envoy Gateway]\n    AB -->|:80| GW\n    GW -->|HTTPRoute keycloak-public<br/>/realms/claudharmony*, /resources| KC\n    GW -->|HTTPRoute keycloak-admin<br/>auth.localhost 전체| KC\n    TF -.->|port-forward 18080<br/>bootstrap client| KC\n    subgraph identity[ns identity]\n      KC[Keycloak Pod] --> PG[(pg-1<br/>DB keycloak)]\n    end\n    subgraph apps[ns prd / dev / console]\n      W[web] -->|토큰 교환 http://keycloak.identity.svc| KC\n      A[api] -->|JWKS http://keycloak.identity.svc| KC\n    end\n```\n\n**공개 범위를 경로로 나눈 이유:** Keycloak 공식 권장 구성입니다. 인터넷에는 로그인에 필요한 `/realms/<공개 realm>`, `/resources`만 엽니다. `/admin`과 `/realms/master`는 공개 주소에서 `https://claudharmony.io/`로 302 리다이렉트됩니다. 관리 콘솔은 `auth.localhost`(Cloudflare 터널이 받지 않는 호스트)에서만 열립니다.\n\n| 요청 (Host: auth.claudharmony.io) | 결과 |\n|---|---|\n| `/realms/claudharmony/.well-known/openid-configuration` | 200 |\n| `/realms/claudharmony-dev/account` | 200 |\n| `/admin/`, `/realms/master/...`, `/` | 302 → https://claudharmony.io/ |\n| `/realms/claudharmony-devx/` (비슷한 이름) | 302 — Gateway API PathPrefix는 경로 **단위**로 비교 |\n\n## 3. Terraform — 왜 스택이 두 개인가\n\n| 스택 | provider | 만드는 것 |\n|------|----------|-----------|\n| `platform/identity` | kubernetes, kubectl, random | Namespace, DB(CNPG), bootstrap Secret, Deployment, Service, HTTPRoute 2개 |\n| `platform/realms` | **keycloak**, kubernetes, random | realm 2개, role, client 3종, 계정, 앱 Namespace Secret, (소셜 로그인) |\n\nKeycloak provider는 **이미 떠 있는 Keycloak**에 로그인해야 동작합니다. 한 스택에 넣으면 \"서버가 아직 없는데 서버에 접속하는 provider\"가 되어 첫 apply가 실패합니다. 그래서 서버와 설정을 나눴습니다. (cluster → gateway를 나눈 것과 같은 이유입니다. [5. Kubernetes 가이드](05-kubernetes-guide.md))\n\n```bash\nscripts/infra.sh identity apply   # 서버 (첫 기동 1~2분)\nscripts/infra.sh realms apply     # 설정\nscripts/infra.sh identity status\n```\n\n`realms` 스택이 Keycloak에 닿는 방법:\n- `*.localhost` 주소는 브라우저만 127.0.0.1로 풀어 줍니다(macOS 시스템 DNS는 못 풂). 그래서 `infra.sh`가 실행하는 동안만 `kubectl port-forward svc/keycloak 18080:80`을 엽니다.\n- 인증은 첫 기동 때 만든 **bootstrap client**(`terraform-bootstrap`, client_credentials)로 합니다. 비밀은 Secret `identity/keycloak-bootstrap`에 있고, 저장소에는 없습니다.\n\n## 4. 설치 과정 (스크린샷)\n\n### 4-1. 서버 — `platform/identity`\n\n핵심 환경변수:\n\n| 변수 | 값 | 이유 |\n|------|----|------|\n| `KC_HOSTNAME` | `https://auth.claudharmony.io` | 토큰 issuer를 항상 공개 주소로 고정 |\n| `KC_HOSTNAME_ADMIN` | `http://auth.localhost` | 관리 콘솔 주소 분리 |\n| `KC_HOSTNAME_BACKCHANNEL_DYNAMIC` | `true` | 클러스터 안 앱은 `http://keycloak.identity.svc`로 토큰 교환·JWKS 요청 |\n| `KC_HTTP_ENABLED` / `KC_PROXY_HEADERS` | `true` / `xforwarded` | TLS는 Cloudflare에서 끝나고, 원래 https인지는 헤더로 앎 |\n| `KC_CACHE` | `local` | 1대 운영. 여러 대로 늘리면 `ispn` |\n| `KC_BOOTSTRAP_ADMIN_CLIENT_ID/SECRET` | Secret | 사람 계정 대신 **Terraform 전용 client**로 시작 |\n\n- Probe는 관리 포트 9000의 `/health/started|ready|live`를 씁니다. 9000번은 Gateway에 연결하지 않습니다.\n- 메모리: limit 1Gi, 실제 사용량 약 560Mi (JVM이 limit의 약 70%까지 힙으로 씀)\n\n### 4-2. 설정 — `platform/realms`\n\n관리 콘솔 로그인 화면입니다(`http://auth.localhost/admin/`). 계정은 Terraform이 만든 `claudharmony-admin`입니다.\n\n![관리 콘솔 로그인](images/keycloak/01-admin-login.png)\n\nTerraform으로 만든 realm 목록입니다. `master`는 관리용이고, 서비스용은 prd와 dev를 따로 둡니다. 사용자·세션이 환경끼리 섞이지 않습니다.\n\n![realm 목록](images/keycloak/02-realms.png)\n\nrealm 기본 설정입니다(표시 이름 \"클라우드 하모니\").\n\n![realm 설정](images/keycloak/03-realm-settings.png)\n\n로그인 화면 언어는 한국어가 기본입니다.\n\n![지역화 — 한국어 기본](images/keycloak/10-localization.png)\n\nclient 목록입니다. 여기에 `web`, `api`, `console`이 추가되었습니다.\n\n![client 목록](images/keycloak/04-clients.png)\n\n`web` client입니다. 로그인 후 돌아올 주소(redirect URI)를 환경별로 제한합니다. 목록에 없는 주소로는 토큰이 나가지 않습니다.\n\n![web client — redirect URI](images/keycloak/06-client-web-urls.png)\n\n역할입니다. `user`는 가입 시 기본으로 붙고, `admin`은 콘솔 로그인용입니다.\n\n![realm 역할](images/keycloak/07-realm-roles.png)\n\n소셜 로그인(Identity Provider) 목록입니다. 키를 받으면 Terraform이 추가합니다([7. 소셜 로그인](#7-소셜-로그인-추가)).\n\n![Identity providers](images/keycloak/08-identity-providers.png)\n\ndev realm의 확인용 사용자 `tester`입니다. 비밀번호는 Secret `dev/keycloak-tester`에 있습니다.\n\n![dev 사용자](images/keycloak/09-dev-users.png)\n\n### 4-3. 공개 주소 — `platform/edge`\n\n`hostnames`에 `auth.claudharmony.io`를 추가하면 DNS 레코드(proxied CNAME → 터널)와 터널 ingress가 함께 생깁니다. Gateway가 호스트 이름으로 Keycloak HTTPRoute를 고릅니다.\n\n```bash\nscripts/infra.sh edge apply   # Cloudflare 토큰 필요 — 사람이 직접 실행\n```\n\n### 4-4. 공개 로그인 화면 (인터넷)\n\n`https://auth.claudharmony.io/realms/claudharmony-dev/account`에 들어가면 Keycloak 로그인 화면이 한국어로 나옵니다. 제목은 realm 표시 이름입니다. 로그인 화면 테마는 앱 세션의 claudharmony-keycloak 이미지로 바꿀 예정입니다([5-1](#5-1-커스텀-이미지-로그인-테마-배포)).\n\n![공개 로그인 화면 — 한국어](images/keycloak/11-login-page.png)\n\n`tester`로 로그인한 뒤의 계정 화면입니다. 사용자는 여기서 자기 정보와 비밀번호를 관리합니다.\n\n![로그인 후 계정 화면](images/keycloak/12-account.png)\n\n## 5. 운영\n\n```bash\n# 관리자 비밀번호 → 클립보드\nkubectl -n identity get secret keycloak-admin -o jsonpath='{.data.password}' | base64 -d | pbcopy\n# dev 테스트 사용자 비밀번호\nkubectl -n dev get secret keycloak-tester -o jsonpath='{.data.password}' | base64 -d; echo\n# 로그 / 상태\nscripts/infra.sh identity status\nkubectl -n identity logs deploy/keycloak --tail 100\n```\n\n| 항목 | 방법 |\n|------|------|\n| 설정 변경 | 콘솔에서 바꾸지 말고 `platform/realms` 수정 → apply. 콘솔 변경은 다음 apply 때 되돌아감 (관리자 비밀번호만 예외: `ignore_changes`) |\n| 업그레이드 | `keycloak_image` 버전 변경 → `identity apply`. 배포 전략이 `Recreate`라 1~2분 로그인 불가. 마이너 버전은 DB 스키마를 자동 마이그레이션 |\n| 백업 | Keycloak의 상태는 전부 DB `identity/pg`에 있음 → 앱 DB와 같은 백업 계획(Barman → R2, 예정)에 포함 |\n| 늘리기 | `replicas` 2 이상 + `KC_CACHE=ispn` + `KC_CACHE_STACK=kubernetes`(headless Service 필요) |\n\n## 5-1. 커스텀 이미지 (로그인 테마) 배포\n\n테마·확장은 앱 세션의 저장소 [claudharmony-keycloak](https://github.com/ParkSeWoo/claudharmony-keycloak)(private)에 있습니다. 공식 26.7.5 이미지에 테마 `claudharmony`를 넣고, 같은 빌드 옵션(`KC_DB=postgres`, health, metrics)으로 `kc.sh build`한 이미지입니다.\n\n```bash\n# claudharmony-keycloak 저장소 main 배포 워크플로(self-hosted runner)가 실행\nscripts/deploy.sh identity keycloak claudharmony/keycloak:<YYYYMMDD-sha>\n#   → kind load → platform/identity/images.auto.tfvars.json 기록 → identity apply → rollout 확인 → 기록 커밋\n```\n\n- `platform/identity`는 `images.keycloak`이 있으면 그 이미지를 쓰고, 없으면 공식 이미지(`keycloak_image`)를 씁니다.\n- Keycloak은 **한 대를 dev·prd realm이 같이 씁니다.** 이미지 배포는 main(또는 release)에서만 합니다. 배포 전략이 `Recreate`라서 1~2분 동안 로그인이 안 됩니다.\n- 테마 켜기는 realm별로 합니다(`platform/realms` 변수 `realms.<env>.login_theme`). **이미지가 먼저 배포된 다음에** dev realm부터 `\"claudharmony\"`로 켜고, 확인한 뒤 prd를 켭니다. 이미지에 없는 테마를 지정하면 로그인 화면이 오류를 냅니다.\n\n## 6. 앱 연동 계약\n\n인프라(`platform/realms`)가 각 Namespace에 Secret을 넣어 줍니다. 앱은 이 키만 환경변수로 받으면 됩니다. client secret이 바뀌어도 앱 코드는 그대로입니다.\n\n| Namespace | Secret | 키 |\n|-----------|--------|----|\n| prd, dev | `keycloak-web` | `issuer-uri`, `internal-uri`, `client-id`(=web), `client-secret` |\n| prd, dev | `keycloak-api` | `issuer-uri`, `jwk-set-uri`(클러스터 안 주소), `audience`(=api) |\n| console | `keycloak-console` | `issuer-uri`, `internal-uri`, `client-id`(=console), `client-secret` — prd realm, `admin` 역할만 허용 예정 |\n| dev | `keycloak-tester` | `username`, `password` (확인용) |\n\n- **issuer**는 항상 공개 주소입니다. 브라우저가 보는 주소와 토큰 안의 `iss`가 같아야 합니다.\n- 서버끼리 통신(토큰 교환, JWKS)은 `internal-uri`·`jwk-set-uri`로 클러스터 안에서 끝납니다. 터널을 거치지 않습니다.\n- Spring 예 (api, Resource Server):\n  ```yaml\n  spring.security.oauth2.resourceserver.jwt:\n    issuer-uri: ${KEYCLOAK_ISSUER_URI}     # iss 검증\n    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}   # 키는 클러스터 안에서\n    audiences: ${KEYCLOAK_AUDIENCE}\n  ```\n- 서비스 카탈로그(`services.auto.tfvars.json`)의 `secret_env`로 Deployment에 연결합니다 (2026-10-25 연결):\n  ```json\n  \"web\": { \"secret_env\": { \"KEYCLOAK_CLIENT_SECRET\": { \"secret\": \"keycloak-web\", \"key\": \"client-secret\" }, ... } }\n  ```\n  | 서비스 | 환경변수 ← Secret 키 |\n  |---|---|\n  | api | `KEYCLOAK_ISSUER_URI` ← issuer-uri, `KEYCLOAK_JWK_SET_URI` ← jwk-set-uri, `KEYCLOAK_AUDIENCE` ← audience |\n  | web | `KEYCLOAK_ISSUER_URI` ← issuer-uri, `KEYCLOAK_INTERNAL_URI` ← internal-uri, `KEYCLOAK_CLIENT_ID` ← client-id, `KEYCLOAK_CLIENT_SECRET` ← client-secret |\n\n## 7. 소셜 로그인 추가\n\n1. 각 서비스 개발자 콘솔에서 OAuth 앱을 만들고, redirect URI 두 개를 등록합니다:\n   - `https://auth.claudharmony.io/realms/claudharmony/broker/<alias>/endpoint`\n   - `https://auth.claudharmony.io/realms/claudharmony-dev/broker/<alias>/endpoint`\n   - `<alias>` = `google` | `github` | `kakao` | `naver`\n2. Mac에 `~/.claudharmony/identity.env`(chmod 600, 저장소 밖)를 만듭니다:\n   ```bash\n   GOOGLE_CLIENT_ID=...\n   GOOGLE_CLIENT_SECRET=...\n   KAKAO_CLIENT_ID=...        # 카카오: REST API 키, 보안 → Client Secret, 카카오 로그인 → OpenID Connect 활성화\n   KAKAO_CLIENT_SECRET=...\n   NAVER_CLIENT_ID=...        # 네이버 개발자센터 → 애플리케이션 등록 (네이버 로그인), Callback URL 위 두 개\n   NAVER_CLIENT_SECRET=...\n   ```\n3. `scripts/infra.sh realms apply` — 값이 있는 것만 생깁니다(`social.tf`).\n\n| 서비스 | 방식 | 상태 |\n|--------|------|------|\n| Google | Keycloak 내장 | 키 대기 |\n| GitHub | Keycloak 내장 (`keycloak_oidc_github_identity_provider`) | 키 대기 |\n| 카카오 | 표준 OIDC (`kauth.kakao.com`) | 키 대기 |\n| 네이버 | OIDC 미지원 → Keycloak 기본 **OAuth 2.0** 공급자(`provider_id = oauth2`), 사용자 정보는 `response.id/email/name` (앱 세션 제공 설정). alias `naver` 고정 — 테마 버튼 색 | 키 대기 |\n\n## 8. 막혔던 곳\n\n| 증상 | 원인 | 해결 |\n|------|------|------|\n| Keycloak Pod 재시작 2회 | DB(CNPG)보다 먼저 떠서 접속 실패 | Deployment에 `depends_on = [module.db]` |\n| 관리 콘솔이 빈 화면 | 관리 콘솔은 `auth.localhost`인데, master realm 로그인은 공개 주소(`KC_HOSTNAME`)로 감. 그 경로는 일부러 막아 둠 | master realm **Frontend URL**만 `http://auth.localhost`로 덮어씀 (`terraform_data` + REST) |\n| Terraform이 `auth.localhost`에 못 붙음 | `*.localhost`는 브라우저만 풀어 줌 | `infra.sh realms`가 port-forward를 열고 닫음 |\n| 공개 주소 리다이렉트가 `http://`로 나감 | RequestRedirect에 scheme 미지정 → 요청 scheme(http, 터널 안쪽)을 따라감 | `scheme = \"https\"` |\n| `client_auth_method` 인자 없음 | provider 5.10에는 그 인자가 없음 | `extra_config = { clientAuthMethod = ... }` |\n| edge apply 자동 실행 거부 | 공개 DNS 변경이라 자동 권한 검사가 차단 | 사람이 직접 실행 |\n| 로그인 직후 `/token` 403 `Invalid origin`, 로그에 \"Non-secure context\" | Cloudflare는 `X-Forwarded-Proto: https`를 보내지만 **Envoy가 자기 연결(http) 기준으로 덮어씀** → Keycloak이 http로 판단해 https Origin과 불일치 | 공개 HTTPRoute에 `RequestHeaderModifier`로 `X-Forwarded-Proto: https` 고정 (그 호스트는 터널=https로만 들어옴) |\n| 계정 화면 \"Something went wrong\", `/account/...` 401 | `keycloak_default_roles`가 기본 역할을 **덮어씀** → `account/view-profile`·`manage-account`가 빠져 토큰에 aud=account 없음 | default_roles에 `account/*` 두 개를 다시 포함 |\n| 전체 장애 (prd·dev 502/530) | Docker VM 7.65GB에 여러 프로젝트 + Keycloak → swap 고갈 | Docker Desktop 메모리 20GB로 증설 ([작업 기록 #41, #43](07-worklog.md)) |\n\n## 9. 다음\n\n- [x] `auth.claudharmony.io` DNS (edge apply, 사용자 실행) — 공개 경로 200, `/admin`·master 302 확인\n- [x] 공개 로그인 화면·로그인 후 계정 화면 확인 (스크린샷 4-4)\n- [ ] 소셜 로그인 키 등록 (Google·카카오부터)\n- [ ] 앱 연동 (앱 세션): web 로그인, api JWT 검증, console `admin` 역할 → Cloudflare Access 대신 Keycloak으로 콘솔 보호\n- [ ] SMTP (비밀번호 재설정·이메일 인증)\n- [ ] bootstrap client를 영구 `terraform` 서비스 계정으로 교체\n- [x] 로그인 화면 테마 — 이미지 `20261024-b007757`, dev·prd realm 적용 (Cloudflare가 `/resources/`를 30일 캐시 → 테마는 CSS에 `?v=` 버전)\n"}];
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({startOnLoad:false, theme: dark ? 'dark' : 'neutral'});
const renderer = new marked.Renderer();
renderer.code = (code, lang) => lang === 'mermaid'
  ? `<pre class="mermaid">${code}</pre>`
  : `<pre><code>${code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</code></pre>`;
renderer.table = (h, b) => `<div class="tbl"><table><thead>${h}</thead><tbody>${b}</tbody></table></div>`;
// md 간 링크(01-architecture.md) → 페이지 전환
renderer.link = (href, title, text) => {
  const m = href && href.match(/^([0-9]{2}[^/]*)\.md$/);
  return m ? `<a href="#${m[1]}">${text}</a>` : `<a href="${href}">${text}</a>`;
};
marked.setOptions({renderer});
const toc = document.getElementById('toc'), content = document.getElementById('content');
PAGES.forEach(p => {
  const title = (p.md.match(/^# (.+)$/m) || [, p.id])[1];
  const a = Object.assign(document.createElement('a'), {href: '#' + p.id, textContent: title});
  a.dataset.id = p.id; toc.appendChild(a);
});
async function show(){
  const id = location.hash.slice(1) || PAGES[0].id;
  const p = PAGES.find(x => x.id === id) || PAGES[0];
  content.innerHTML = marked.parse(p.md);
  toc.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
  await mermaid.run({nodes: content.querySelectorAll('.mermaid')});
  scrollTo(0, 0);
}
addEventListener('hashchange', show); show();
</script>
